          const normalized = {
            issuer: claims.iss,
            audience: claims.aud,
            subject: claims.sub,
            repository: claims.repository,
            repositoryId: claims.repository_id,
            repositoryOwnerId: claims.repository_owner_id,
            ref: claims.ref,
            sha: claims.sha,
            runId: String(claims.run_id),
            runAttempt: String(claims.run_attempt),
            workflowRef: claims.workflow_ref
          };
          fs.writeFileSync('oidc-claims.json', `${JSON.stringify(normalized)}\n`);
          fs.writeFileSync('oidc-token-sha256.txt', `sha256:${createHash('sha256').update(token).digest('hex')}\n`);
          NODE
          OIDC_TOKEN_SHA256=$(tr -d '\n' < oidc-token-sha256.txt)
          OIDC_CLAIMS=$(jq -c . oidc-claims.json)
          jq -n \
            --arg repository '2hg7trp7rv-design/cats_tower' \
            --arg branch 'kimi' \
            --arg commit "$GITHUB_SHA" \
            --arg tree "$TREE" \
            --argjson runId "$GITHUB_RUN_ID" \
            --argjson runAttempt "$GITHUB_RUN_ATTEMPT" \
            --arg oidcTokenSha256 "$OIDC_TOKEN_SHA256" \
            --argjson oidcClaims "$OIDC_CLAIMS" \
            --arg activeChangeControl "$ACTIVE" \
            --arg step2 "$STEP2" \
            --arg activeSeal "$ACTIVE_SEAL" \
            --arg verdict "$VERDICT" \
            --argjson activeBindingCount "$ACTIVE_BINDING_COUNT" \
            '{
              schemaVersion: 1,
              artifactId: "cats-tower-current-governance-result",
              repository: $repository,
              branch: $branch,
              commit: $commit,
              tree: $tree,
              runId: $runId,
              runAttempt: $runAttempt,
              oidcTokenSha256: $oidcTokenSha256,
              oidcClaims: $oidcClaims,
              oidcVerified: true,
              activeChangeControl: $activeChangeControl,
              verdict: $verdict,
              step1: "PASS_CANONICAL",
              step2: $step2,
