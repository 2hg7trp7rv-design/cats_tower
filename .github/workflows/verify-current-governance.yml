          const expectedWorkflowRef = `${process.env.GITHUB_REPOSITORY}/.github/workflows/verify-current-governance.yml@${process.env.GITHUB_REF}`;
          const exact = claims.iss === 'https://token.actions.githubusercontent.com' &&
            claims.aud === 'cats-tower-current-governance' &&
            claims.sub === expectedSubject &&
            claims.repository === process.env.GITHUB_REPOSITORY &&
            claims.repository_id === '1331488679' &&
            claims.repository_owner_id === '245031448' &&
            claims.ref === process.env.GITHUB_REF &&
            claims.sha === process.env.GITHUB_SHA &&
            claims.workflow_sha === process.env.GITHUB_SHA &&
            claims.workflow_ref === expectedWorkflowRef &&
            String(claims.run_id) === process.env.GITHUB_RUN_ID &&
            String(claims.run_attempt) === process.env.GITHUB_RUN_ATTEMPT;
