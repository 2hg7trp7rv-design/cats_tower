      - name: Write machine-readable governance evidence
        run: |
          set -euo pipefail
          TREE=$(git rev-parse 'HEAD^{tree}')
          ACTIVE=$(jq -r '.activeChangeControl' CURRENT_AUTHORITY_INDEX.json)
          STEP2=$(jq -r '.executableContract.step2Status' CURRENT_AUTHORITY_INDEX.json)
