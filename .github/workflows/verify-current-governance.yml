name: Verify Cat's Tower current authority

on:
  push:
    branches: [kimi]
  workflow_dispatch:

permissions: {}

concurrency:
  group: cats-current-governance-${{ github.sha }}
  cancel-in-progress: false

jobs:
  semantic-verification:
    name: semantic-verification-no-credentials
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'

      - name: Confirm exact source commit without credentials
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = '2hg7trp7rv-design/cats_tower'
          test "$GITHUB_REF" = 'refs/heads/kimi'
          case "$GITHUB_EVENT_NAME" in push|workflow_dispatch) ;; *) exit 1 ;; esac
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          test "$(git rev-parse --is-shallow-repository)" = 'false'
          test -z "$(git replace -l)"
          test -z "$(git config --local --get-regexp '^http\..*\.extraheader$' || true)"
          test "$(git ls-tree HEAD -- simulation/lib-v2/schema-validator.mjs)" = $'100644 blob 5e2694e8c2c9eb3677fd132382b5f595706f0801\tsimulation/lib-v2/schema-validator.mjs'
          test -z "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}"
          test -z "${ACTIONS_ID_TOKEN_REQUEST_URL:-}"

      - name: Verify current authority semantics without live credentials
        run: node tests/governance/verify-current-authority.mjs --semantic-only

      - name: Validate the immutable Step 2 seal at current HEAD
        run: node simulation/validate-executable-seal-v2.mjs simulation/executable-seal-v2.json

      - name: Validate the versioned Step 2 v3 correction when present
        run: |
          set -euo pipefail
          if test -f simulation/candidate-v3.json; then
            node simulation/validate-candidate-v3.mjs simulation/candidate-v3.json
            node simulation/validate-execution-contract-v3.mjs simulation/execution-contract-v3.json
            node simulation/validate-run-plan-v3.mjs simulation/run-plan-v3.json
            node simulation/fixtures/v3/validate-fixtures.mjs
            node simulation/validate-result-v3.mjs quality-reviews/step-2-executable-contract-v2/supplement-screen-projection-round-001/qualification-result-v3.json
            node simulation/verify-step2-v3.mjs
            node tests/governance/verify-step2-screen-projection-round-032.mjs
          fi

      - name: Re-run the source-bound Step 2 verifier in an intact historical worktree
        run: |
          set -euo pipefail
          ENTRY=$(jq -r '.entry.head' quality-reviews/step-1-canonical-design/active-change-control-addendum-round-028.json)
          DIR="$RUNNER_TEMP/step2-source-bound"
          test ! -e "$DIR"
          git worktree add --detach "$DIR" "$ENTRY"
          test "$(git -C "$DIR" rev-parse HEAD)" = "$ENTRY"
          (
            cd "$DIR"
            node simulation/verify-step2-v2.mjs
          )

  current-authority:
    name: current-authority
    needs: semantic-verification
    permissions:
      contents: read
      actions: read
      attestations: read
      deployments: read
      statuses: read
      id-token: write
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'

      - name: Confirm exact source commit
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = '2hg7trp7rv-design/cats_tower'
          test "$GITHUB_REF" = 'refs/heads/kimi'
          case "$GITHUB_EVENT_NAME" in push|workflow_dispatch) ;; *) exit 1 ;; esac
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          test "$(git rev-parse --is-shallow-repository)" = 'false'
          test -z "$(git replace -l)"
          test -z "$(git config --local --get-regexp '^http\..*\.extraheader$' || true)"
          test "$(git ls-tree HEAD -- simulation/lib-v2/schema-validator.mjs)" = $'100644 blob 5e2694e8c2c9eb3677fd132382b5f595706f0801\tsimulation/lib-v2/schema-validator.mjs'

      - name: Verify current authority, mirrors, source replacement and deletion boundary
        env:
          GH_TOKEN: ${{ github.token }}
        run: node tests/governance/verify-current-authority.mjs --require-live-actions --skip-candidate-execution

      - name: Parse current JSON documents
        run: |
          set -euo pipefail
          jq -e . CURRENT_AUTHORITY_INDEX.json >/dev/null
          jq -e . PROJECT_STATUS.json >/dev/null
          jq -e . AI_PROJECT_POLICY.json >/dev/null
          jq -e . simulation/CURRENT_STATUS.json >/dev/null
          jq -e . quality-reviews/step-1-canonical-design/active-change-control.json >/dev/null
          jq -e . quality-reviews/step-1-canonical-design/active-change-control-addendum-round-027.json >/dev/null
          jq -e . quality-reviews/step-1-canonical-design/active-change-control-addendum-round-028.json >/dev/null
          jq -e . quality-reviews/step-1-canonical-design/active-change-control-addendum-round-029.json >/dev/null
          jq -e . quality-reviews/step-1-canonical-design/active-change-control-addendum-round-030.json >/dev/null
          jq -e . quality-reviews/step-1-canonical-design/active-change-control-addendum-round-031.json >/dev/null
          jq -e . quality-reviews/phase-0-governance-recovery/acceptance-matrix.json >/dev/null
          jq -e . quality-reviews/phase-0-governance-recovery/acceptance-addendum-round-001.json >/dev/null
          jq -e . quality-reviews/phase-0-governance-recovery/critic-summary-round-002.json >/dev/null
          jq -e . quality-reviews/phase-0-governance-recovery/evidence-supersession-register.json >/dev/null
          OPTIONAL_JSON=()
          for round in 034 035 036 037 038 039 040 041 042 043 044; do
            OPTIONAL_JSON+=("quality-reviews/step-1-canonical-design/active-change-control-addendum-round-${round}.json")
          done
          for round in 006 007 008 009 010 011 012; do
            OPTIONAL_JSON+=("quality-reviews/step-1-hero-merchant-large-idle-integration/user-decision-lock-round-${round}.json")
          done
          for round in 013 014; do
            OPTIONAL_JSON+=("quality-reviews/step-1-canonical-design/governance-activation-record-round-${round}.json")
          done
          for optional_json in "${OPTIONAL_JSON[@]}"; do
            if test -f "$optional_json"; then jq -e . "$optional_json" >/dev/null; fi
          done
          if test -f quality-reviews/step-1-canonical-design/active-change-control-addendum-round-030.json; then
            jq -e . quality-reviews/step-1-canonical-design/active-change-control-addendum-round-030.json >/dev/null
            jq -e . quality-reviews/phase-0-governance-recovery/step2-source-compatibility.json >/dev/null
            jq -e . quality-reviews/phase-0-governance-recovery/critic-summary.json >/dev/null
            jq -e . quality-reviews/phase-0-governance-recovery/final-judge.json >/dev/null
            jq -e . quality-reviews/phase-0-governance-recovery/completion-evidence.json >/dev/null
            jq -e . quality-reviews/phase-0-governance-recovery/live-readback.json >/dev/null
          fi

      - name: Reject non-Markdown whitespace defects in governed Phase 0 changes
        run: |
          set -euo pipefail
          ROOT_ENTRY=$(jq -r '.entry.head' quality-reviews/step-1-canonical-design/active-change-control-addendum-round-028.json)
          git diff --check "$ROOT_ENTRY"..HEAD -- . ':(exclude)*.md'

      - name: Generate external S02 Preview proof
        if: >-
          ${{
            (hashFiles('quality-reviews/step-4-twelve-screen-final-mockups/s02-golden-master-p1-deployment-readback-request-round-001.json') != '' && hashFiles('quality-reviews/step-4-twelve-screen-final-mockups/s02-golden-master-p1-deployment-readback-round-001.json') == '') ||
            (hashFiles('quality-reviews/step-4-twelve-screen-final-mockups/s02-golden-master-p1-deployment-readback-request-round-002.json') != '' && hashFiles('quality-reviews/step-4-twelve-screen-final-mockups/s02-golden-master-p1-deployment-readback-round-002.json') == '') ||
            (hashFiles('quality-reviews/step-4-twelve-screen-final-mockups/s02-golden-master-p1-deployment-readback-request-round-003.json') != '' && hashFiles('quality-reviews/step-4-twelve-screen-final-mockups/s02-golden-master-p1-deployment-readback-round-003.json') == '') ||
            (hashFiles('quality-reviews/step-4-twelve-screen-final-mockups/s02-golden-master-p1-deployment-readback-request-round-004.json') != '' && hashFiles('quality-reviews/step-4-twelve-screen-final-mockups/s02-golden-master-p1-deployment-readback-round-004.json') == '') ||
            hashFiles('quality-reviews/step-4-twelve-screen-final-mockups/s02-golden-master-p1-access-renewal-round-*-*-request.json') != ''
          }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          PENDING=()
          for round in 001 002 003 004; do
            request="quality-reviews/step-4-twelve-screen-final-mockups/s02-golden-master-p1-deployment-readback-request-round-${round}.json"
            readback="quality-reviews/step-4-twelve-screen-final-mockups/s02-golden-master-p1-deployment-readback-round-${round}.json"
            if test -f "$request" && test ! -f "$readback"; then PENDING+=("$request"); fi
          done
          shopt -s nullglob
          for request in quality-reviews/step-4-twelve-screen-final-mockups/s02-golden-master-p1-access-renewal-round-???-???-request.json; do
            readback="${request%-request.json}-readback.json"
            if test ! -f "$readback"; then PENDING+=("$request"); fi
          done
          shopt -u nullglob
          if test "${#PENDING[@]}" -eq 0; then exit 0; fi
          test "${#PENDING[@]}" -eq 1
          S02_PREVIEW_REQUEST="${PENDING[0]}"
          export S02_PREVIEW_REQUEST
          REQUEST_COMMIT=$(git log --diff-filter=A --format=%H -- "$S02_PREVIEW_REQUEST" | tail -n 1)
          CORRECTION='quality-reviews/step-4-twelve-screen-final-mockups/s02-golden-master-p1-external-preview-verifier-correction-round-001.json'
          REDIRECT_CORRECTION='quality-reviews/step-4-twelve-screen-final-mockups/s02-golden-master-p1-external-preview-redirect-correction-round-002.json'
          BROWSER_CORRECTION='quality-reviews/step-4-twelve-screen-final-mockups/s02-golden-master-p1-external-preview-browser-correction-round-003.json'
          if test -f "$BROWSER_CORRECTION"; then
            test "$(git log --diff-filter=A --format=%H -- "$BROWSER_CORRECTION" | tail -n 1)" = "$GITHUB_SHA"
            test "$(git rev-parse HEAD^)" = "$(jq -er '.entry.head' "$BROWSER_CORRECTION")"
            test "$(jq -er '.request.commit' "$BROWSER_CORRECTION")" = "$REQUEST_COMMIT"
          elif test -f "$REDIRECT_CORRECTION"; then
            test "$(git log --diff-filter=A --format=%H -- "$REDIRECT_CORRECTION" | tail -n 1)" = "$GITHUB_SHA"
            test "$(git rev-parse HEAD^)" = "$(jq -er '.entry.head' "$REDIRECT_CORRECTION")"
            test "$(jq -er '.request.commit' "$REDIRECT_CORRECTION")" = "$REQUEST_COMMIT"
          elif test -f "$CORRECTION"; then
            test "$(git log --diff-filter=A --format=%H -- "$CORRECTION" | tail -n 1)" = "$GITHUB_SHA"
            test "$(git rev-parse HEAD^)" = "$REQUEST_COMMIT"
            test "$(jq -er '.entry.head' "$CORRECTION")" = "$REQUEST_COMMIT"
          else
            test "$REQUEST_COMMIT" = "$GITHUB_SHA"
          fi
          CONTENT_SHA=$(jq -er '.verifiedContent.commit' "$S02_PREVIEW_REQUEST")
          test "$(jq -er '.branch' "$S02_PREVIEW_REQUEST")" = 'kimi'
          (
            cd step4/s02/golden-master-p1/browser-qa
            env -u GH_TOKEN -u ACTIONS_ID_TOKEN_REQUEST_TOKEN -u ACTIONS_ID_TOKEN_REQUEST_URL npm ci --ignore-scripts
            env -u GH_TOKEN -u ACTIONS_ID_TOKEN_REQUEST_TOKEN -u ACTIONS_ID_TOKEN_REQUEST_URL npx --no-install playwright install --with-deps chromium
          )
          mkdir -p external
          gh api --method GET \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "/repos/2hg7trp7rv-design/cats_tower/statuses/${CONTENT_SHA}?per_page=100" \
            > external/github-commit-statuses-content.json
          OIDC_RESPONSE=$(curl --fail --silent --show-error \
            -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=cats-tower-current-governance")
          OIDC_TOKEN=$(jq -er '.value' <<<"$OIDC_RESPONSE")
          export OIDC_TOKEN
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';
          import { pathToFileURL } from 'node:url';
          import { createHash } from 'node:crypto';
          import { execFileSync } from 'node:child_process';

          const requestPath = process.env.S02_PREVIEW_REQUEST;
          const request = JSON.parse(fs.readFileSync(requestPath, 'utf8'));
          const correctionPath = 'quality-reviews/step-4-twelve-screen-final-mockups/s02-golden-master-p1-external-preview-verifier-correction-round-001.json';
          const correction = JSON.parse(fs.readFileSync(correctionPath, 'utf8'));
          const browserCorrectionPath = 'quality-reviews/step-4-twelve-screen-final-mockups/s02-golden-master-p1-external-preview-browser-correction-round-003.json';
          const browserCorrection = fs.existsSync(browserCorrectionPath) ? JSON.parse(fs.readFileSync(browserCorrectionPath, 'utf8')) : null;
          const raw = {
            commitStatuses: fs.readFileSync('external/github-commit-statuses-content.json')
          };
          const commitStatuses = JSON.parse(raw.commitStatuses.toString('utf8'));
          const commitStatus = commitStatuses.find(row => row.context === 'Vercel' && row.creator?.login === 'vercel[bot]' && row.creator?.id === 35613825 && row.creator?.type === 'Bot');
          if (commitStatus?.state !== 'success') throw new Error('LATEST_VERCEL_PREVIEW_NOT_SUCCESS');
          const targetMatch = /^https:\/\/vercel\.com\/shinyaaas-projects\/cats_tower\/([A-Za-z0-9]+)$/.exec(commitStatus.target_url || '');
          if (!targetMatch) throw new Error('VERCEL_STATUS_TARGET_URL_INVALID');
          const observedDeployment = correction.vercelObservation;
          if (observedDeployment.provider !== 'VERCEL_AUTHENTICATED_CONNECTOR' || observedDeployment.deploymentId !== `dpl_${targetMatch[1]}` || observedDeployment.state !== 'READY' || observedDeployment.target !== null || observedDeployment.environment !== 'Preview' || observedDeployment.source !== 'git' || observedDeployment.githubCommitSha !== request.verifiedContent.commit || observedDeployment.githubCommitRef !== 'kimi' || observedDeployment.branchAlias !== request.review.branchAlias) throw new Error('VERCEL_CONNECTOR_OBSERVATION_MISMATCH');
          const assertUrl = value => {
            const url = new URL(value);
            if (url.protocol !== 'https:' || url.username || url.password || url.port || !/^[a-z0-9-]+\.vercel\.app$/.test(url.hostname)) throw new Error(`UNTRUSTED_VERCEL_URL:${value}`);
            return url.origin;
          };
          const immutableOrigin = assertUrl(observedDeployment.immutableUrl);
          const aliasOrigin = assertUrl(request.review.branchAlias);
          if (immutableOrigin === aliasOrigin) throw new Error('IMMUTABLE_DEPLOYMENT_EQUALS_BRANCH_ALIAS');
          const effectiveTemporaryAccess = browserCorrection?.temporaryAccessReplacement ?? request.review.temporaryAccess;
          const temporaryAccessUrl = new URL(effectiveTemporaryAccess.url);
          if (effectiveTemporaryAccess.kind !== 'VERCEL_TEMPORARY_SHARE_23H' || temporaryAccessUrl.protocol !== 'https:' || temporaryAccessUrl.username || temporaryAccessUrl.password || temporaryAccessUrl.port || temporaryAccessUrl.origin !== aliasOrigin || temporaryAccessUrl.pathname !== request.review.route || temporaryAccessUrl.hash || [...temporaryAccessUrl.searchParams.keys()].join(',') !== '_vercel_share') throw new Error('TEMPORARY_PREVIEW_ACCESS_INVALID');
          const shareToken = temporaryAccessUrl.searchParams.get('_vercel_share');
          if (!/^[A-Za-z0-9_-]{16,512}$/.test(shareToken || '') || Date.parse(effectiveTemporaryAccess.expiresAt) <= Date.now()) throw new Error('TEMPORARY_PREVIEW_ACCESS_EXPIRED_OR_INVALID');
          const playwrightModule = path.join(process.cwd(), 'step4/s02/golden-master-p1/browser-qa/node_modules/playwright/index.mjs');
          const { chromium } = await import(pathToFileURL(playwrightModule).href);
          const browser = await chromium.launch({ headless: true });
          const contexts = new Map();
          try {
          let aggregateResponseBytes = 0;
          const validateFetchUrl = value => {
            const url = new URL(value);
            if (url.protocol !== 'https:' || url.username || url.password || url.port || ![immutableOrigin, aliasOrigin].includes(url.origin)) throw new Error(`UNTRUSTED_FETCH_URL:${url.href}`);
            return url;
          };
          const route = request.review.route;
          const routePaths = [route, route.replace(/\/$/, '')];
          const authenticateOrigin = async origin => {
            const context = await browser.newContext({ serviceWorkers: 'block' });
            const page = await context.newPage();
            const accessUrl = new URL(route, origin);
            accessUrl.searchParams.set('_vercel_share', shareToken);
            try {
              await page.goto(accessUrl.href, { waitUntil: 'domcontentloaded', timeout: 60_000 });
              await page.waitForFunction(
                labels => labels.every(label => document.documentElement.textContent?.includes(label)),
                request.review.requiredLabels,
                { timeout: 60_000 }
              );
              const finalUrl = validateFetchUrl(page.url());
              if (finalUrl.username || finalUrl.password || finalUrl.port || finalUrl.origin !== origin || !routePaths.includes(finalUrl.pathname) || finalUrl.hash || [...finalUrl.searchParams.keys()].some(key => key !== '_vercel_share')) throw new Error(`UNEXPECTED_BROWSER_FINAL_URL:${finalUrl.href}`);
              contexts.set(origin, context);
            } catch (error) {
              await context.close();
              throw error;
            } finally {
              await page.close();
            }
          };
          for (const origin of [immutableOrigin, aliasOrigin]) await authenticateOrigin(origin);
          const fetchBounded = async (value, cap, allowedPaths) => {
            const url = validateFetchUrl(value);
            if (!allowedPaths.includes(url.pathname) || url.search || url.hash) throw new Error(`UNEXPECTED_FETCH_PATH:${url.href}`);
            const context = contexts.get(url.origin);
            if (!context) throw new Error(`UNAUTHENTICATED_FETCH_ORIGIN:${url.origin}`);
            const cookies = await context.cookies(url.href);
            const cookieHeader = cookies.map(cookie => `${cookie.name}=${cookie.value}`).join('; ');
            if (!cookieHeader) throw new Error(`VERCEL_BROWSER_COOKIE_MISSING:${url.origin}`);
            const response = await fetch(url.href, {
              redirect: 'manual',
              signal: AbortSignal.timeout(40_000),
              headers: { cookie: cookieHeader, 'accept-encoding': 'identity', 'user-agent': 'cats-tower-s02-preview-proof/3' }
            });
            if (response.status >= 300 && response.status < 400) throw new Error(`UNEXPECTED_AUTHENTICATED_REDIRECT:${response.status}:${response.headers.get('location') ?? ''}`);
            const chunks = [];
            let responseBytes = 0;
            const reader = response.body?.getReader();
            if (!reader) throw new Error(`HTTP_BODY_MISSING:${url.href}`);
            for (;;) {
              const { done, value: chunk } = await reader.read();
              if (done) break;
              responseBytes += chunk.byteLength;
              aggregateResponseBytes += chunk.byteLength;
              if (responseBytes > cap || aggregateResponseBytes > 60 * 1024 * 1024) {
                await reader.cancel();
                throw new Error(`HTTP_BODY_TOO_LARGE:${url.href}`);
              }
              chunks.push(Buffer.from(chunk));
            }
            const bytes = Buffer.concat(chunks, responseBytes);
            return { response, bytes, finalPath: url.pathname };
          };
          const indexPath = 'step4/s02/golden-master-p1/index.html';
          const indexBytes = execFileSync('git', ['show', `${request.verifiedContent.commit}:${indexPath}`], { encoding: null, maxBuffer: 2 * 1024 * 1024 });
          const indexBlob = execFileSync('git', ['rev-parse', `${request.verifiedContent.commit}:${indexPath}`], { encoding: 'utf8' }).trim();
          const indexSha256 = `sha256:${createHash('sha256').update(indexBytes).digest('hex')}`;
          const pageResults = [];
          for (const origin of [immutableOrigin, aliasOrigin]) {
            const { response, bytes, finalPath } = await fetchBounded(new URL(route, origin).href, 2 * 1024 * 1024, routePaths);
            const contentType = response.headers.get('content-type') || '';
            const text = bytes.toString('utf8');
            if (response.status !== 200 || !/^text\/html(?:;|$)/i.test(contentType)) throw new Error(`REVIEW_HTML_UNAVAILABLE:${origin}`);
            if (!bytes.equals(indexBytes)) throw new Error(`REVIEW_ROUTE_DOES_NOT_EQUAL_TARGET_INDEX:${origin}`);
            for (const label of request.review.requiredLabels) if (!text.includes(label)) throw new Error(`REVIEW_LABEL_MISSING:${label}`);
            for (const gm of request.review.goldenMasters) if (!text.includes(gm)) throw new Error(`GOLDEN_MASTER_MISSING:${gm}`);
            pageResults.push({ status: response.status, contentType, finalPath, sha256: `sha256:${createHash('sha256').update(bytes).digest('hex')}` });
          }
          const manifestText = execFileSync('git', ['show', `${request.verifiedContent.commit}:${request.review.manifestPath}`], { encoding: 'utf8' });
          const manifestBlob = execFileSync('git', ['rev-parse', `${request.verifiedContent.commit}:${request.review.manifestPath}`], { encoding: 'utf8' }).trim();
          if (manifestBlob !== request.review.manifestBlob) throw new Error('REVIEW_MANIFEST_BLOB_MISMATCH');
          const manifest = JSON.parse(manifestText);
          const prefix = 'step4/s02/golden-master-p1/';
          const reviewPrefix = 'quality-reviews/step-4-twelve-screen-final-mockups/';
          const exactKeys = (value, keys) => value && typeof value === 'object' && !Array.isArray(value) && JSON.stringify(Object.keys(value).sort()) === JSON.stringify([...keys].sort());
          if (!exactKeys(manifest, ['schemaVersion', 'artifactId', 'purpose', 'repository', 'branch', 'route', 'goldenMasters', 'requiredViewports', 'documents', 'routeFiles'])) throw new Error('REVIEW_MANIFEST_V2_SCHEMA_INVALID');
          const assetManifestPath = `${prefix}asset-manifest.json`;
          const assetManifest = JSON.parse(execFileSync('git', ['show', `${request.verifiedContent.commit}:${assetManifestPath}`], { encoding: 'utf8' }));
          const assetPaths = assetManifest.assets?.map(asset => asset?.path) ?? [];
          if (assetPaths.length < 1 || assetPaths.length > 80 || assetPaths.some(value => !/^assets\/[a-z0-9][a-z0-9._/-]*\.(?:webp|png|svg)$/i.test(value ?? '') || value.includes('..')) || new Set(assetPaths).size !== assetPaths.length) throw new Error('REVIEW_ASSET_GRAPH_INVALID');
          const routeTargets = [
            `${prefix}index.html`,
            `${prefix}styles.css`,
            `${prefix}app.js`,
            `${prefix}golden-master-spec.json`,
            assetManifestPath,
            ...assetPaths.map(value => `${prefix}${value}`)
          ].sort();
          const documentTargets = [
            's02-golden-master-p1-acceptance-matrix-round-001.json',
            's02-golden-master-p1-competitive-research.md',
            's02-golden-master-p1-player-experience.json',
            's02-golden-master-p1-information-priority.json',
            's02-golden-master-p1-art-direction.json',
            's02-golden-master-p1-ui-design-system.json',
            's02-golden-master-p1-asset-decomposition.json',
            's02-golden-master-p1-animation-contract.json',
            's02-golden-master-p1-data-binding-matrix.json',
            's02-golden-master-p1-responsive-contract.json',
            's02-golden-master-p1-feasibility-audit.json'
          ].map(value => `${reviewPrefix}${value}`).sort();
