name: Verify Step 4 S02 Golden Master P1

on:
  workflow_dispatch:
  push:
    branches:
      - kimi

permissions: {}

concurrency:
  group: verify-step4-s02-golden-master-p1-kimi-${{ github.sha }}
  cancel-in-progress: false

jobs:
  semantic-verification-no-credentials:
    name: Static, eight-master responsive and accessibility verification
    runs-on: ubuntu-latest
    timeout-minutes: 50
    permissions:
      contents: read
    steps:
      - name: Checkout exact kimi commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Assert repository and branch boundary
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REPOSITORY}" = "2hg7trp7rv-design/cats_tower"
          test "${GITHUB_REF_NAME}" = "kimi"
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          test -z "$(git status --porcelain)"

      - name: Verify immutable trusted harness
        shell: bash
        run: |
          set -euo pipefail
          sha256sum -c <<'SHA256'
          b712ba261f1fc66db97e54c15e833729199e17785b149b7459d0e95ddb13d011  tests/step4/verify-s02-golden-master-p1.mjs
          ec1011fb7101a420cfbc68af1dc43c4d30c659d41715d25aa0dc915d1f4b99bb  tests/step4/s02-golden-master-p1-browser.mjs
          9661cf489c3329c3119ba3cb16ee3e8ebb61848eb841adcbdd7cc28f8da2bd1e  tests/step4/s02-golden-master-p1-browser-qa.mjs
          4e7d2ae6e3da801a6ed14835a1cceebc252e369234bbb56f64fa2af34510a531  step4/s02/golden-master-p1/browser-qa/package.json
          7fcf276c46e3e02735f8ad4befe6b90c4d96736a7a94e49023333cf4ef26a8c3  step4/s02/golden-master-p1/browser-qa/package-lock.json
          SHA256
          node --check tests/step4/verify-s02-golden-master-p1.mjs
          node --check tests/step4/s02-golden-master-p1-browser.mjs
          node --check tests/step4/s02-golden-master-p1-browser-qa.mjs

      - name: Run fail-closed P1 static contracts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p semantic-evidence/screenshots
          node tests/step4/verify-s02-golden-master-p1.mjs > semantic-evidence/static-report.json
          jq -e '.verdict == "PASS_S02_GOLDEN_MASTER_P1_STATIC" and (.failures | length) == 0' semantic-evidence/static-report.json

      - name: Install exact Node runtime
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.18.0
          cache: npm
          cache-dependency-path: step4/s02/golden-master-p1/browser-qa/package-lock.json

      - name: Install locked Playwright and Chromium
        shell: bash
        run: |
          set -euo pipefail
          cd step4/s02/golden-master-p1/browser-qa
          npm ci --ignore-scripts
          npx --no-install playwright install --with-deps chromium

      - name: Start exact-head static review
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/s02-gm-p1-http.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error http://127.0.0.1:4173/step4/s02/golden-master-p1/ > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          sed -n '1,200p' /tmp/s02-gm-p1-http.log
          exit 1

      - name: Start exact immediate-prior baseline review for revision
        shell: bash
        run: |
          set -euo pipefail
          revision_control='quality-reviews/step-1-canonical-design/active-change-control-addendum-round-036.json'
          lock_007='quality-reviews/step-1-hero-merchant-large-idle-integration/user-decision-lock-round-007.json'
          lock_009='quality-reviews/step-1-hero-merchant-large-idle-integration/user-decision-lock-round-009.json'
          lock_011='quality-reviews/step-1-hero-merchant-large-idle-integration/user-decision-lock-round-011.json'
          if [[ ! -f "${lock_007}" && ! -f "${lock_009}" && ! -f "${lock_011}" ]]; then
            exit 0
          fi
          test -f "${revision_control}"
          test -f "${lock_007}"
          if [[ -f "${lock_011}" ]]; then test -f "${lock_009}"; prior_round='003';
          elif [[ -f "${lock_009}" ]]; then prior_round='002';
          else prior_round='001'; fi
          prior_critic="quality-reviews/step-4-twelve-screen-final-mockups/s02-golden-master-p1-independent-critic-round-${prior_round}.json"
          test -f "${prior_critic}"
          baseline_commit="$(jq -er '.auditTarget.commit | select(test("^[a-f0-9]{40}$"))' "${prior_critic}")"
          baseline_tree="$(jq -er '.auditTarget.tree | select(test("^[a-f0-9]{40}$"))' "${prior_critic}")"
          git cat-file -e "${baseline_commit}^{commit}"
          test "$(git rev-parse "${baseline_commit}^{tree}")" = "${baseline_tree}"
          test "${baseline_commit}" != "${GITHUB_SHA}"
          git merge-base --is-ancestor "${baseline_commit}" "${GITHUB_SHA}"
          git worktree add --detach /tmp/cats-tower-s02-immediate-prior "${baseline_commit}"
          python3 -m http.server 4174 --bind 127.0.0.1 --directory /tmp/cats-tower-s02-immediate-prior > /tmp/s02-gm-p1-baseline-http.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error http://127.0.0.1:4174/step4/s02/golden-master-p1/ > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          sed -n '1,200p' /tmp/s02-gm-p1-baseline-http.log
          exit 1

      - name: Capture and verify eight masters plus required responsive variants
        shell: bash
        run: |
          set -euo pipefail
          node tests/step4/s02-golden-master-p1-browser.mjs
          node tests/step4/s02-golden-master-p1-browser-qa.mjs
          jq -e '.verdict == "PASS_S02_GOLDEN_MASTER_P1_BROWSER" and (.failures | length) == 0 and (.screenshots | length) == 15' semantic-evidence/browser-report.json
          test "$(find semantic-evidence/screenshots -maxdepth 1 -type f -name '*.png' | wc -l | tr -d ' ')" = "15"
          revision_control='quality-reviews/step-1-canonical-design/active-change-control-addendum-round-036.json'
          lock_007='quality-reviews/step-1-hero-merchant-large-idle-integration/user-decision-lock-round-007.json'
          lock_009='quality-reviews/step-1-hero-merchant-large-idle-integration/user-decision-lock-round-009.json'
          lock_011='quality-reviews/step-1-hero-merchant-large-idle-integration/user-decision-lock-round-011.json'
          if [[ -f "${lock_007}" || -f "${lock_009}" || -f "${lock_011}" ]]; then
            test -f "${revision_control}"
            test -f "${lock_007}"
            if [[ -f "${lock_011}" ]]; then test -f "${lock_009}"; evidence_round='004';
            elif [[ -f "${lock_009}" ]]; then evidence_round='003';
            else evidence_round='002'; fi
            jq -e --arg artifact "cats-tower-s02-golden-master-p1-revision-comparison-round-${evidence_round}" '.artifactId == $artifact and .verdict == "PASS_S02_USER_REVISION_SAME_RUN_COMPARISON" and (.failures | length) == 0 and (.comparisons | length) == 8 and (.requestMeasurements | length) > 0 and all(.requestMeasurements[]; .status == "PASS" and (.assertions | length) > 0 and all(.assertions[]; .status == "PASS" and (.criterionSha256 | test("^sha256:[a-f0-9]{64}$")))) and (.assetParticipation | type) == "array" and (.requestedChangesSha256 | test("^sha256:[a-f0-9]{64}$")) and (.acceptanceCriteriaSha256 | test("^sha256:[a-f0-9]{64}$"))' semantic-evidence/revision/revision-comparison.json
            test "$(find semantic-evidence/revision/before -maxdepth 1 -type f -name '*.png' | wc -l | tr -d ' ')" = "8"
          else
            test ! -e semantic-evidence/revision
          fi

      - name: Upload uncredentialed semantic evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: step4-s02-golden-master-p1-semantic-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          retention-days: 1
          compression-level: 6
          path: |
            semantic-evidence/static-report.json
            semantic-evidence/browser-raw.json
            semantic-evidence/browser-report.json
            semantic-evidence/screenshots/GM01-390x844.png
            semantic-evidence/screenshots/GM02-320x667.png
            semantic-evidence/screenshots/GM03-375x667.png
            semantic-evidence/screenshots/GM04-320x568.png
            semantic-evidence/screenshots/GM05-430x932.png
            semantic-evidence/screenshots/GM06-390x844.png
            semantic-evidence/screenshots/GM07-390x844.png
            semantic-evidence/screenshots/GM08-390x844.png
            semantic-evidence/screenshots/RV360-360x800.png
            semantic-evidence/screenshots/RV412-412x915.png
            semantic-evidence/screenshots/SAFE390-390x844.png
            semantic-evidence/screenshots/TEXT200-320x568.png
            semantic-evidence/screenshots/GM07C320-320x568.png
            semantic-evidence/screenshots/GM07C320TEXT200-320x568.png
            semantic-evidence/screenshots/TEXT200SAFE-320x568.png
            semantic-evidence/revision/browser-before-raw.json
            semantic-evidence/revision/revision-comparison.json
            semantic-evidence/revision/before/GM01-390x844.png
            semantic-evidence/revision/before/GM02-320x667.png
            semantic-evidence/revision/before/GM03-375x667.png
            semantic-evidence/revision/before/GM04-320x568.png
            semantic-evidence/revision/before/GM05-430x932.png
            semantic-evidence/revision/before/GM06-390x844.png
            semantic-evidence/revision/before/GM07-390x844.png
            semantic-evidence/revision/before/GM08-390x844.png

  evidence-provenance:
    name: S02 evidence provenance
    needs: semantic-verification-no-credentials
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: read
      attestations: write
      contents: read
      id-token: write
    steps:
      - name: Checkout exact kimi commit for provenance
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Download exact semantic evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: step4-s02-golden-master-p1-semantic-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: semantic-evidence

      - name: Write signed S02 evidence result
        shell: bash
        env:
          EXPECTED_REPOSITORY: 2hg7trp7rv-design/cats_tower
          EXPECTED_BRANCH: kimi
          EXPECTED_REPOSITORY_ID: "1331488679"
          EXPECTED_OWNER_ID: "245031448"
        run: |
          set -euo pipefail
          test "${GITHUB_REPOSITORY}" = "${EXPECTED_REPOSITORY}"
          test "${GITHUB_REPOSITORY_ID}" = "${EXPECTED_REPOSITORY_ID}"
          test "${GITHUB_REPOSITORY_OWNER_ID}" = "${EXPECTED_OWNER_ID}"
          test "${GITHUB_REF_NAME}" = "${EXPECTED_BRANCH}"
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          git diff --quiet
          git diff --cached --quiet
          mapfile -t actual < <(find semantic-evidence -type f -printf '%p\n' | LC_ALL=C sort)
          mapfile -t expected <<'FILES'
          semantic-evidence/browser-raw.json
          semantic-evidence/browser-report.json
          semantic-evidence/screenshots/GM01-390x844.png
          semantic-evidence/screenshots/GM02-320x667.png
          semantic-evidence/screenshots/GM03-375x667.png
          semantic-evidence/screenshots/GM04-320x568.png
          semantic-evidence/screenshots/GM05-430x932.png
          semantic-evidence/screenshots/GM06-390x844.png
          semantic-evidence/screenshots/GM07-390x844.png
          semantic-evidence/screenshots/GM08-390x844.png
          semantic-evidence/screenshots/RV360-360x800.png
          semantic-evidence/screenshots/RV412-412x915.png
          semantic-evidence/screenshots/SAFE390-390x844.png
          semantic-evidence/screenshots/TEXT200-320x568.png
          semantic-evidence/screenshots/GM07C320-320x568.png
          semantic-evidence/screenshots/GM07C320TEXT200-320x568.png
          semantic-evidence/screenshots/TEXT200SAFE-320x568.png
          semantic-evidence/static-report.json
          FILES
          revision_control='quality-reviews/step-1-canonical-design/active-change-control-addendum-round-036.json'
          lock_007='quality-reviews/step-1-hero-merchant-large-idle-integration/user-decision-lock-round-007.json'
          lock_009='quality-reviews/step-1-hero-merchant-large-idle-integration/user-decision-lock-round-009.json'
          lock_011='quality-reviews/step-1-hero-merchant-large-idle-integration/user-decision-lock-round-011.json'
          if [[ -f "${lock_007}" || -f "${lock_009}" || -f "${lock_011}" ]]; then
            test -f "${revision_control}"
            test -f "${lock_007}"
            if [[ -f "${lock_011}" ]]; then test -f "${lock_009}"; fi
            expected+=(
              semantic-evidence/revision/browser-before-raw.json
              semantic-evidence/revision/revision-comparison.json
              semantic-evidence/revision/before/GM01-390x844.png
              semantic-evidence/revision/before/GM02-320x667.png
              semantic-evidence/revision/before/GM03-375x667.png
              semantic-evidence/revision/before/GM04-320x568.png
              semantic-evidence/revision/before/GM05-430x932.png
              semantic-evidence/revision/before/GM06-390x844.png
              semantic-evidence/revision/before/GM07-390x844.png
              semantic-evidence/revision/before/GM08-390x844.png
            )
          fi
          test "${#actual[@]}" = "${#expected[@]}"
          diff -u <(printf '%s\n' "${expected[@]}" | LC_ALL=C sort) <(printf '%s\n' "${actual[@]}")
          jq -e --arg head "${GITHUB_SHA}" --arg tree "$(git rev-parse HEAD^{tree})" '.head == $head and .tree == $tree and .verdict == "PASS_S02_GOLDEN_MASTER_P1_STATIC" and (.failures | length) == 0' semantic-evidence/static-report.json
          jq -e --arg head "${GITHUB_SHA}" --arg tree "$(git rev-parse HEAD^{tree})" '.head == $head and .tree == $tree and .verdict == "PASS_S02_GOLDEN_MASTER_P1_BROWSER" and (.failures | length) == 0' semantic-evidence/browser-report.json
          if [[ -f semantic-evidence/revision/revision-comparison.json ]]; then
            jq -e '.verdict == "PASS_S02_USER_REVISION_SAME_RUN_COMPARISON" and (.failures | length) == 0 and (.comparisons | length) == 8 and (.requestMeasurements | length) > 0 and all(.requestMeasurements[]; .status == "PASS" and all(.assertions[]; .status == "PASS" and (.criterionSha256 | test("^sha256:[a-f0-9]{64}$")))) and (.assetParticipation | type) == "array" and (.requestedChangesSha256 | test("^sha256:[a-f0-9]{64}$")) and (.acceptanceCriteriaSha256 | test("^sha256:[a-f0-9]{64}$"))' semantic-evidence/revision/revision-comparison.json
          fi
          oidc_response="$(curl --fail --silent --show-error --header "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=cats-tower-s02-golden-master-p1")"
          OIDC_TOKEN="$(jq -er '.value' <<<"${oidc_response}")"
          export OIDC_TOKEN EXPECTED_REPOSITORY EXPECTED_BRANCH EXPECTED_REPOSITORY_ID EXPECTED_OWNER_ID
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import { createHash, createPublicKey, verify } from 'node:crypto';
          import { execFileSync } from 'node:child_process';
          const read = (target) => fs.readFileSync(target);
          const digest = (bytes) => 'sha256:' + createHash('sha256').update(bytes).digest('hex');
          const canonicalJson = (value) => value === null || typeof value !== 'object' ? JSON.stringify(value) : Array.isArray(value) ? '[' + value.map(canonicalJson).join(',') + ']' : '{' + Object.keys(value).sort().map((key) => JSON.stringify(key) + ':' + canonicalJson(value[key])).join(',') + '}';
          const canonicalDigest = (value) => digest(Buffer.from(canonicalJson(value), 'utf8'));
          const oidcToken = process.env.OIDC_TOKEN;
          const tokenParts = oidcToken.split('.');
          if (tokenParts.length !== 3) throw new Error('GitHub OIDC token is not a compact signed JWT.');
          const oidcHeader = JSON.parse(Buffer.from(tokenParts[0], 'base64url').toString('utf8'));
          const oidcPayload = JSON.parse(Buffer.from(tokenParts[1], 'base64url').toString('utf8'));
          if (oidcHeader.alg !== 'RS256' || typeof oidcHeader.kid !== 'string' || oidcHeader.kid.length < 1) throw new Error('GitHub OIDC protected header is invalid.');
          const oidcConfigurationResponse = await fetch('https://token.actions.githubusercontent.com/.well-known/openid-configuration', { redirect: 'error' });
          if (!oidcConfigurationResponse.ok) throw new Error('GitHub OIDC discovery failed.');
          const oidcConfiguration = await oidcConfigurationResponse.json();
          if (oidcConfiguration.issuer !== 'https://token.actions.githubusercontent.com' || oidcConfiguration.jwks_uri !== 'https://token.actions.githubusercontent.com/.well-known/jwks') throw new Error('GitHub OIDC discovery identity mismatch.');
          const jwksResponse = await fetch(oidcConfiguration.jwks_uri, { redirect: 'error' });
          if (!jwksResponse.ok) throw new Error('GitHub OIDC JWKS fetch failed.');
          const jwks = await jwksResponse.json();
          const signingJwk = Array.isArray(jwks.keys) ? jwks.keys.find((key) => key.kid === oidcHeader.kid && key.kty === 'RSA' && key.use === 'sig' && key.alg === 'RS256') : null;
          if (!signingJwk || !verify('RSA-SHA256', Buffer.from(`${tokenParts[0]}.${tokenParts[1]}`, 'ascii'), createPublicKey({ key: signingJwk, format: 'jwk' }), Buffer.from(tokenParts[2], 'base64url'))) throw new Error('GitHub OIDC JWT signature verification failed.');
          const expectedAudience = 'cats-tower-s02-golden-master-p1';
          const audienceMatches = oidcPayload.aud === expectedAudience || (Array.isArray(oidcPayload.aud) && oidcPayload.aud.includes(expectedAudience));
          const [owner, repository] = process.env.EXPECTED_REPOSITORY.split('/');
          const expectedSubject = `repo:${owner}@${process.env.EXPECTED_OWNER_ID}/${repository}@${process.env.EXPECTED_REPOSITORY_ID}:ref:refs/heads/${process.env.EXPECTED_BRANCH}`;
          const expectedWorkflowRef = `${process.env.EXPECTED_REPOSITORY}/.github/workflows/verify-step-4-s02-golden-master-p1.yml@refs/heads/${process.env.EXPECTED_BRANCH}`;
          if (oidcPayload.iss !== 'https://token.actions.githubusercontent.com' || !audienceMatches || oidcPayload.sub !== expectedSubject || oidcPayload.repository !== process.env.EXPECTED_REPOSITORY || oidcPayload.repository_id !== process.env.EXPECTED_REPOSITORY_ID || oidcPayload.repository_owner_id !== process.env.EXPECTED_OWNER_ID || oidcPayload.ref !== `refs/heads/${process.env.EXPECTED_BRANCH}` || oidcPayload.sha !== process.env.GITHUB_SHA || oidcPayload.run_id !== process.env.GITHUB_RUN_ID || oidcPayload.run_attempt !== process.env.GITHUB_RUN_ATTEMPT || oidcPayload.workflow_ref !== expectedWorkflowRef) throw new Error('GitHub OIDC claims do not bind the exact trusted workflow run.');
          const now = Math.floor(Date.now() / 1000);
          if (!Number.isSafeInteger(oidcPayload.iat) || !Number.isSafeInteger(oidcPayload.exp) || oidcPayload.iat > now + 60 || oidcPayload.exp < now || oidcPayload.exp - oidcPayload.iat > 900) throw new Error('GitHub OIDC lifetime is invalid.');
          const oidcClaims = {
            issuer: oidcPayload.iss,
            audience: expectedAudience,
            subject: oidcPayload.sub,
            repository: oidcPayload.repository,
            repositoryId: oidcPayload.repository_id,
            repositoryOwnerId: oidcPayload.repository_owner_id,
            ref: oidcPayload.ref,
            sha: oidcPayload.sha,
            runId: oidcPayload.run_id,
            runAttempt: oidcPayload.run_attempt,
            workflowRef: oidcPayload.workflow_ref
          };
          const browser = JSON.parse(read('semantic-evidence/browser-report.json'));
          const raw = JSON.parse(read('semantic-evidence/browser-raw.json'));
          const baselineRawPath = 'semantic-evidence/revision/browser-before-raw.json';
          const comparisonPath = 'semantic-evidence/revision/revision-comparison.json';
          const revisionMode = fs.existsSync(baselineRawPath) || fs.existsSync(comparisonPath);
          if (revisionMode && (!fs.existsSync(baselineRawPath) || !fs.existsSync(comparisonPath))) throw new Error('Revision evidence is incomplete.');
          const screenshotPaths = [
            'semantic-evidence/screenshots/GM01-390x844.png', 'semantic-evidence/screenshots/GM02-320x667.png',
            'semantic-evidence/screenshots/GM03-375x667.png', 'semantic-evidence/screenshots/GM04-320x568.png',
            'semantic-evidence/screenshots/GM05-430x932.png', 'semantic-evidence/screenshots/GM06-390x844.png',
            'semantic-evidence/screenshots/GM07-390x844.png', 'semantic-evidence/screenshots/GM08-390x844.png',
            'semantic-evidence/screenshots/RV360-360x800.png', 'semantic-evidence/screenshots/RV412-412x915.png',
            'semantic-evidence/screenshots/SAFE390-390x844.png', 'semantic-evidence/screenshots/TEXT200-320x568.png',
            'semantic-evidence/screenshots/GM07C320-320x568.png', 'semantic-evidence/screenshots/GM07C320TEXT200-320x568.png', 'semantic-evidence/screenshots/TEXT200SAFE-320x568.png'
          ];
          if (JSON.stringify(browser.screenshots.map((entry) => entry.path)) !== JSON.stringify(screenshotPaths)) throw new Error('Browser screenshot order differs from the signed manifest.');
          if (raw.artifactId !== 'cats-tower-s02-golden-master-p1-browser-raw-round-001' || browser.rawEvidenceSha256 !== digest(read('semantic-evidence/browser-raw.json'))) throw new Error('Raw browser evidence is not bound by the final browser report.');
          let revision = null;
          let baselineBrowserRawSha256 = null;
          let revisionComparisonSha256 = null;
          if (revisionMode) {
            const baseline = JSON.parse(read(baselineRawPath));
            const comparison = JSON.parse(read(comparisonPath));
            const revisionStages = [
              { lockRound: '007', evidenceRound: '002' },
              { lockRound: '009', evidenceRound: '003' },
              { lockRound: '011', evidenceRound: '004' }
            ].map((stage) => ({ ...stage, path: `quality-reviews/step-1-hero-merchant-large-idle-integration/user-decision-lock-round-${stage.lockRound}.json` }));
            const stagePresence = revisionStages.map((stage) => fs.existsSync(stage.path));
            const activeRevisionIndex = stagePresence.lastIndexOf(true);
            if (activeRevisionIndex < 0 || stagePresence.slice(0, activeRevisionIndex + 1).some((present) => !present)) throw new Error('Signed revision lineage is absent or non-contiguous.');
            let activeCriteria = [];
            let currentLock = null;
            for (let stageIndex = 0; stageIndex <= activeRevisionIndex; stageIndex += 1) {
              const lock = JSON.parse(read(revisionStages[stageIndex].path));
              const superseded = new Set(lock.requestedChanges.flatMap((request) => request.supersedesAssertions));
              activeCriteria = activeCriteria.filter((entry) => !superseded.has(entry.assertion.id));
              for (const request of lock.requestedChanges) for (const assertion of request.acceptanceAssertions) activeCriteria.push({ requestId: request.id, criterionSha256: canonicalDigest(assertion), assertion });
              currentLock = lock;
            }
            const currentStage = revisionStages[activeRevisionIndex];
            const requestedChangesSha256 = canonicalDigest(currentLock.requestedChanges);
            const acceptanceCriteriaSha256 = canonicalDigest(activeCriteria);
            const beforePaths = [
              'semantic-evidence/revision/before/GM01-390x844.png', 'semantic-evidence/revision/before/GM02-320x667.png',
              'semantic-evidence/revision/before/GM03-375x667.png', 'semantic-evidence/revision/before/GM04-320x568.png',
              'semantic-evidence/revision/before/GM05-430x932.png', 'semantic-evidence/revision/before/GM06-390x844.png',
              'semantic-evidence/revision/before/GM07-390x844.png', 'semantic-evidence/revision/before/GM08-390x844.png'
            ];
            baselineBrowserRawSha256 = digest(read(baselineRawPath));
            revisionComparisonSha256 = digest(read(comparisonPath));
            if (browser.baselineRawSha256 !== baselineBrowserRawSha256 || browser.revisionComparisonSha256 !== revisionComparisonSha256) throw new Error('Browser report does not bind both revision artifacts.');
            if (comparison.artifactId !== `cats-tower-s02-golden-master-p1-revision-comparison-round-${currentStage.evidenceRound}` || comparison.verdict !== 'PASS_S02_USER_REVISION_SAME_RUN_COMPARISON' || comparison.failures.length !== 0) throw new Error('Same-run revision comparison did not pass.');
            if (comparison.requestedChangesSha256 !== requestedChangesSha256 || comparison.acceptanceCriteriaSha256 !== acceptanceCriteriaSha256) throw new Error('Revision comparison does not bind the exact current request and cumulative acceptance lineage.');
            if (!Array.isArray(comparison.requestMeasurements) || comparison.requestMeasurements.length < 1 || comparison.requestMeasurements.some((request) => request.status !== 'PASS' || !Array.isArray(request.assertions) || request.assertions.length < 1 || request.assertions.some((assertion) => assertion.status !== 'PASS'))) throw new Error('Per-request immutable acceptance measurements did not all pass.');
            const measuredCriteria = comparison.requestMeasurements.flatMap((request) => request.assertions.map((assertion) => ({ requestId: request.requestId, criterionSha256: assertion.criterionSha256 })));
            if (JSON.stringify(measuredCriteria) !== JSON.stringify(activeCriteria.map((entry) => ({ requestId: entry.requestId, criterionSha256: entry.criterionSha256 })))) throw new Error('Revision comparison measurement order differs from the active cumulative criteria.');
            if (!Array.isArray(comparison.assetParticipation) || JSON.stringify(comparison.assetParticipation) !== JSON.stringify(raw.assetParticipation)) throw new Error('Comparison does not bind the revised real-browser required-asset participation graph.');
            if (comparison.baseline.commit !== baseline.head || comparison.baseline.tree !== baseline.tree || comparison.revised.commit !== process.env.GITHUB_SHA || comparison.revised.tree !== browser.tree) throw new Error('Revision comparison targets do not bind the exact before/after trees.');
            if (JSON.stringify(baseline.scenarios.map((entry) => entry.screenshot.path)) !== JSON.stringify(beforePaths)) throw new Error('Baseline screenshot order differs from the signed revision manifest.');
            if (comparison.comparisons.length !== 8 || JSON.stringify(comparison.comparisons.map((entry) => entry.before.path)) !== JSON.stringify(beforePaths) || JSON.stringify(comparison.comparisons.map((entry) => entry.after.path)) !== JSON.stringify(screenshotPaths.slice(0, 8))) throw new Error('Revision comparison does not bind all eight before/after screenshots.');
            for (let index = 0; index < 8; index += 1) {
              if (baseline.scenarios[index].screenshot.sha256 !== digest(read(beforePaths[index])) || comparison.comparisons[index].before.sha256 !== digest(read(beforePaths[index])) || comparison.comparisons[index].after.sha256 !== digest(read(screenshotPaths[index]))) throw new Error('Revision screenshot digest mismatch at index ' + String(index));
            }
            revision = { baselineCommit: baseline.head, baselineTree: baseline.tree, affectedGoldenMasters: comparison.affectedGoldenMasters, requestedChangesSha256, acceptanceCriteriaSha256 };
          } else if (Object.hasOwn(browser, 'baselineRawSha256') || Object.hasOwn(browser, 'revisionComparisonSha256')) {
            throw new Error('Initial browser report contains revision-only keys.');
          }
          const result = {
            schemaVersion: 1,
            artifactId: 'cats-tower-s02-golden-master-p1-workflow-result',
            repository: process.env.EXPECTED_REPOSITORY,
            repositoryId: Number(process.env.EXPECTED_REPOSITORY_ID),
            repositoryOwnerId: Number(process.env.EXPECTED_OWNER_ID),
            branch: process.env.EXPECTED_BRANCH,
            commit: process.env.GITHUB_SHA,
            tree: execFileSync('git', ['rev-parse', 'HEAD^{tree}'], { encoding: 'utf8' }).trim(),
            runId: Number(process.env.GITHUB_RUN_ID),
            runAttempt: Number(process.env.GITHUB_RUN_ATTEMPT),
            oidcTokenSha256: digest(Buffer.from(oidcToken, 'utf8')),
            oidcClaims,
            oidcVerified: true,
            staticReportSha256: digest(read('semantic-evidence/static-report.json')),
            browserRawSha256: digest(read('semantic-evidence/browser-raw.json')),
            browserReportSha256: digest(read('semantic-evidence/browser-report.json')),
            ...(revisionMode ? { baselineBrowserRawSha256, revisionComparisonSha256, revision } : {}),
            screenshots: screenshotPaths.map((target) => ({ path: target, sha256: digest(read(target)) })),
            verdict: 'PASS_S02_GOLDEN_MASTER_P1_WORKFLOW',
            unresolved: { P0: 0, P1: 0 },
            physicalIPhoneVerified: false,
            productionAliasChanged: false
          };
          fs.writeFileSync('s02-golden-master-p1-result.json', JSON.stringify(result, null, 2) + '\n');
          NODE

      - name: Prepare exact S02 content attestation subjects
        shell: bash
        run: |
          set -euo pipefail
          subjects="s02-golden-master-p1-content-subjects.sha256"
          : > "${subjects}"
          sha256sum s02-golden-master-p1-result.json >> "${subjects}"
          while IFS= read -r target; do
            sha256sum "${target}" >> "${subjects}"
          done < <(find semantic-evidence -type f -printf '%p\n' | LC_ALL=C sort)
          LC_ALL=C sort -k2,2 -o "${subjects}" "${subjects}"
          expected_count=19
          if [[ -f semantic-evidence/revision/revision-comparison.json ]]; then expected_count=29; fi
          test "$(wc -l < "${subjects}" | tr -d ' ')" = "${expected_count}"
          test "$(cut -d ' ' -f3- "${subjects}" | LC_ALL=C sort -u | wc -l | tr -d ' ')" = "${expected_count}"

      - name: Create durable S02 content Sigstore attestation
        id: attest_s02_content
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d
        with:
          subject-checksums: s02-golden-master-p1-content-subjects.sha256
          show-summary: true

      - name: Verify and record durable S02 content attestation
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ATTESTATION_ID: ${{ steps.attest_s02_content.outputs.attestation-id }}
          ATTESTATION_URL: ${{ steps.attest_s02_content.outputs.attestation-url }}
          ATTESTATION_BUNDLE_SOURCE: ${{ steps.attest_s02_content.outputs.bundle-path }}
          ATTEST_ACTION_SHA: 508db95dd578ae2727ebd6217d5ba78e4fbda05d
        run: |
          set -euo pipefail
          subjects='s02-golden-master-p1-content-subjects.sha256'
          bundle='s02-golden-master-p1-content-attestation.sigstore.json'
          receipt='s02-golden-master-p1-content-attestation-receipt.json'
          test "${ATTESTATION_ID}" != ""
          test -f "${ATTESTATION_BUNDLE_SOURCE}"
          cp -- "${ATTESTATION_BUNDLE_SOURCE}" "${bundle}"
          test -s "${bundle}"
          cert_identity="https://github.com/${GITHUB_REPOSITORY}/.github/workflows/verify-step-4-s02-golden-master-p1.yml@refs/heads/kimi"
          while read -r digest target; do
            test "sha256:$(sha256sum "${target}" | cut -d ' ' -f1)" = "sha256:${digest}"
            gh attestation verify "${target}" --repo "${GITHUB_REPOSITORY}" --bundle "${bundle}" --cert-identity "${cert_identity}" --cert-oidc-issuer 'https://token.actions.githubusercontent.com' --deny-self-hosted-runners --predicate-type 'https://slsa.dev/provenance/v1' --source-digest "${GITHUB_SHA}" --source-ref 'refs/heads/kimi' > /dev/null
          done < "${subjects}"
          gh attestation verify s02-golden-master-p1-result.json --repo "${GITHUB_REPOSITORY}" --cert-identity "${cert_identity}" --cert-oidc-issuer 'https://token.actions.githubusercontent.com' --deny-self-hosted-runners --predicate-type 'https://slsa.dev/provenance/v1' --source-digest "${GITHUB_SHA}" --source-ref 'refs/heads/kimi' > /dev/null
          export ATTESTATION_ID ATTESTATION_URL ATTEST_ACTION_SHA
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import { createHash } from 'node:crypto';
          const digest = (bytes) => 'sha256:' + createHash('sha256').update(bytes).digest('hex');
          const subjectsPath = 's02-golden-master-p1-content-subjects.sha256';
          const lines = fs.readFileSync(subjectsPath, 'utf8').trim().split('\n');
          const subjects = lines.map((line) => {
            const match = /^([a-f0-9]{64})  ([A-Za-z0-9._/-]+)$/.exec(line);
            if (!match || match[2].startsWith('/') || match[2].includes('..')) throw new Error('Attestation subject checksum line is invalid.');
            return { path: match[2], sha256: `sha256:${match[1]}` };
          });
          if (new Set(subjects.map((entry) => entry.path)).size !== subjects.length) throw new Error('Attestation subject path is duplicated.');
          const attestationId = process.env.ATTESTATION_ID;
          const url = new URL(process.env.ATTESTATION_URL);
          const expectedPath = `/2hg7trp7rv-design/cats_tower/attestations/${attestationId}`;
          if (!/^[1-9][0-9]*$/.test(attestationId) || url.protocol !== 'https:' || url.hostname !== 'github.com' || url.username !== '' || url.password !== '' || url.pathname !== expectedPath || url.search !== '' || url.hash !== '') throw new Error('Attestation identity URL is invalid.');
          const bundlePath = 's02-golden-master-p1-content-attestation.sigstore.json';
          const bundle = fs.readFileSync(bundlePath);
          if (bundle.length < 512 || bundle.length > 16 * 1024 * 1024) throw new Error('Sigstore bundle size is invalid.');
          const parsedBundle = JSON.parse(bundle.toString('utf8'));
          if (parsedBundle?.mediaType !== 'application/vnd.dev.sigstore.bundle.v0.3+json' || !parsedBundle.verificationMaterial || !parsedBundle.dsseEnvelope) throw new Error('Sigstore bundle is not the exact v0.3 DSSE bundle shape.');
          let evidenceRound = '001';
          const comparisonPath = 'semantic-evidence/revision/revision-comparison.json';
          if (fs.existsSync(comparisonPath)) {
            const comparison = JSON.parse(fs.readFileSync(comparisonPath, 'utf8'));
            const match = /^cats-tower-s02-golden-master-p1-revision-comparison-round-(002|003|004)$/.exec(comparison.artifactId ?? '');
            if (!match) throw new Error('Revision comparison round is invalid for attestation.');
            evidenceRound = match[1];
          }
          const receipt = {
            schemaVersion: 1,
            artifactId: `cats-tower-s02-golden-master-p1-content-attestation-receipt-round-${evidenceRound}`,
            repository: '2hg7trp7rv-design/cats_tower',
            branch: 'kimi',
            commit: process.env.GITHUB_SHA,
            runId: Number(process.env.GITHUB_RUN_ID),
            runAttempt: Number(process.env.GITHUB_RUN_ATTEMPT),
            evidenceRound,
            action: { repository: 'actions/attest', commit: process.env.ATTEST_ACTION_SHA, version: 'v4.2.1' },
            subjects: { count: subjects.length, manifestSha256: digest(fs.readFileSync(subjectsPath)), entries: subjects },
            attestation: { id: attestationId, url: url.href, bundlePath, bundleSha256: digest(bundle), bundleMediaType: parsedBundle.mediaType },
            verification: { githubApiAssociation: true, liveApiVerified: true, offlineSigstoreBundleVerified: true, bearerTokenPersisted: false }
          };
          fs.writeFileSync('s02-golden-master-p1-content-attestation-receipt.json', JSON.stringify(receipt, null, 2) + '\n');
          NODE
          jq -e --arg head "${GITHUB_SHA}" --arg id "${ATTESTATION_ID}" '.schemaVersion == 1 and (.artifactId | test("^cats-tower-s02-golden-master-p1-content-attestation-receipt-round-(001|002|003|004)$")) and .repository == "2hg7trp7rv-design/cats_tower" and .branch == "kimi" and .commit == $head and .attestation.id == $id and .attestation.bundleMediaType == "application/vnd.dev.sigstore.bundle.v0.3+json" and .verification.liveApiVerified == true and .verification.offlineSigstoreBundleVerified == true and .verification.bearerTokenPersisted == false' "${receipt}"

      - name: Prepare exact S02 admission attestation subjects
        shell: bash
        run: |
          set -euo pipefail
          subjects="${RUNNER_TEMP}/s02-golden-master-p1-admission-subjects.sha256"
          : > "${subjects}"
          sha256sum s02-golden-master-p1-content-subjects.sha256 >> "${subjects}"
          sha256sum s02-golden-master-p1-content-attestation.sigstore.json >> "${subjects}"
          sha256sum s02-golden-master-p1-content-attestation-receipt.json >> "${subjects}"
          LC_ALL=C sort -k2,2 -o "${subjects}" "${subjects}"
          test "$(wc -l < "${subjects}" | tr -d ' ')" = "3"
          test "$(cut -d ' ' -f3- "${subjects}" | LC_ALL=C sort -u | wc -l | tr -d ' ')" = "3"

      - name: Create durable S02 admission Sigstore attestation
        id: attest_s02_admission
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d
        with:
          subject-checksums: ${{ runner.temp }}/s02-golden-master-p1-admission-subjects.sha256
          show-summary: true

      - name: Verify durable S02 admission attestation chain
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ADMISSION_ATTESTATION_ID: ${{ steps.attest_s02_admission.outputs.attestation-id }}
          ADMISSION_ATTESTATION_URL: ${{ steps.attest_s02_admission.outputs.attestation-url }}
          ADMISSION_BUNDLE_SOURCE: ${{ steps.attest_s02_admission.outputs.bundle-path }}
        run: |
          set -euo pipefail
          subjects="${RUNNER_TEMP}/s02-golden-master-p1-admission-subjects.sha256"
          bundle='s02-golden-master-p1-admission-attestation.sigstore.json'
          test "${ADMISSION_ATTESTATION_ID}" != ""
          test -f "${ADMISSION_BUNDLE_SOURCE}"
          cp -- "${ADMISSION_BUNDLE_SOURCE}" "${bundle}"
          cert_identity="https://github.com/${GITHUB_REPOSITORY}/.github/workflows/verify-step-4-s02-golden-master-p1.yml@refs/heads/kimi"
          while read -r digest target; do
            test "sha256:$(sha256sum "${target}" | cut -d ' ' -f1)" = "sha256:${digest}"
            gh attestation verify "${target}" --repo "${GITHUB_REPOSITORY}" --bundle "${bundle}" --cert-identity "${cert_identity}" --cert-oidc-issuer 'https://token.actions.githubusercontent.com' --deny-self-hosted-runners --predicate-type 'https://slsa.dev/provenance/v1' --source-digest "${GITHUB_SHA}" --source-ref 'refs/heads/kimi' > /dev/null
          done < "${subjects}"
          gh attestation verify s02-golden-master-p1-content-attestation-receipt.json --repo "${GITHUB_REPOSITORY}" --cert-identity "${cert_identity}" --cert-oidc-issuer 'https://token.actions.githubusercontent.com' --deny-self-hosted-runners --predicate-type 'https://slsa.dev/provenance/v1' --source-digest "${GITHUB_SHA}" --source-ref 'refs/heads/kimi' > /dev/null
          export ADMISSION_ATTESTATION_ID ADMISSION_ATTESTATION_URL
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const bundlePath = 's02-golden-master-p1-admission-attestation.sigstore.json';
          const bundle = fs.readFileSync(bundlePath);
          if (bundle.length < 512 || bundle.length > 16 * 1024 * 1024) throw new Error('Admission Sigstore bundle size is invalid.');
          const parsed = JSON.parse(bundle.toString('utf8'));
          if (parsed?.mediaType !== 'application/vnd.dev.sigstore.bundle.v0.3+json' || !parsed.verificationMaterial || !parsed.dsseEnvelope) throw new Error('Admission Sigstore bundle is not the exact v0.3 DSSE bundle shape.');
          const id = process.env.ADMISSION_ATTESTATION_ID;
          const url = new URL(process.env.ADMISSION_ATTESTATION_URL);
          if (!/^[1-9][0-9]*$/.test(id) || url.protocol !== 'https:' || url.hostname !== 'github.com' || url.username !== '' || url.password !== '' || url.pathname !== `/2hg7trp7rv-design/cats_tower/attestations/${id}` || url.search !== '' || url.hash !== '') throw new Error('Admission attestation identity URL is invalid.');
          NODE
          archive_count=23
          if [[ -f semantic-evidence/revision/revision-comparison.json ]]; then archive_count=33; fi
          test "$(( $(find semantic-evidence -type f | wc -l) + 5 ))" = "${archive_count}"

