name: Seal Step 3 calibration gate

on:
  push:
    branches: [kimi]
    paths:
      - '.github/workflows/seal-step-3-calibration.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: cats-step3-calibration-seal
  cancel-in-progress: false

jobs:
  seal-calibration:
    name: seal-calibration-gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify calibration seal authority
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ENTRY=3eefbf6fa7dfcec8b5b093612e8946b43d838bc2
          REPAIR_RUN=33134128875
          REPAIR_ARTIFACT=9671363899
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse --is-shallow-repository)" = "false"
          test -z "$(git replace -l)"
          git merge-base --is-ancestor "$ENTRY" HEAD
          test "$(git rev-parse HEAD:quality-reviews/step-3-large-scale-validation/acceptance-matrix.json)" = "d1392c431282d0faae9e9ad7f1c22161a3c5caad"
          test "$(git rev-parse HEAD:quality-reviews/step-3-large-scale-validation/acceptance-addendum-calibration-001.json)" = "9d0c89489363340c4954b6912fb105ca6789b462"
          test "$(git rev-parse HEAD:quality-reviews/step-3-large-scale-validation/acceptance-addendum-transport-002.json)" = "a8c853c1fe61e2ff5f5fced6d3776bcc97821d21"
          test "$(git rev-parse HEAD:quality-reviews/step-3-large-scale-validation/audit-calibration.mjs)" = "d0545a851666bc2dbc25f03c82cc02a7ca615cda"
          test "$(git rev-parse HEAD:quality-reviews/step-1-reseal-round-008/seal-round-008.json)" = "0a959de0383b57ad6cd1f33c124b398aa51c1e00"
          test "$(git rev-parse HEAD:simulation/executable-seal-v2.json)" = "ee3507969c03b08fe27350263cf0bc093a1c18e1"
          test ! -e quality-reviews/step-3-large-scale-validation/gameplay-calibration-result.json
          test ! -e quality-reviews/step-3-large-scale-validation/gameplay-holdout-result.json
          mapfile -t CHANGED < <(git diff --name-only "$ENTRY"..HEAD)
          for path in "${CHANGED[@]}"; do
            case "$path" in
              quality-reviews/step-3-large-scale-validation/acceptance-matrix.json|quality-reviews/step-3-large-scale-validation/acceptance-addendum-calibration-001.json|quality-reviews/step-3-large-scale-validation/acceptance-addendum-transport-002.json|quality-reviews/step-3-large-scale-validation/audit-calibration.mjs|.github/workflows/verify-step-3-calibration.yml|.github/workflows/repair-step-3-calibration-artifact.yml|.github/workflows/seal-step-3-calibration.yml) ;;
              *) echo "Forbidden pre-seal path: $path" >&2; exit 1 ;;
            esac
          done
          git diff --check "$ENTRY"..HEAD
          curl -fsSL \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/runs/$REPAIR_RUN/artifacts?per_page=100" \
            > "$RUNNER_TEMP/repair-artifacts.json"
          jq -e --argjson id "$REPAIR_ARTIFACT" '
            .total_count == 1 and
            (.artifacts | length) == 1 and
            .artifacts[0].id == $id and
            .artifacts[0].name == "cats-tower-step3-calibration-transport-repaired-0f15be9e8e93c114a98182f3149442e7f0204c2c-attempt-1" and
            .artifacts[0].size_in_bytes == 898876 and
            .artifacts[0].digest == "sha256:a66b269ce14ce65ecf842663a9d3405abf4104682c3995a2259b12fc3b0488b7" and
            .artifacts[0].expired == false and
            .artifacts[0].workflow_run.id == 33134128875 and
            .artifacts[0].workflow_run.head_branch == "kimi" and
            .artifacts[0].workflow_run.head_sha == "0f15be9e8e93c114a98182f3149442e7f0204c2c"
          ' "$RUNNER_TEMP/repair-artifacts.json" >/dev/null

      - name: Download exact portable calibration artifact
        uses: actions/download-artifact@v4
        with:
          name: cats-tower-step3-calibration-transport-repaired-0f15be9e8e93c114a98182f3149442e7f0204c2c-attempt-1
          path: ${{ runner.temp }}/cats-step3-calibration-seal
          github-token: ${{ github.token }}
          run-id: 33134128875

      - name: Verify artifact after extraction
        run: |
          set -euo pipefail
          DIR="$RUNNER_TEMP/cats-step3-calibration-seal"
          (
            cd "$DIR"
            sha256sum -c SHA256SUMS
          )
          ! grep -q '/home/runner/' "$DIR/SHA256SUMS"
          test "$(sha256sum "$DIR/gameplay-calibration-result.json" | cut -d' ' -f1)" = "f77eb5fdb805ea484a02b165105c585d07e77d3097fcbf42637f7a96618d90bb"
          test "$(sha256sum "$DIR/calibration-audit.json" | cut -d' ' -f1)" = "4b0f0004625ea923199f32b28606a4599da08f3ef3116c1e3a6460f0730da7c7"
          test "$(sha256sum "$DIR/execution-manifest.json" | cut -d' ' -f1)" = "f270136f0021c772d94e415a8c6e72f119b17964067ac59ff87d246f39d33d8c"
          test "$(sha256sum "$DIR/transport-repair-manifest.json" | cut -d' ' -f1)" = "6e5710d0b7f8d77612807e70b935a768c00d989a138d77536bdf1d97cb5617c0"
          node simulation/validate-gameplay-result-v2.mjs "$DIR/gameplay-calibration-result.json" --reproduce
          jq -e '.hashes.deterministicPayloadSha256 == "df7cbceb0569f40eefee43dbd81d0b2c4698a44104f88a312ce693471f746e22" and .deterministicPayload.scenarioCount == "12000" and .verdict.contractValidation == "PASS" and .verdict.partitionComplete == true' "$DIR/gameplay-calibration-result.json" >/dev/null
          jq -e '.verdict == "PASS_CALIBRATION_GATE_CANDIDATE" and .replay.scenarioCount == "12000" and .unresolvedP0 == 0 and .unresolvedP1 == 0 and .holdoutExecuted == false' "$DIR/calibration-audit.json" >/dev/null
          jq -e '.verdict == "PASS_CALIBRATION_TRANSPORT_REPAIRED" and .sourceFilesModified == false and .holdoutExecuted == false' "$DIR/transport-repair-manifest.json" >/dev/null

      - name: Commit immutable calibration evidence
        id: content
        run: |
          set -euo pipefail
          DIR="$RUNNER_TEMP/cats-step3-calibration-seal"
          OUT=quality-reviews/step-3-large-scale-validation
          cp "$DIR/gameplay-calibration-result.json" "$OUT/gameplay-calibration-result.json"
          cp "$DIR/calibration-audit.json" "$OUT/calibration-audit.json"
          cp "$DIR/execution-manifest.json" "$OUT/calibration-execution-manifest.json"
          cp "$DIR/transport-repair-manifest.json" "$OUT/calibration-transport-repair-manifest.json"
          git diff --check
          mapfile -t CHANGED < <(git status --short | sed -E 's/^.. //')
          test "${#CHANGED[@]}" -eq 4
          printf '%s\n' "${CHANGED[@]}" | sort > "$RUNNER_TEMP/changed-content.txt"
          printf '%s\n' \
            "$OUT/calibration-audit.json" \
            "$OUT/calibration-execution-manifest.json" \
            "$OUT/calibration-transport-repair-manifest.json" \
            "$OUT/gameplay-calibration-result.json" | sort > "$RUNNER_TEMP/expected-content.txt"
          diff -u "$RUNNER_TEMP/expected-content.txt" "$RUNNER_TEMP/changed-content.txt"
          git config user.name "cats-tower-step3-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -- "$OUT/gameplay-calibration-result.json" "$OUT/calibration-audit.json" "$OUT/calibration-execution-manifest.json" "$OUT/calibration-transport-repair-manifest.json"
          git commit -m "step3: commit calibration evidence"
          CONTENT_COMMIT=$(git rev-parse HEAD)
          CONTENT_TREE=$(git rev-parse HEAD^{tree})
          echo "commit=$CONTENT_COMMIT" >> "$GITHUB_OUTPUT"
          echo "tree=$CONTENT_TREE" >> "$GITHUB_OUTPUT"

      - name: Seal calibration gate
        id: gate
        run: |
          set -euo pipefail
          OUT=quality-reviews/step-3-large-scale-validation
          CONTENT_COMMIT="${{ steps.content.outputs.commit }}"
          CONTENT_TREE="${{ steps.content.outputs.tree }}"
          RESULT_BLOB=$(git rev-parse "HEAD:$OUT/gameplay-calibration-result.json")
          AUDIT_BLOB=$(git rev-parse "HEAD:$OUT/calibration-audit.json")
          EXECUTION_MANIFEST_BLOB=$(git rev-parse "HEAD:$OUT/calibration-execution-manifest.json")
          TRANSPORT_MANIFEST_BLOB=$(git rev-parse "HEAD:$OUT/calibration-transport-repair-manifest.json")
          jq -n \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg branch "kimi" \
            --arg acceptanceBlob "d1392c431282d0faae9e9ad7f1c22161a3c5caad" \
            --arg calibrationAddendumBlob "9d0c89489363340c4954b6912fb105ca6789b462" \
            --arg transportAddendumBlob "a8c853c1fe61e2ff5f5fced6d3776bcc97821d21" \
            --arg contentCommit "$CONTENT_COMMIT" \
            --arg contentTree "$CONTENT_TREE" \
            --arg resultBlob "$RESULT_BLOB" \
            --arg auditBlob "$AUDIT_BLOB" \
            --arg executionManifestBlob "$EXECUTION_MANIFEST_BLOB" \
            --arg transportManifestBlob "$TRANSPORT_MANIFEST_BLOB" \
            --arg sealWorkflow "$GITHUB_WORKFLOW" \
            --arg sealRunId "$GITHUB_RUN_ID" \
            --arg sealRunAttempt "$GITHUB_RUN_ATTEMPT" \
            --arg sealJob "$GITHUB_JOB" \
            '{
              schemaVersion: 1,
              artifactId: "cats-tower-step3-calibration-gate-v1",
              repository: $repository,
              branch: $branch,
              authority: {
                acceptanceBlob: $acceptanceBlob,
                calibrationAddendumBlob: $calibrationAddendumBlob,
                transportAddendumBlob: $transportAddendumBlob,
                step1SealBlob: "0a959de0383b57ad6cd1f33c124b398aa51c1e00",
                step2SealBlob: "ee3507969c03b08fe27350263cf0bc093a1c18e1",
                runPlanBlob: "a04632e41d78dd15b36e95cd6998e8a8648b9a6c",
                executionContractBlob: "82685b646358129d7e66a810b267777d6bf5af92"
              },
              sourceExecution: {
                runId: "33133249662",
                jobId: "98727326189",
                head: "3363c36d91d47b177b1dcf4af053c00b23954d7a",
                tree: "a60ce0417851573a4c3895b30872fd3d0860a328",
                artifactId: "9671238966",
                artifactDigest: "sha256:b8dadc084d2aadb9406c06fdaffaf449aad96ea20861f3c47da4fa0ccfc5fb83"
              },
              transportRepair: {
                runId: "33134128875",
                jobId: "98730177368",
                head: "0f15be9e8e93c114a98182f3149442e7f0204c2c",
                tree: "13a10da4440f9c0da188caeb11018502727207bd",
                artifactId: "9671363899",
                artifactDigest: "sha256:a66b269ce14ce65ecf842663a9d3405abf4104682c3995a2259b12fc3b0488b7"
              },
              content: {
                commit: $contentCommit,
                tree: $contentTree,
                result: {path: "quality-reviews/step-3-large-scale-validation/gameplay-calibration-result.json", blob: $resultBlob, bytes: "1913915", sha256: "f77eb5fdb805ea484a02b165105c585d07e77d3097fcbf42637f7a96618d90bb", deterministicPayloadSha256: "df7cbceb0569f40eefee43dbd81d0b2c4698a44104f88a312ce693471f746e22", scenarioCount: "12000"},
                audit: {path: "quality-reviews/step-3-large-scale-validation/calibration-audit.json", blob: $auditBlob, bytes: "43002", sha256: "4b0f0004625ea923199f32b28606a4599da08f3ef3116c1e3a6460f0730da7c7", verdict: "PASS_CALIBRATION_GATE_CANDIDATE"},
                executionManifest: {path: "quality-reviews/step-3-large-scale-validation/calibration-execution-manifest.json", blob: $executionManifestBlob, bytes: "1590", sha256: "f270136f0021c772d94e415a8c6e72f119b17964067ac59ff87d246f39d33d8c"},
                transportManifest: {path: "quality-reviews/step-3-large-scale-validation/calibration-transport-repair-manifest.json", blob: $transportManifestBlob, bytes: "1477", sha256: "6e5710d0b7f8d77612807e70b935a768c00d989a138d77536bdf1d97cb5617c0"}
              },
              keyMetrics: {
                firstResetMinutes: {minimum: "20", maximum: "29", p50: "24", p90: "27", p99: "29"},
                noAdF2PFeaturedGuaranteeDay: "40",
                noAdF2PCombinedDailyDraws: "44",
                repeatedResetSequenceViolations: "0",
                buildSpreadViolations: "0",
                replayMismatchCount: "0",
                duplicateInputDigestCount: "0",
                duplicateScenarioDigestCount: "0"
              },
              quality: {unresolvedP0: 0, unresolvedP1: 0},
              holdout: {authorized: true, executed: false, tuningReuseForbidden: true},
              highVolumeExecuted: false,
              productionChanged: false,
              physicalIPhoneVerified: false,
              sealInvocation: {workflow: $sealWorkflow, runId: $sealRunId, runAttempt: $sealRunAttempt, job: $sealJob, conclusionAtCreation: "IN_PROGRESS"},
              verdict: "PASS_CALIBRATION_GATE_HOLDOUT_AUTHORIZED"
            }' > "$OUT/calibration-gate.json"
          jq -e '.verdict == "PASS_CALIBRATION_GATE_HOLDOUT_AUTHORIZED" and .quality.unresolvedP0 == 0 and .quality.unresolvedP1 == 0 and .holdout.authorized == true and .holdout.executed == false' "$OUT/calibration-gate.json" >/dev/null
          git add -- "$OUT/calibration-gate.json"
          git commit -m "step3: seal calibration gate"
          GATE_COMMIT=$(git rev-parse HEAD)
          GATE_TREE=$(git rev-parse HEAD^{tree})
          GATE_BLOB=$(git rev-parse "HEAD:$OUT/calibration-gate.json")
          echo "commit=$GATE_COMMIT" >> "$GITHUB_OUTPUT"
          echo "tree=$GATE_TREE" >> "$GITHUB_OUTPUT"
          echo "blob=$GATE_BLOB" >> "$GITHUB_OUTPUT"

      - name: Verify and push only to existing kimi
        run: |
          set -euo pipefail
          INVOCATION_SHA="$GITHUB_SHA"
          REMOTE_SHA=$(git ls-remote origin refs/heads/kimi | cut -f1)
          test "$REMOTE_SHA" = "$INVOCATION_SHA"
          test "$(git rev-list --count "$INVOCATION_SHA"..HEAD)" = "2"
          git merge-base --is-ancestor "$INVOCATION_SHA" HEAD
          test -z "$(git status --porcelain --untracked-files=all)"
          git diff --check "$INVOCATION_SHA"..HEAD
          mapfile -t CHANGED < <(git diff --name-only "$INVOCATION_SHA"..HEAD)
          for path in "${CHANGED[@]}"; do
            case "$path" in
              quality-reviews/step-3-large-scale-validation/gameplay-calibration-result.json|quality-reviews/step-3-large-scale-validation/calibration-audit.json|quality-reviews/step-3-large-scale-validation/calibration-execution-manifest.json|quality-reviews/step-3-large-scale-validation/calibration-transport-repair-manifest.json|quality-reviews/step-3-large-scale-validation/calibration-gate.json) ;;
              *) echo "Forbidden calibration seal path: $path" >&2; exit 1 ;;
            esac
          done
          git push origin HEAD:kimi
