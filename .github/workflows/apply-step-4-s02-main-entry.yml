name: Apply Step 4 S02 main entry

on:
  workflow_dispatch:
  push:
    branches:
      - kimi
    paths:
      - ".github/workflows/apply-step-4-s02-main-entry.yml"

permissions:
  contents: write

concurrency:
  group: apply-step4-s02-main-entry-kimi
  cancel-in-progress: false

jobs:
  apply:
    name: Preserve legacy and connect actual root
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout exact kimi commit
        uses: actions/checkout@v4
        with:
          ref: kimi
          fetch-depth: 0

      - name: Assert repository and branch boundary
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REPOSITORY}" = "2hg7trp7rv-design/cats_tower"
          test "$(git branch --show-current)" = "kimi"
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"

      - name: Apply deterministic main-entry integration
        shell: bash
        run: |
          set -euo pipefail
          node tests/step4/apply-s02-main-entry.mjs | tee s02-main-entry-apply-report.json
          git diff --check
          test "$(git hash-object legacy.html)" = "c5871ded0f7fbb501dce08e2b0da767841ce789b"
          grep -q '/step4/s02/root-entry.js' index.html
          grep -q 'href="./production.css"' step4/s02/index.html

      - name: Commit exact integration output to existing kimi
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html legacy.html step4/s02/index.html
          test -n "$(git diff --cached --name-only)"
          test "$(git diff --cached --name-only | sort | tr '\n' ' ')" = "index.html legacy.html step4/s02/index.html "
          git commit -m "step4: connect S02 to actual game entry"
          git push origin HEAD:kimi

      - name: Upload apply evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: step4-s02-main-entry-apply-${{ github.sha }}
          if-no-files-found: error
          retention-days: 30
          path: s02-main-entry-apply-report.json
