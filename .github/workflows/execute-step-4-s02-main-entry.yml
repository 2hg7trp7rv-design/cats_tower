name: Execute Step 4 S02 main entry

on:
  workflow_dispatch:
  push:
    branches:
      - kimi
    paths:
      - ".github/workflows/execute-step-4-s02-main-entry.yml"

permissions:
  contents: write

concurrency:
  group: execute-step4-s02-main-entry-kimi
  cancel-in-progress: false

jobs:
  execute:
    name: Apply, browser-verify, evidence and status sync
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout latest existing kimi
        uses: actions/checkout@v4
        with:
          ref: kimi
          fetch-depth: 0

      - name: Assert repository and branch boundary
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REPOSITORY}" = "2hg7trp7rv-design/cats_tower"
          test "$(git branch --show-current)" = "kimi"
          git pull --ff-only origin kimi
          echo "entry_head=$(git rev-parse HEAD)"
          echo "entry_tree=$(git rev-parse HEAD^{tree})"

      - name: Apply deterministic main-entry integration
        shell: bash
        run: |
          set -euo pipefail
          node tests/step4/apply-s02-main-entry.mjs | tee s02-main-entry-apply-execute-report.json
          test "$(git hash-object legacy.html)" = "c5871ded0f7fbb501dce08e2b0da767841ce789b"
          grep -q '/step4/s02/root-entry.js' index.html
          grep -q 'href="./production.css"' step4/s02/index.html
          git diff --check

      - name: Run fail-closed root integration contract
        shell: bash
        run: |
          set -euo pipefail
          node tests/step4/s02-static-contract-v3.mjs | tee s02-static-v3-report.json

      - name: Install pinned Playwright and Chromium
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/s02-playwright
          cd /tmp/s02-playwright
          npm init -y >/dev/null 2>&1
          npm install --save-exact playwright@1.62.1
          npx playwright install --with-deps chromium

      - name: Start working-tree static server
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/s02-execute-http.log 2>&1 &
          echo $! > /tmp/s02-execute-http.pid
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:4173/ >/dev/null \
              && curl --fail --silent http://127.0.0.1:4173/step4/s02/ >/dev/null \
              && curl --fail --silent http://127.0.0.1:4173/legacy.html >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/s02-execute-http.log
          exit 1

      - name: Run isolated source browser QA
        shell: bash
        env:
          PLAYWRIGHT_PACKAGE: /tmp/s02-playwright/node_modules/playwright
          S02_BASE_URL: http://127.0.0.1:4173/step4/s02/
          S02_EVIDENCE_DIR: quality-reviews/step-4-twelve-screen-final-mockups/s02-browser-evidence
        run: |
          set -euo pipefail
          node tests/step4/s02-browser-qa.mjs

      - name: Run actual root integration browser QA
        shell: bash
        env:
          PLAYWRIGHT_PACKAGE: /tmp/s02-playwright/node_modules/playwright
          S02_ORIGIN: http://127.0.0.1:4173
          S02_MAIN_ENTRY_EVIDENCE_DIR: quality-reviews/step-4-twelve-screen-final-mockups/s02-main-entry-evidence
        run: |
          set -euo pipefail
          node tests/step4/s02-main-entry-browser.mjs

      - name: Finalize evidence and synchronize status mirrors
        shell: bash
        run: |
          set -euo pipefail
          node tests/step4/finalize-s02-main-entry.mjs | tee s02-main-entry-finalize-report.json
          git diff --check
          grep -q 'PASS_S02_MAIN_ENTRY_TECHNICAL_PENDING_USER_VISUAL_APPROVAL' \
            quality-reviews/step-4-twelve-screen-final-mockups/s02-main-entry-integration-evidence.json
          grep -q 'S02_INTEGRATED_AT_ROOT' PROJECT_STATUS.json

      - name: Assert change boundary
        shell: bash
        run: |
          set -euo pipefail
          changed="$(git status --short | awk '{print $2}')"
          printf '%s\n' "$changed"
          while IFS= read -r file; do
            test -z "$file" && continue
            case "$file" in
              index.html|legacy.html|step4/s02/index.html) ;;
              quality-reviews/step-4-twelve-screen-final-mockups/s02-browser-evidence/*) ;;
              quality-reviews/step-4-twelve-screen-final-mockups/s02-main-entry-evidence/*) ;;
              quality-reviews/step-4-twelve-screen-final-mockups/s02-main-entry-integration-evidence.json) ;;
              PROJECT_STATUS.json|AI_PROJECT_POLICY.json|simulation/CURRENT_STATUS.json) ;;
              quality-reviews/step-1-canonical-design/active-change-control.json) ;;
              QUALITY_GATE.md|PROJECT_HANDOVER.md|AGENTS.md|.github/workflows/CURRENT_STATUS.md) ;;
              *) echo "Out-of-bound generated change: $file" >&2; exit 1 ;;
            esac
          done <<< "$changed"
          test "$(git hash-object app.js)" = "258f8cef77fb37a07d00aaab99ae1e678de764fd"
          test "$(git hash-object styles.css)" = "ed222e53204411297eac3f9556bb7e91b9470597"
          test "$(git hash-object game-core.js)" = "34471eaa185b2355f17a8e8860261f63ee86bdaf"
          test "$(git hash-object game-data.js)" = "fa01689275f05f1e0879c40586499cc74c337cf9"
          test "$(git hash-object simulation/executable-seal-v2.json)" = "ee3507969c03b08fe27350263cf0bc093a1c18e1"

      - name: Commit verified root integration to existing kimi
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            index.html \
            legacy.html \
            step4/s02/index.html \
            quality-reviews/step-4-twelve-screen-final-mockups/s02-browser-evidence \
            quality-reviews/step-4-twelve-screen-final-mockups/s02-main-entry-evidence \
            quality-reviews/step-4-twelve-screen-final-mockups/s02-main-entry-integration-evidence.json \
            PROJECT_STATUS.json \
            AI_PROJECT_POLICY.json \
            simulation/CURRENT_STATUS.json \
            quality-reviews/step-1-canonical-design/active-change-control.json \
            QUALITY_GATE.md \
            PROJECT_HANDOVER.md \
            AGENTS.md \
            .github/workflows/CURRENT_STATUS.md
          if git diff --cached --quiet; then
            echo "Verified integration was already committed."
            exit 0
          fi
          git commit -m "step4: reflect S02 at actual game entry with evidence"
          git push origin HEAD:kimi

      - name: Upload execution evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: step4-s02-main-entry-execution-${{ github.sha }}
          if-no-files-found: error
          retention-days: 30
          path: |
            s02-main-entry-apply-execute-report.json
            s02-static-v3-report.json
            s02-main-entry-finalize-report.json
            quality-reviews/step-4-twelve-screen-final-mockups/s02-browser-evidence/**
            quality-reviews/step-4-twelve-screen-final-mockups/s02-main-entry-evidence/**
            quality-reviews/step-4-twelve-screen-final-mockups/s02-main-entry-integration-evidence.json
            /tmp/s02-execute-http.log
