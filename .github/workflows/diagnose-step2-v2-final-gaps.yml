          printf '%s\n' "$changed"
          test -n "$changed"
          while IFS= read -r path; do
            case "$path" in
              simulation/*|quality-reviews/step-2-executable-contract-v2/qualification-result.json|.github/workflows/diagnose-step2-v2-final-gaps.yml)
                ;;
              *)
                echo "repair escaped Step 2 boundary: $path" >&2
                exit 1
                ;;
            esac
          done <<< "$changed"
          git diff --check
          git diff --stat
          echo 'FINAL_GAP_REPAIR_VALIDATED_WITHOUT_WRITE=true'
