name: Diagnose Step 2 V2 final semantic gaps

on:
  push:
    branches: [kimi]
    paths:
      - '.github/workflows/diagnose-step2-v2-final-gaps.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: diagnose-step2-v2-final-gaps-${{ github.sha }}
  cancel-in-progress: false

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply final semantic repairs in working tree only
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import hashlib
          import json

          def replace_once(path, old, new):
              file = Path(path)
              text = file.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one source fragment, found {count}: {old[:100]}')
              file.write_text(text.replace(old, new), encoding='utf-8')

          def replace_between(path, start, end, replacement):
              file = Path(path)
              text = file.read_text(encoding='utf-8')
              left = text.find(start)
              if left < 0:
                  raise SystemExit(f'{path}: start marker not found: {start}')
              right = text.find(end, left)
              if right < 0:
                  raise SystemExit(f'{path}: end marker not found: {end}')
              file.write_text(text[:left] + replacement + text[right:], encoding='utf-8')

          economy_pity = '''export function pityOutcome({ drawsSinceUR, featuredProgress, naturalRarity = 'N', naturalFeatured = false, featuredRollHit = naturalFeatured, hardPity = '100', featuredGuarantee = '200' }) {
            if (typeof featuredRollHit !== 'boolean') throw new TypeError('FEATURED_ROLL_MUST_BE_BOOLEAN');
            const nextDraw = toBigInt(assertUnsigned(drawsSinceUR)) + 1n;
            const nextFeatured = toBigInt(assertUnsigned(featuredProgress)) + 1n;
            const forcedUR = nextDraw >= toBigInt(hardPity);
            const forcedFeatured = nextFeatured >= toBigInt(featuredGuarantee);
            const rarity = forcedUR || forcedFeatured ? 'UR' : naturalRarity;
            const featured = rarity === 'UR' && (forcedFeatured || featuredRollHit);
            return {
              rarity,
              featured,
              hardPityTriggered: forcedUR,
              featuredGuaranteeTriggered: forcedFeatured,
              nextDrawsSinceUR: rarity === 'UR' ? '0' : nextDraw.toString(),
              nextFeaturedProgress: featured ? '0' : nextFeatured.toString(),
            };
          }

          function allGachaBanners(candidate) {
            return [...candidate.gacha.characterPools, ...candidate.gacha.weaponPools];
          }

          export function pityCarryoverOutcome(candidate, { fromBannerId, toBannerId, drawsSinceUR, featuredProgress, fromExpired = false }) {
            if (typeof fromExpired !== 'boolean') throw new TypeError('FROM_EXPIRED_MUST_BE_BOOLEAN');
            const sourceDraws = assertUnsigned(drawsSinceUR, 'drawsSinceUR');
            const sourceFeatured = assertUnsigned(featuredProgress, 'featuredProgress');
            const banners = allGachaBanners(candidate);
            const from = banners.find((entry) => entry.id === fromBannerId);
            const to = banners.find((entry) => entry.id === toBannerId);
            if (!from) throw new Error(`UNKNOWN_GACHA_BANNER:${fromBannerId}`);
            if (!to) throw new Error(`UNKNOWN_GACHA_BANNER:${toBannerId}`);
            if (candidate.gacha.carryoverFamilies.compatibleOnly !== true || candidate.gacha.carryoverFamilies.expiresOnAccountDeletionOnly !== true) throw new Error('GACHA_CARRYOVER_POLICY_NOT_SEALED');
            const compatible = from.kind === to.kind && from.carryoverFamily === to.carryoverFamily;
            return {
              fromBannerId,
              toBannerId,
              fromExpired,
              fromKind: from.kind,
              toKind: to.kind,
              fromCarryoverFamily: from.carryoverFamily,
              toCarryoverFamily: to.carryoverFamily,
              compatible,
              outcome: compatible
                ? (fromExpired ? 'TRANSFERRED_FROM_EXPIRED_COMPATIBLE_BANNER' : 'TRANSFERRED_COMPATIBLE_BANNER')
                : 'INCOMPATIBLE_RETAINED_IN_SOURCE_FAMILY',
              targetDrawsSinceUR: compatible ? sourceDraws : '0',
              targetFeaturedProgress: compatible ? sourceFeatured : '0',
              sourceDrawsSinceUR: sourceDraws,
              sourceFeaturedProgress: sourceFeatured,
              sourceProgressRetained: true,
            };
          }

          '''
          replace_between('simulation/engine-v2/economy.mjs', 'export function pityOutcome(', 'export function resetRubyQuote(', economy_pity)

          login_helper = '''export function loginClaimDecision({ accountId, campaignId, campaignVersion, serverPeriodId, claimedPeriodIds = [], claimedCount = '0', campaignDays }) {
            for (const [name, value] of Object.entries({ accountId, campaignId, campaignVersion, serverPeriodId })) {
              if (typeof value !== 'string' || value.length === 0) throw new Error(`LOGIN_${name.toUpperCase()}_REQUIRED`);
            }
            if (!Array.isArray(claimedPeriodIds) || claimedPeriodIds.some((value) => typeof value !== 'string' || value.length === 0)) throw new Error('LOGIN_CLAIMED_PERIODS_INVALID');
            if (!/^(0|[1-9][0-9]*)$/.test(String(claimedCount))) throw new Error('LOGIN_CLAIMED_COUNT_INVALID');
            if (!/^[1-9][0-9]*$/.test(String(campaignDays))) throw new Error('LOGIN_CAMPAIGN_DAYS_INVALID');
            const count = BigInt(claimedCount);
            const days = BigInt(campaignDays);
            if (count > days) throw new Error('LOGIN_CLAIMED_COUNT_EXCEEDS_CAMPAIGN');
            const alreadyClaimed = claimedPeriodIds.includes(serverPeriodId);
            const next = alreadyClaimed ? count : (count < days ? count + 1n : days);
            return {
              outcome: alreadyClaimed ? 'ALREADY_CLAIMED' : 'ELIGIBLE',
              claimKey: `${accountId}|${campaignId}|${campaignVersion}|${serverPeriodId}`,
              serverPeriodId,
              serverTimeAuthoritative: true,
              missedDayResetsTrack: false,
              nextTrackIndex: next.toString(),
            };
          }

          '''
          replace_once('simulation/engine-v2/state-machines.mjs', 'export { TRANSITIONS };\n', login_helper + 'export { TRANSITIONS };\n')

          replace_once('simulation/engine-v2/high-volume.mjs', "import { idempotentResult, replaySequence, TRANSITIONS } from './state-machines.mjs';", "import { idempotentResult, replaySequence, TRANSITIONS, exactlyOnceReceipt, acceptedVersionRetry } from './state-machines.mjs';")

          gacha_block = '''function simulateGachaPool(candidate, samples, namespace, poolKind) {
            const tableId = poolKind === 'character' ? 'catalog.rate_table.character.v2' : 'catalog.rate_table.weapon.v2';
            const rateTable = candidate.gacha.rates.find((entry) => entry.id === tableId);
            if (!rateTable) throw new Error(`MISSING_GACHA_RATE_TABLE:${tableId}`);
            const table = distribution(rateTable.entries);
            const firstUr = new UnsignedHistogram();
            const firstFeatured = new UnsignedHistogram();
            const counters = { hardPityTriggered: 0n, featuredGuaranteeTriggered: 0n, featuredRollHits: 0n, maximumDrawsToFeatured: 0n, boundaryViolations: 0n };
            const hardPity = candidate.gacha.hardPity.draws;
            const featuredGuarantee = candidate.gacha.featuredGuarantee.draws;
            for (let sample = 0; sample < samples; sample += 1) {
              const rng = new DeterministicRng(`${namespace}|${poolKind}|${sample}`);
              let drawsSinceUR = '0';
              let featuredProgress = '0';
              let firstUrDraw = 0n;
              let featuredDraw = 0n;
              for (let draw = 1n; draw <= BigInt(featuredGuarantee); draw += 1n) {
                const naturalRarity = sampleDistribution(rng, table);
                const nextDraw = BigInt(drawsSinceUR) + 1n;
                const nextFeatured = BigInt(featuredProgress) + 1n;
                const willBeUR = naturalRarity === 'UR' || nextDraw >= BigInt(hardPity) || nextFeatured >= BigInt(featuredGuarantee);
                const featuredRollHit = willBeUR && nextFeatured < BigInt(featuredGuarantee) && sampleProbability(rng, candidate.gacha.featuredGuarantee.featuredShareWithinUR);
                const outcome = pityOutcome({ drawsSinceUR, featuredProgress, naturalRarity, featuredRollHit, hardPity, featuredGuarantee });
                if (outcome.hardPityTriggered) counters.hardPityTriggered += 1n;
                if (outcome.featuredGuaranteeTriggered) counters.featuredGuaranteeTriggered += 1n;
                if (featuredRollHit && outcome.featured) counters.featuredRollHits += 1n;
                if (outcome.rarity === 'UR' && firstUrDraw === 0n) firstUrDraw = draw;
                drawsSinceUR = outcome.nextDrawsSinceUR;
                featuredProgress = outcome.nextFeaturedProgress;
                if (outcome.featured) { featuredDraw = draw; break; }
              }
              if (firstUrDraw === 0n || firstUrDraw > BigInt(hardPity) || featuredDraw === 0n || featuredDraw > BigInt(featuredGuarantee)) counters.boundaryViolations += 1n;
              if (featuredDraw > counters.maximumDrawsToFeatured) counters.maximumDrawsToFeatured = featuredDraw;
              firstUr.add(firstUrDraw.toString());
              firstFeatured.add(featuredDraw.toString());
            }
            return { firstUr: firstUr.summary(), firstFeatured: firstFeatured.summary(), counters };
          }

          function gachaTails(candidate, _execution, samples, namespace) {
            const character = simulateGachaPool(candidate, samples, namespace, 'character');
            const weapon = simulateGachaPool(candidate, samples, namespace, 'weapon');
            return {
              primary: character.firstUr,
              secondary: character.firstFeatured,
              tertiary: weapon.firstUr,
              quaternary: weapon.firstFeatured,
              counters: {
                characterSamples: BigInt(samples),
                characterHardPityTriggered: character.counters.hardPityTriggered,
                characterFeaturedGuaranteeTriggered: character.counters.featuredGuaranteeTriggered,
                characterFeaturedRollHits: character.counters.featuredRollHits,
                characterMaximumDrawsToFeatured: character.counters.maximumDrawsToFeatured,
                weaponSamples: BigInt(samples),
                weaponHardPityTriggered: weapon.counters.hardPityTriggered,
                weaponFeaturedGuaranteeTriggered: weapon.counters.featuredGuaranteeTriggered,
                weaponFeaturedRollHits: weapon.counters.featuredRollHits,
                weaponMaximumDrawsToFeatured: weapon.counters.maximumDrawsToFeatured,
                maximumDrawsToFeatured: character.counters.maximumDrawsToFeatured > weapon.counters.maximumDrawsToFeatured ? character.counters.maximumDrawsToFeatured : weapon.counters.maximumDrawsToFeatured,
                boundaryViolations: character.counters.boundaryViolations + weapon.counters.boundaryViolations,
              },
            };
          }

          '''
          replace_between('simulation/engine-v2/high-volume.mjs', 'function gachaTails(', 'function pityConformance(', gacha_block)

          replace_once('simulation/engine-v2/high-volume.mjs', "  const fixedHard = pityOutcome({ drawsSinceUR: '99', featuredProgress: '0', naturalRarity: 'N', naturalFeatured: false });\n  const fixedFeatured = pityOutcome({ drawsSinceUR: '0', featuredProgress: '199', naturalRarity: 'N', naturalFeatured: false });\n  if (!(fixedHard.hardPityTriggered && fixedHard.rarity === 'UR')) counters.boundaryViolations += 1n;\n  if (!(fixedFeatured.featuredGuaranteeTriggered && fixedFeatured.rarity === 'UR' && fixedFeatured.featured)) counters.boundaryViolations += 1n;", "  const fixedHardFeatured = pityOutcome({ drawsSinceUR: '99', featuredProgress: '0', naturalRarity: 'N', featuredRollHit: true });\n  const fixedHardNonFeatured = pityOutcome({ drawsSinceUR: '99', featuredProgress: '0', naturalRarity: 'N', featuredRollHit: false });\n  const fixedFeatured = pityOutcome({ drawsSinceUR: '0', featuredProgress: '199', naturalRarity: 'N', featuredRollHit: false });\n  if (!(fixedHardFeatured.hardPityTriggered && fixedHardFeatured.rarity === 'UR' && fixedHardFeatured.featured)) counters.boundaryViolations += 1n;\n  if (!(fixedHardNonFeatured.hardPityTriggered && fixedHardNonFeatured.rarity === 'UR' && !fixedHardNonFeatured.featured)) counters.boundaryViolations += 1n;\n  if (!(fixedFeatured.featuredGuaranteeTriggered && fixedFeatured.rarity === 'UR' && fixedFeatured.featured)) counters.boundaryViolations += 1n;")

          duplicate_block = '''function simulateDuplicateTrack(catalog, track, samples, namespace, kind) {
            const catalogSize = catalog.length;
            const copies = Array.from({ length: catalogSize }, () => 0n);
            const effectiveCopies = new UnsignedHistogram();
            const overflowCredit = new UnsignedHistogram();
            for (let sample = 0; sample < samples; sample += 1) {
              const rng = new DeterministicRng(`${namespace}|${kind}|${sample}`);
              const index = Number(rng.nextBelow(BigInt(catalogSize)));
              copies[index] += 1n;
              const additional = copies[index] > 0n ? copies[index] - 1n : 0n;
              const overflow = masteryOverflow(track, additional.toString());
              effectiveCopies.add(overflow.masteredCopies);
              overflowCredit.add(overflow.overflowCredit);
            }
            const full = BigInt(track.fullMastery.minimumAdditionalEffectiveCopies);
            return {
              mastered: effectiveCopies.summary(),
              overflow: overflowCredit.summary(),
              counters: {
                samples: BigInt(samples),
                catalogSize: BigInt(catalogSize),
                uniqueItemsSeen: BigInt(copies.filter((value) => value > 0n).length),
                itemsAtFullMastery: BigInt(copies.filter((value) => value > full).length),
                itemsWithOverflow: BigInt(copies.filter((value) => value - 1n > full).length),
                maximumCopies: copies.reduce((maximum, value) => value > maximum ? value : maximum, 0n),
              },
            };
          }

          function duplicateSkew(candidate, _execution, samples, namespace) {
            const character = simulateDuplicateTrack(candidate.characters.catalog, candidate.characterMastery, samples, namespace, 'character');
            const weapon = simulateDuplicateTrack(candidate.weapons.catalog, candidate.weaponMastery, samples, namespace, 'weapon');
            return {
              primary: character.mastered,
              secondary: character.overflow,
              tertiary: weapon.mastered,
              quaternary: weapon.overflow,
              counters: {
                characterSamples: character.counters.samples,
                characterCatalogSize: character.counters.catalogSize,
                characterUniqueItemsSeen: character.counters.uniqueItemsSeen,
                characterItemsAtFullMastery: character.counters.itemsAtFullMastery,
                characterItemsWithOverflow: character.counters.itemsWithOverflow,
                characterMaximumCopies: character.counters.maximumCopies,
                weaponSamples: weapon.counters.samples,
                weaponCatalogSize: weapon.counters.catalogSize,
                weaponUniqueItemsSeen: weapon.counters.uniqueItemsSeen,
                weaponItemsAtFullMastery: weapon.counters.itemsAtFullMastery,
                weaponItemsWithOverflow: weapon.counters.itemsWithOverflow,
                weaponMaximumCopies: weapon.counters.maximumCopies,
              },
            };
          }

          '''
          replace_between('simulation/engine-v2/high-volume.mjs', 'function duplicateSkew(', 'function refundReplay(', duplicate_block)

          refund_block = '''function refundReplay(samples, namespace) {
            const deficits = new UnsignedHistogram();
            const paidAfter = new UnsignedHistogram();
            const counters = { validRefunds: 0n, invalidSpentRejected: 0n, idempotentReplayMatches: 0n, exactlyOnceReceiptMatches: 0n, outOfOrderRestoreMatches: 0n, acceptedVersionRetryMatches: 0n, freeLedgerDebitViolations: 0n, deficitStateCount: 0n };
            const store = new Map();
            const receiptStore = new Map();
            for (let sample = 0; sample < samples; sample += 1) {
              const rng = new DeterministicRng(`${namespace}|${sample}`);
              const grant = rng.nextBelow(1000n) + 1n;
              const invalid = rng.nextBelow(10n) === 0n;
              const spent = invalid ? grant + rng.nextBelow(10n) + 1n : rng.nextBelow(grant + 1n);
              const balance = rng.nextBelow(grant + 501n);
              if (invalid) {
                try { applyPaidRubyRefund({ paidBalance: balance.toString(), affectedGrant: grant.toString(), alreadySpent: spent.toString(), transactionId: `tx-${sample}`, policyVersion: 'refund-deficit-v2' }); counters.freeLedgerDebitViolations += 1n; }
                catch (error) { if (error.message === 'ALREADY_SPENT_EXCEEDS_AFFECTED_GRANT') counters.invalidSpentRejected += 1n; else throw error; }
                deficits.add('0');
                paidAfter.add(balance.toString());
                continue;
              }
              const operation = () => applyPaidRubyRefund({ paidBalance: balance.toString(), affectedGrant: grant.toString(), alreadySpent: spent.toString(), transactionId: `tx-${sample}`, policyVersion: 'refund-deficit-v2' });
              const first = idempotentResult(store, `refund-${sample}`, operation);
              const replay = idempotentResult(store, `refund-${sample}`, operation);
              counters.validRefunds += 1n;
              if (replay.replayed && JSON.stringify(first.result) === JSON.stringify(replay.result)) counters.idempotentReplayMatches += 1n;
              const receiptFirst = exactlyOnceReceipt(receiptStore, `receipt-${sample}`, first.result);
              const receiptReplay = exactlyOnceReceipt(receiptStore, `receipt-${sample}`, { forbidden: true });
              if (!receiptFirst.duplicate && receiptReplay.duplicate && JSON.stringify(receiptReplay.grant) === JSON.stringify(first.result)) counters.exactlyOnceReceiptMatches += 1n;
              const sequence = sample % 2 === 0
                ? ['STORE_PURCHASED', 'REFUNDED', 'RESTORED']
                : ['STORE_PURCHASED', 'REVOKED', 'RESTORED'];
              if (replaySequence('transition.payment.v2', sequence).finalState === 'RESTORED') counters.outOfOrderRestoreMatches += 1n;
              const version = acceptedVersionRetry({ acceptedVersion: 'catalog.v1', currentVersion: 'catalog.v2', accepted: true });
              if (version.outcome === 'RECONCILE_ACCEPTED_VERSION' && version.version === 'catalog.v1') counters.acceptedVersionRetryMatches += 1n;
              if (first.result.freeLedgersDebited) counters.freeLedgerDebitViolations += 1n;
              if (first.result.state === 'paid-ruby-deficit') counters.deficitStateCount += 1n;
              deficits.add(first.result.deficit.magnitude);
              paidAfter.add(first.result.paidBalance);
            }
            return { primary: deficits.summary(), secondary: paidAfter.summary(), counters };
          }

          '''
          replace_between('simulation/engine-v2/high-volume.mjs', 'function refundReplay(', 'function stateMachineModel(', refund_block)

          replace_once('simulation/engine-v2/high-volume.mjs', "  const suite = execution.highVolumeSuites.find((entry) => entry.id === suiteId);\n  if (!suite || !SUITES[suiteId]) throw new Error(`UNKNOWN_HIGH_VOLUME_SUITE:${suiteId}`);", "  const suite = execution.highVolumeSuites.find((entry) => entry.id === suiteId);\n  if (!suite || !SUITES[suiteId]) throw new Error(`UNKNOWN_HIGH_VOLUME_SUITE:${suiteId}`);\n  const implementationVersion = suite.implementationVersion.match(/-(v[0-9]+)$/)?.[1];\n  if (!implementationVersion) throw new Error(`INVALID_HIGH_VOLUME_IMPLEMENTATION_VERSION:${suite.implementationVersion}`);")
          replace_once('simulation/engine-v2/high-volume.mjs', "  const metricsWithoutDigest = { primary: rawMetrics.primary, secondary: rawMetrics.secondary, counters };", "  const metricsWithoutDigest = {\n    primary: rawMetrics.primary,\n    secondary: rawMetrics.secondary,\n    ...(rawMetrics.tertiary ? { tertiary: rawMetrics.tertiary } : {}),\n    ...(rawMetrics.quaternary ? { quaternary: rawMetrics.quaternary } : {}),\n    counters,\n  };")
          replace_once('simulation/engine-v2/high-volume.mjs', "    metricContract: `${suiteId}-metrics-v1`,", "    metricContract: `${suiteId}-metrics-${implementationVersion}`,")

          execution_path = Path('simulation/execution-contract-v2.json')
          execution = json.loads(execution_path.read_text(encoding='utf-8'))
          versions = {
              'gacha-tails': 'gacha-tails-v2',
              'duplicate-skew-overflow': 'duplicate-skew-overflow-v2',
              'refund-replay-race': 'refund-replay-race-v2',
          }
          for suite in execution['highVolumeSuites']:
              if suite['id'] in versions:
                  suite['implementationVersion'] = versions[suite['id']]
          execution_path.write_text(json.dumps(execution, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          replace_once('simulation/validate-execution-contract-v2.mjs', "const suiteIds = ['gacha-tails','pity-conformance','duplicate-skew-overflow','refund-replay-race','state-machine-model','large-number-properties'];", "const suiteIds = ['gacha-tails','pity-conformance','duplicate-skew-overflow','refund-replay-race','state-machine-model','large-number-properties'];\nconst expectedSuiteVersions = {\n  'gacha-tails': 'gacha-tails-v2',\n  'pity-conformance': 'pity-conformance-v1',\n  'duplicate-skew-overflow': 'duplicate-skew-overflow-v2',\n  'refund-replay-race': 'refund-replay-race-v2',\n  'state-machine-model': 'state-machine-model-v1',\n  'large-number-properties': 'large-number-properties-v1',\n};")
          replace_once('simulation/validate-execution-contract-v2.mjs', "  check(suite?.implementationVersion === `${id}-v1`, 'EXEC_SUITE_VERSION', `${id} implementation version mismatch`);", "  check(suite?.implementationVersion === expectedSuiteVersions[id], 'EXEC_SUITE_VERSION', `${id} implementation version mismatch`);")

          schema_path = Path('simulation/high-volume-result-v2.schema.json')
          schema = json.loads(schema_path.read_text(encoding='utf-8'))
          payload_properties = schema['properties']['deterministicPayload']['properties']
          payload_properties['metricContract']['pattern'] = '^[a-z0-9-]+-metrics-v[0-9]+$'
          metrics = payload_properties['metrics']
          old_props = metrics['properties']
          metrics['properties'] = {
              'primary': old_props['primary'],
              'secondary': old_props['secondary'],
              'tertiary': {'$ref': '#/$defs/summary'},
              'quaternary': {'$ref': '#/$defs/summary'},
              'counters': old_props['counters'],
              'suiteDigest': old_props['suiteDigest'],
          }
          schema_path.write_text(json.dumps(schema, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          replace_once('simulation/validate-high-volume-result-v2.mjs', "check(payload.metricContract === `${payload.suiteId}-metrics-v1`, 'HV_METRIC_CONTRACT', 'metric contract mismatch');", "const implementationVersion = suite?.implementationVersion?.match(/-(v[0-9]+)$/)?.[1];\ncheck(Boolean(implementationVersion) && payload.metricContract === `${payload.suiteId}-metrics-${implementationVersion}`, 'HV_METRIC_CONTRACT', 'metric contract mismatch');")
          replace_once('simulation/validate-high-volume-result-v2.mjs', "summary(payload.metrics.secondary, sampleCount, '#/deterministicPayload/metrics/secondary');", "summary(payload.metrics.secondary, sampleCount, '#/deterministicPayload/metrics/secondary');\nif (payload.metrics.tertiary !== undefined) summary(payload.metrics.tertiary, sampleCount, '#/deterministicPayload/metrics/tertiary');\nif (payload.metrics.quaternary !== undefined) summary(payload.metrics.quaternary, sampleCount, '#/deterministicPayload/metrics/quaternary');")
          replace_once('simulation/validate-high-volume-result-v2.mjs', "const metricsWithoutDigest = { primary: payload.metrics.primary, secondary: payload.metrics.secondary, counters: payload.metrics.counters };", "const metricsWithoutDigest = {\n  primary: payload.metrics.primary,\n  secondary: payload.metrics.secondary,\n  ...(payload.metrics.tertiary !== undefined ? { tertiary: payload.metrics.tertiary } : {}),\n  ...(payload.metrics.quaternary !== undefined ? { quaternary: payload.metrics.quaternary } : {}),\n  counters: payload.metrics.counters,\n};")

          validator_counter_block = '''const expectedCounterKeys = {
            'gacha-tails': ['characterSamples','characterHardPityTriggered','characterFeaturedGuaranteeTriggered','characterFeaturedRollHits','characterMaximumDrawsToFeatured','weaponSamples','weaponHardPityTriggered','weaponFeaturedGuaranteeTriggered','weaponFeaturedRollHits','weaponMaximumDrawsToFeatured','maximumDrawsToFeatured','boundaryViolations'],
            'pity-conformance': ['hardBoundaryCases','hardBoundaryPass','featuredBoundaryCases','featuredBoundaryPass','earlyHardFalse','earlyFeaturedFalse','boundaryViolations'],
            'duplicate-skew-overflow': ['characterSamples','characterCatalogSize','characterUniqueItemsSeen','characterItemsAtFullMastery','characterItemsWithOverflow','characterMaximumCopies','weaponSamples','weaponCatalogSize','weaponUniqueItemsSeen','weaponItemsAtFullMastery','weaponItemsWithOverflow','weaponMaximumCopies'],
            'refund-replay-race': ['validRefunds','invalidSpentRejected','idempotentReplayMatches','exactlyOnceReceiptMatches','outOfOrderRestoreMatches','acceptedVersionRetryMatches','freeLedgerDebitViolations','deficitStateCount'],
            'state-machine-model': ['validAccepted','invalidRejected','unexpectedAccept','unexpectedReject','machineCount'],
            'large-number-properties': ['symbolicRepresentations','expandedRepresentations','canonicalIdPass','canonicalIdFail','maximumDigits'],
          };
          check(eq(Object.keys(payload.metrics.counters ?? {}), expectedCounterKeys[payload.suiteId]), 'HV_COUNTER_FIELDS', 'suite counter fields or order mismatch');
          '''
          replace_between('simulation/validate-high-volume-result-v2.mjs', 'const expectedCounterKeys = {', "if (payload.suiteId === 'gacha-tails') {", validator_counter_block)

          gacha_validator = '''if (payload.suiteId === 'gacha-tails') {
            check(payload.metrics.tertiary !== undefined && payload.metrics.quaternary !== undefined, 'HV_GACHA_POOL_COVERAGE', 'gacha tails must independently represent character and weapon results');
            check(counters.characterSamples === sampleCount && counters.weaponSamples === sampleCount, 'HV_GACHA_SAMPLE_COVERAGE', 'gacha pool sample counts differ from sealed sampleCount');
            check(counters.boundaryViolations === 0n && counters.characterMaximumDrawsToFeatured <= 200n && counters.weaponMaximumDrawsToFeatured <= 200n && counters.maximumDrawsToFeatured <= 200n, 'HV_GACHA_BOUNDARY', 'character or weapon gacha tail crossed a sealed pity boundary');
