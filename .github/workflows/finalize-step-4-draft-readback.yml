name: Finalize Step 4 draft live read-back

on:
  push:
    branches: [kimi]
    paths:
      - '.github/workflows/finalize-step-4-draft-readback.yml'
      - 'quality-reviews/step-4-twelve-screen-final-mockups/tools/finalize-step4-draft-readback.mjs'
      - 'quality-reviews/step-4-twelve-screen-final-mockups/draft-activation-evidence.json'
      - 'quality-reviews/step-4-twelve-screen-final-mockups/draft-live-readback.json'
      - '.github/workflows/CURRENT_STATUS.md'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: cats-tower-step4-draft-live-readback
  cancel-in-progress: false

jobs:
  finalize-step4-draft-readback:
    name: finalize-step4-draft-readback
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      STEP4_DIR: quality-reviews/step-4-twelve-screen-final-mockups
      TOOL: quality-reviews/step-4-twelve-screen-final-mockups/tools/finalize-step4-draft-readback.mjs
      LIVE: quality-reviews/step-4-twelve-screen-final-mockups/draft-live-readback.json
      ACTIVATION: quality-reviews/step-4-twelve-screen-final-mockups/draft-activation-evidence.json
      V3_VERIFIER: tests/step4/verify-step4-mockups-v3.mjs
      GOVERNANCE_VERIFIER: tests/governance/verify-current-step2-state.mjs
      STEP4_ENTRY: 245d50b6e80e2783f6aeaab5e50fae217661a3b6
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify exact authority and determine mode
        id: phase
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = '2hg7trp7rv-design/cats_tower'
          test "$GITHUB_REF_NAME" = 'kimi'
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse --is-shallow-repository)" = 'false'
          test -z "$(git replace -l)"
          git merge-base --is-ancestor "$STEP4_ENTRY" HEAD
          test "$(git rev-parse HEAD:quality-reviews/step-1-reseal-round-008/seal-round-008.json)" = '0a959de0383b57ad6cd1f33c124b398aa51c1e00'
          test "$(git rev-parse HEAD:simulation/executable-seal-v2.json)" = 'ee3507969c03b08fe27350263cf0bc093a1c18e1'
          test "$(git rev-parse HEAD:quality-reviews/step-3-large-scale-validation/live-readback.json)" = 'd0b73af25a8f0d449cfc083b007b84b8ff3fbc9b'
          test "$(git rev-parse HEAD:$STEP4_DIR/acceptance-matrix.json)" = '7d907578c367ef426e11f97393637f23e14e25c2'
          node --check "$TOOL"
          node --check "$V3_VERIFIER"
          node --check "$GOVERNANCE_VERIFIER"
          node "$V3_VERIFIER" | tee "$RUNNER_TEMP/step4-v3.json"
          jq -e '.verdict == "PASS_STEP4_MOCKUP_DRAFT_VALIDATION_V3" and .renderCount == 36 and .xmlParsed == true and .forbiddenPathCount == 0' "$RUNNER_TEMP/step4-v3.json" >/dev/null
          node "$GOVERNANCE_VERIFIER" | tee "$RUNNER_TEMP/governance.json"
          if [ -f "$LIVE" ]; then
            jq -e '.lifecycle == "STEP4_IN_PROGRESS_DRAFT_LIVE"' "$RUNNER_TEMP/governance.json" >/dev/null
            MODE=verify
          else
            jq -e '.lifecycle == "STEP4_IN_PROGRESS_PENDING_LIVE_READBACK"' "$RUNNER_TEMP/governance.json" >/dev/null
            MODE=create
          fi
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"
          echo "Detected Step 4 draft read-back mode: $MODE"

      - name: Resolve workflow evidence
        id: evidence
        if: steps.phase.outputs.mode == 'create'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test -f "$ACTIVATION"
          DRAFT_RUN_ID=$(jq -r '.draftWorkflow.runId' "$ACTIVATION")
          DRAFT_JOB_ID=$(jq -r '.draftWorkflow.jobId' "$ACTIVATION")
          DRAFT_COMMIT=$(jq -r '.draftWorkflow.commit' "$ACTIVATION")
          test -n "$DRAFT_RUN_ID"
          test -n "$DRAFT_JOB_ID"
          test -n "$DRAFT_COMMIT"
          DRAFT_RUN=$(curl -fsSL \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/runs/$DRAFT_RUN_ID")
          test "$(jq -r '.status' <<<"$DRAFT_RUN")" = 'completed'
          test "$(jq -r '.conclusion' <<<"$DRAFT_RUN")" = 'success'
          test "$(jq -r '.head_sha' <<<"$DRAFT_RUN")" = "$DRAFT_COMMIT"

          ACTIVATION_RUNS=$(curl -fsSL \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/workflows/activate-step-4-draft.yml/runs?branch=kimi&status=success&per_page=30")
          ACTIVATION_RUN_ID=''
          ACTIVATION_COMMIT=''
          while read -r ID SHA; do
            if git merge-base --is-ancestor "$SHA" HEAD; then ACTIVATION_RUN_ID="$ID"; ACTIVATION_COMMIT="$SHA"; break; fi
          done < <(jq -r '.workflow_runs[] | [.id, .head_sha] | @tsv' <<<"$ACTIVATION_RUNS")
          test -n "$ACTIVATION_RUN_ID"
          ACTIVATION_JOBS=$(curl -fsSL \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/runs/$ACTIVATION_RUN_ID/jobs?per_page=100")
          ACTIVATION_JOB_ID=$(jq -r '.jobs[] | select(.name == "activate-step4-draft" and .conclusion == "success") | .id' <<<"$ACTIVATION_JOBS" | head -1)
          test -n "$ACTIVATION_JOB_ID"

          CURRENT_JOBS=$(curl -fsSL \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/jobs?per_page=100")
          CURRENT_JOB_ID=$(jq -r '.jobs[] | select(.name == "finalize-step4-draft-readback") | .id' <<<"$CURRENT_JOBS" | head -1)
          test -n "$CURRENT_JOB_ID"

          echo "draft_run_id=$DRAFT_RUN_ID" >> "$GITHUB_OUTPUT"
          echo "draft_job_id=$DRAFT_JOB_ID" >> "$GITHUB_OUTPUT"
          echo "activation_run_id=$ACTIVATION_RUN_ID" >> "$GITHUB_OUTPUT"
          echo "activation_job_id=$ACTIVATION_JOB_ID" >> "$GITHUB_OUTPUT"
          echo "finalizer_job_id=$CURRENT_JOB_ID" >> "$GITHUB_OUTPUT"

      - name: Configure exact kimi writer
        if: steps.phase.outputs.mode == 'create'
        run: |
          set -euo pipefail
          test "$(git rev-parse origin/kimi)" = "$GITHUB_SHA"
          git checkout -B kimi "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          test "$(git branch --show-current)" = 'kimi'

      - name: Create draft live read-back
        if: steps.phase.outputs.mode == 'create'
        env:
          FINALIZER_RUN_ID: ${{ github.run_id }}
          FINALIZER_JOB_ID: ${{ steps.evidence.outputs.finalizer_job_id }}
          FINALIZER_SOURCE_COMMIT: ${{ github.sha }}
          DRAFT_RUN_ID: ${{ steps.evidence.outputs.draft_run_id }}
          DRAFT_JOB_ID: ${{ steps.evidence.outputs.draft_job_id }}
          ACTIVATION_RUN_ID: ${{ steps.evidence.outputs.activation_run_id }}
          ACTIVATION_JOB_ID: ${{ steps.evidence.outputs.activation_job_id }}
        run: |
          set -euo pipefail
          node "$TOOL" create | tee "$RUNNER_TEMP/step4-draft-live.json"
          jq -e '.verdict == "PASS_STEP4_DRAFT_LIVE_READBACK_IN_PROGRESS" and .renderCount == 36 and .criticsCompleted == 0 and .step5Allowed == false' "$RUNNER_TEMP/step4-draft-live.json" >/dev/null
          node "$TOOL" verify | tee "$RUNNER_TEMP/step4-draft-live-precommit.json"
          jq -e '.verdict == "PASS_STEP4_DRAFT_LIVE_READBACK_VERIFICATION" and .renderCount == 36 and .step4 == "IN_PROGRESS"' "$RUNNER_TEMP/step4-draft-live-precommit.json" >/dev/null
          git diff --check
          { git diff --name-only; git ls-files --others --exclude-standard; } | sort -u > "$RUNNER_TEMP/changed-paths.txt"
          test "$(cat "$RUNNER_TEMP/changed-paths.txt")" = "$LIVE"

      - name: Commit exact draft live read-back
        if: steps.phase.outputs.mode == 'create'
        run: |
          set -euo pipefail
          git add "$LIVE"
          git commit -m 'step4: record draft live readback before critic review'
          node "$TOOL" verify
          git diff --check "$STEP4_ENTRY..HEAD"
          test -z "$(git status --porcelain --untracked-files=all)"
          git push origin HEAD:kimi

      - name: Verify source finalizer and exact later HEAD
        if: steps.phase.outputs.mode == 'verify'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          node "$TOOL" verify | tee "$RUNNER_TEMP/step4-draft-live-verification.json"
          jq -e '.verdict == "PASS_STEP4_DRAFT_LIVE_READBACK_VERIFICATION" and .renderCount == 36 and .step4 == "IN_PROGRESS" and .step5 == "BLOCKED_UNTIL_STEP4_PASS"' "$RUNNER_TEMP/step4-draft-live-verification.json" >/dev/null
          SOURCE_RUN_ID=$(jq -r '.workflows.finalizerSource.runId' "$LIVE")
          SOURCE_COMMIT=$(jq -r '.workflows.finalizerSource.sourceCommit' "$LIVE")
          SOURCE_RUN=$(curl -fsSL \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN_ID")
          test "$(jq -r '.status' <<<"$SOURCE_RUN")" = 'completed'
          test "$(jq -r '.conclusion' <<<"$SOURCE_RUN")" = 'success'
          test "$(jq -r '.head_sha' <<<"$SOURCE_RUN")" = "$SOURCE_COMMIT"
          node "$V3_VERIFIER"
          node "$GOVERNANCE_VERIFIER"
          git diff --check "$STEP4_ENTRY..HEAD"
          test -z "$(git status --porcelain --untracked-files=all)"
