name: Validate Step 2 V2 critic payload

on:
  push:
    branches: [kimi]
    paths:
      - '.github/workflows/apply-step2-v2-critic-fixes.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-step2-v2-critic-payload-kimi
  cancel-in-progress: false

jobs:
  validate-without-write:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: kimi
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate live payload bytes and bounded archive
        shell: bash
        run: |
          set -euo pipefail
          PATCH='quality-reviews/step-2-executable-contract-v2/patch'
          EXPECTED_LIVE_BASE64_SHA='c4fffeaa5cf3f5d9f0b930723dc1e8fbae6ec9317438251d6b770f91b81266a2'
          EXPECTED_LIVE_GZIP_SHA='86edb96ebcd5782bd344be6db7b0d5b6dcb25680e9ef9fb882eeba9c7298d874'
          expected_chunks=(
            chunk-000.txt
            chunk-001.txt
            chunk-002.txt
            chunk-003.txt
            chunk-004.txt
            chunk-005.txt
          )

          for chunk in "${expected_chunks[@]}"; do
            test -f "$PATCH/$chunk" || { echo "missing payload chunk: $chunk" >&2; exit 1; }
            chunk_sha="$(sha256sum "$PATCH/$chunk" | awk '{print $1}')"
            chunk_bytes="$(wc -c < "$PATCH/$chunk" | tr -d ' ')"
            echo "chunk=$chunk sha256=$chunk_sha bytes=$chunk_bytes"
          done
          actual_chunk_count="$(find "$PATCH" -maxdepth 1 -type f -name 'chunk-[0-9][0-9][0-9].txt' | wc -l | tr -d ' ')"
          test "$actual_chunk_count" = "${#expected_chunks[@]}" || {
            echo "unexpected payload chunk count: $actual_chunk_count" >&2
            exit 1
          }

          : > "$RUNNER_TEMP/step2-fixes.b64"
          for chunk in "${expected_chunks[@]}"; do
            tr -d '\r\n\t ' < "$PATCH/$chunk" >> "$RUNNER_TEMP/step2-fixes.b64"
          done
          actual_b64_sha="$(sha256sum "$RUNNER_TEMP/step2-fixes.b64" | awk '{print $1}')"
          actual_b64_bytes="$(wc -c < "$RUNNER_TEMP/step2-fixes.b64" | tr -d ' ')"
          echo "actual_base64_sha256=$actual_b64_sha"
          echo "actual_base64_bytes=$actual_b64_bytes"
          test "$actual_b64_sha" = "$EXPECTED_LIVE_BASE64_SHA" || {
            echo "live base64 digest changed during validation" >&2
            exit 1
          }

          base64 --decode "$RUNNER_TEMP/step2-fixes.b64" > "$RUNNER_TEMP/step2-fixes.tar.gz"
          actual_gzip_sha="$(sha256sum "$RUNNER_TEMP/step2-fixes.tar.gz" | awk '{print $1}')"
          actual_gzip_bytes="$(wc -c < "$RUNNER_TEMP/step2-fixes.tar.gz" | tr -d ' ')"
          echo "actual_gzip_sha256=$actual_gzip_sha"
          echo "actual_gzip_bytes=$actual_gzip_bytes"
          test "$actual_gzip_sha" = "$EXPECTED_LIVE_GZIP_SHA" || {
            echo "live gzip digest changed during validation" >&2
            exit 1
          }

          python - <<'PY'
          import hashlib
          import os
          import tarfile
          from pathlib import PurePosixPath

          archive_path = os.path.join(os.environ['RUNNER_TEMP'], 'step2-fixes.tar.gz')
          with tarfile.open(archive_path, 'r:gz') as archive:
              members = archive.getmembers()
              if not members:
                  raise SystemExit('empty patch archive')
              regular_files = 0
              for member in members:
                  path = PurePosixPath(member.name)
                  if path.is_absolute() or '..' in path.parts:
                      raise SystemExit(f'unsafe archive path: {member.name}')
                  if not (member.name == 'simulation' or member.name.startswith('simulation/')):
                      raise SystemExit(f'out-of-bound archive path: {member.name}')
                  if member.issym() or member.islnk() or member.isdev():
                      raise SystemExit(f'unsupported archive member type: {member.name}')
                  if not (member.isdir() or member.isfile()):
                      raise SystemExit(f'unsupported archive member: {member.name}')
                  if member.isfile():
                      regular_files += 1
                      source = archive.extractfile(member)
                      if source is None:
                          raise SystemExit(f'cannot read archive member: {member.name}')
                      digest = hashlib.sha256(source.read()).hexdigest()
                      print(f'archive_file={member.name} size={member.size} sha256={digest}')
                  else:
                      print(f'archive_dir={member.name}')
              if regular_files == 0:
                  raise SystemExit('patch archive contains no regular files')
              print(f'archive_member_count={len(members)}')
              print(f'archive_file_count={regular_files}')
              archive.extractall('.', filter='data')
          PY
      - name: Run complete content-phase verification without repository write
        shell: bash
        run: |
          set -euo pipefail
          find simulation -name '*.mjs' -print0 | xargs -0 -n1 node --check
          node simulation/validate-candidate-v2.mjs
          node simulation/validate-run-plan-v2.mjs
          node simulation/fixtures/v2/validate-fixtures.mjs
          node simulation/migrations/v1-to-v2/validate-migration.mjs
          node simulation/engine-v2/run-plan.mjs --mode qualification --output quality-reviews/step-2-executable-contract-v2/qualification-result.json
          node simulation/validate-result-v2.mjs quality-reviews/step-2-executable-contract-v2/qualification-result.json --reproduce
          node simulation/verify-step2-v2.mjs
      - name: Audit resulting working-tree boundary
        shell: bash
        run: |
          set -euo pipefail
          changed="$(git status --short | sed -E 's/^.. //' | sed -E 's/.* -> //' || true)"
          printf '%s\n' "$changed"
          test -n "$changed" || { echo 'payload produced no working-tree changes' >&2; exit 1; }
          while IFS= read -r path; do
            test -n "$path" || continue
            case "$path" in
              simulation/*|quality-reviews/step-2-executable-contract-v2/qualification-result.json)
                ;;
              *)
                echo "payload or verification escaped Step 2 repair boundary: $path" >&2
                exit 1
                ;;
            esac
          done <<< "$changed"
          git diff --stat
          git diff --numstat
          echo 'VALIDATED_WITHOUT_WRITE=true'
