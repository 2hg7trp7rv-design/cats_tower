name: Apply validated Step 2 V2 critic fixes

on:
  push:
    branches: [kimi]
    paths:
      - '.github/workflows/apply-step2-v2-critic-fixes.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-validated-step2-v2-critic-fixes-kimi
  cancel-in-progress: false

jobs:
  apply-validated-fixes:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: kimi
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify exact validated bytes and extract bounded archive
        shell: bash
        run: |
          set -euo pipefail
          PATCH='quality-reviews/step-2-executable-contract-v2/patch'
          EXPECTED_LIVE_BASE64_SHA='c4fffeaa5cf3f5d9f0b930723dc1e8fbae6ec9317438251d6b770f91b81266a2'
          EXPECTED_LIVE_GZIP_SHA='86edb96ebcd5782bd344be6db7b0d5b6dcb25680e9ef9fb882eeba9c7298d874'
          expected_chunks=(
            chunk-000.txt
            chunk-001.txt
            chunk-002.txt
            chunk-003.txt
            chunk-004.txt
            chunk-005.txt
          )

          for chunk in "${expected_chunks[@]}"; do
            test -f "$PATCH/$chunk" || { echo "missing payload chunk: $chunk" >&2; exit 1; }
          done
          actual_chunk_count="$(find "$PATCH" -maxdepth 1 -type f -name 'chunk-[0-9][0-9][0-9].txt' | wc -l | tr -d ' ')"
          test "$actual_chunk_count" = "${#expected_chunks[@]}" || {
            echo "unexpected payload chunk count: $actual_chunk_count" >&2
            exit 1
          }

          : > "$RUNNER_TEMP/step2-fixes.b64"
          for chunk in "${expected_chunks[@]}"; do
            tr -d '\r\n\t ' < "$PATCH/$chunk" >> "$RUNNER_TEMP/step2-fixes.b64"
          done
          actual_b64_sha="$(sha256sum "$RUNNER_TEMP/step2-fixes.b64" | awk '{print $1}')"
          test "$actual_b64_sha" = "$EXPECTED_LIVE_BASE64_SHA" || {
            echo "validated base64 bytes changed: $actual_b64_sha" >&2
            exit 1
          }

          base64 --decode "$RUNNER_TEMP/step2-fixes.b64" > "$RUNNER_TEMP/step2-fixes.tar.gz"
          actual_gzip_sha="$(sha256sum "$RUNNER_TEMP/step2-fixes.tar.gz" | awk '{print $1}')"
          test "$actual_gzip_sha" = "$EXPECTED_LIVE_GZIP_SHA" || {
            echo "validated gzip bytes changed: $actual_gzip_sha" >&2
            exit 1
          }

          python - <<'PY'
          import os
          import tarfile
          from pathlib import PurePosixPath

          archive_path = os.path.join(os.environ['RUNNER_TEMP'], 'step2-fixes.tar.gz')
          with tarfile.open(archive_path, 'r:gz') as archive:
              members = archive.getmembers()
              if not members:
                  raise SystemExit('empty patch archive')
              regular_files = 0
              for member in members:
                  path = PurePosixPath(member.name)
                  if path.is_absolute() or '..' in path.parts:
                      raise SystemExit(f'unsafe archive path: {member.name}')
                  if not (member.name == 'simulation' or member.name.startswith('simulation/')):
                      raise SystemExit(f'out-of-bound archive path: {member.name}')
                  if member.issym() or member.islnk() or member.isdev():
                      raise SystemExit(f'unsupported archive member type: {member.name}')
                  if not (member.isdir() or member.isfile()):
                      raise SystemExit(f'unsupported archive member: {member.name}')
                  if member.isfile():
                      regular_files += 1
              if len(members) != 23 or regular_files != 17:
                  raise SystemExit(f'archive shape changed: members={len(members)} files={regular_files}')
              archive.extractall('.', filter='data')
          PY
      - name: Run complete content-phase verification
        shell: bash
        run: |
          set -euo pipefail
          find simulation -name '*.mjs' -print0 | xargs -0 -n1 node --check
          node simulation/validate-candidate-v2.mjs
          node simulation/validate-run-plan-v2.mjs
          node simulation/fixtures/v2/validate-fixtures.mjs
          node simulation/migrations/v1-to-v2/validate-migration.mjs
          node simulation/engine-v2/run-plan.mjs --mode qualification --output quality-reviews/step-2-executable-contract-v2/qualification-result.json
          node simulation/validate-result-v2.mjs quality-reviews/step-2-executable-contract-v2/qualification-result.json --reproduce
          node simulation/verify-step2-v2.mjs
      - name: Create digest reconciliation and verify repair boundary
        shell: bash
        run: |
          set -euo pipefail
          changed="$(git status --short | sed -E 's/^.. //' | sed -E 's/.* -> //' || true)"
          test -n "$changed" || { echo 'payload produced no working-tree changes' >&2; exit 1; }
          while IFS= read -r path; do
            test -n "$path" || continue
            case "$path" in
              simulation/*|quality-reviews/step-2-executable-contract-v2/qualification-result.json)
                ;;
              *)
                echo "payload or verification escaped Step 2 repair boundary: $path" >&2
                exit 1
                ;;
            esac
          done <<< "$changed"

          python - <<'PY'
          import datetime
          import hashlib
          import json
          import os
          import tarfile
          from pathlib import Path

          root = Path('.')
          patch = root / 'quality-reviews/step-2-executable-contract-v2/patch'
          ready = json.loads((patch / 'READY').read_text(encoding='utf-8'))
          chunk_names = [f'chunk-{index:03d}.txt' for index in range(6)]
          chunks = []
          for name in chunk_names:
              data = (patch / name).read_bytes()
              chunks.append({
                  'path': str((patch / name).as_posix()),
                  'bytes': str(len(data)),
                  'sha256': hashlib.sha256(data).hexdigest()
              })

          archive_path = Path(os.environ['RUNNER_TEMP']) / 'step2-fixes.tar.gz'
          archive_files = []
          with tarfile.open(archive_path, 'r:gz') as archive:
              for member in archive.getmembers():
                  if not member.isfile():
                      continue
                  stream = archive.extractfile(member)
                  if stream is None:
                      raise SystemExit(f'cannot read archive member: {member.name}')
                  archive_files.append({
                      'path': member.name,
                      'bytes': str(member.size),
                      'sha256': hashlib.sha256(stream.read()).hexdigest()
                  })

          evidence = {
              'schemaVersion': 1,
              'artifactId': 'cats-tower-step2-v2-payload-digest-reconciliation',
              'recordedAt': datetime.datetime.now(datetime.timezone.utc).isoformat().replace('+00:00', 'Z'),
              'repository': '2hg7trp7rv-design/cats_tower',
              'branch': 'kimi',
              'originalReady': {
                  'path': 'quality-reviews/step-2-executable-contract-v2/patch/READY',
                  'blob': '16bbd4d55b930757f58d79fe3926d3032de51c6b',
                  'declaredBase64Sha256': ready['base64Sha256'],
                  'declaredGzipSha256': ready['gzipSha256'],
                  'status': 'DECLARED_DIGESTS_DID_NOT_MATCH_LIVE_CHUNKS'
              },
              'observedLivePayload': {
                  'sourceParts': '6',
                  'base64Bytes': '39688',
                  'base64Sha256': 'c4fffeaa5cf3f5d9f0b930723dc1e8fbae6ec9317438251d6b770f91b81266a2',
                  'gzipBytes': '29765',
                  'gzipSha256': '86edb96ebcd5782bd344be6db7b0d5b6dcb25680e9ef9fb882eeba9c7298d874',
                  'archiveMemberCount': '23',
                  'archiveFileCount': '17',
                  'chunks': chunks,
                  'files': archive_files
              },
              'failedRuns': [
                  {
                      'runId': '33069958416',
                      'jobId': '98509346515',
                      'failure': 'DECLARED_BASE64_DIGEST_MISMATCH'
                  },
                  {
                      'runId': '33075817950',
                      'jobId': '98529599452',
                      'failure': 'DECLARED_GZIP_DIGEST_MISMATCH',
                      'measuredBase64Sha256': 'c4fffeaa5cf3f5d9f0b930723dc1e8fbae6ec9317438251d6b770f91b81266a2',
                      'measuredGzipSha256': '86edb96ebcd5782bd344be6db7b0d5b6dcb25680e9ef9fb882eeba9c7298d874'
                  }
              ],
              'independentNoWriteValidation': {
                  'runId': '33076175208',
                  'jobId': '98530830012',
                  'headSha': '3d894af871c330b4a98ecc8b38a3b8038fcf5fc3',
                  'verdict': 'PASS',
                  'checks': {
                      'archiveSafetyAndScope': 'PASS',
                      'syntax': 'PASS',
                      'fullGitBlobSourceReadback': 'PASS',
                      'candidate': 'PASS',
                      'runPlan': 'PASS',
                      'fixtures': 'PASS',
                      'migration': 'PASS',
                      'qualificationReproduction': 'PASS',
                      'workingTreeBoundary': 'PASS'
                  },
                  'fixtureCounts': {
                      'positive': '12',
                      'boundaryTower': '8',
                      'negative': '85',
                      'stateSuccess': '11',
                      'stateInvalid': '6',
                      'goldenNumeric': '7',
                      'runPlanNegative': '12',
                      'migrationPositive': '2',
                      'migrationNegative': '6'
                  },
                  'qualificationScenarioCount': '30',
                  'qualificationDeterministicPayloadSha256': '83009807d3e24bd548c13a73830946b764e2a5f9294fcdeb4292eedb18a24423',
                  'balanceVerdict': 'NOT_EVALUATED_STEP2'
              },
              'application': {
                  'runId': os.environ['GITHUB_RUN_ID'],
                  'sourceHeadSha': os.environ['GITHUB_SHA'],
                  'contentPhaseVerdict': 'CONTENT_PHASE_PASS_STEP2_IN_PROGRESS'
              },
              'decision': {
                  'verdict': 'RECONCILED_AND_ACCEPTED_AFTER_EXACT_LIVE_BYTE_VALIDATION',
                  'basis': 'The original declared digests were rejected. The observed live bytes were separately pinned, decoded, constrained to simulation/**, inspected file-by-file, and passed the full no-write content verification before application.',
                  'originalDeclaredArchiveIdentityClaimed': False,
                  'step2Completed': False,
                  'step3Authorized': False
              },
              'writeBoundary': {
                  'runtimeChanged': False,
                  'assetChanged': False,
                  'backendChanged': False,
                  'productionChanged': False
              }
          }
          target = root / 'quality-reviews/step-2-executable-contract-v2/payload-digest-reconciliation.json'
          target.write_text(json.dumps(evidence, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY
      - name: Commit verified fixes only to existing kimi
        shell: bash
        run: |
          set -euo pipefail
          rm -rf quality-reviews/step-2-executable-contract-v2/patch
          rm -f .github/workflows/apply-step2-v2-critic-fixes.yml
          git config user.name 'cats-tower-step2-bot'
          git config user.email 'cats-tower-step2-bot@users.noreply.github.com'
          git add -A simulation quality-reviews/step-2-executable-contract-v2 .github/workflows/apply-step2-v2-critic-fixes.yml

          staged="$(git diff --cached --name-only)"
          test -n "$staged" || { echo 'no verified critic-fix changes to commit' >&2; exit 1; }
          printf '%s\n' "$staged"
          while IFS= read -r path; do
            case "$path" in
              simulation/*|quality-reviews/step-2-executable-contract-v2/qualification-result.json|quality-reviews/step-2-executable-contract-v2/payload-digest-reconciliation.json|quality-reviews/step-2-executable-contract-v2/patch/*|.github/workflows/apply-step2-v2-critic-fixes.yml)
                ;;
              *)
                echo "staged path escapes Step 2 repair boundary: $path" >&2
                exit 1
                ;;
            esac
          done <<< "$staged"

          git commit -m 'fix: close Step 2 V2 critic defects'
          git push origin HEAD:kimi
