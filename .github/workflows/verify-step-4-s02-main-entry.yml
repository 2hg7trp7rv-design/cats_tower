name: Verify Step 4 S02 main entry

on:
  workflow_dispatch:
  push:
    branches:
      - kimi
    paths:
      - "index.html"
      - "legacy.html"
      - "step4/s02/**"
      - "tests/step4/s02-*.mjs"
      - "quality-reviews/step-4-twelve-screen-final-mockups/s02-*"
      - "quality-reviews/step-1-canonical-design/active-change-control*.json"
      - ".github/workflows/verify-step-4-s02-main-entry.yml"
      - "PROJECT_STATUS.json"
      - "AI_PROJECT_POLICY.json"
      - "QUALITY_GATE.md"
      - ".github/workflows/CURRENT_STATUS.md"
      - "PROJECT_HANDOVER.md"
      - "AGENTS.md"

permissions:
  contents: read

concurrency:
  group: verify-step4-s02-main-entry-kimi
  cancel-in-progress: true

jobs:
  verify:
    name: Exact root, source route and legacy runtime
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout exact kimi commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Assert repository and branch boundary
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REPOSITORY}" = "2hg7trp7rv-design/cats_tower"
          test "${GITHUB_REF_NAME}" = "kimi"
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          echo "head=$(git rev-parse HEAD)"
          echo "tree=$(git rev-parse HEAD^{tree})"

      - name: Run fail-closed root integration contract
        shell: bash
        run: |
          set -euo pipefail
          node tests/step4/s02-static-contract-v3.mjs | tee s02-static-v3-report.json
          git diff --check

      - name: Install pinned Playwright and Chromium
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/s02-playwright
          cd /tmp/s02-playwright
          npm init -y >/dev/null 2>&1
          npm install --save-exact playwright@1.62.1
          npx playwright install --with-deps chromium

      - name: Start exact-head static server
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/s02-main-http.log 2>&1 &
          echo $! > /tmp/s02-main-http.pid
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:4173/ >/dev/null \
              && curl --fail --silent http://127.0.0.1:4173/step4/s02/ >/dev/null \
              && curl --fail --silent http://127.0.0.1:4173/legacy.html >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/s02-main-http.log
          exit 1

      - name: Run isolated S02 browser QA
        shell: bash
        env:
          PLAYWRIGHT_PACKAGE: /tmp/s02-playwright/node_modules/playwright
          S02_BASE_URL: http://127.0.0.1:4173/step4/s02/
          S02_EVIDENCE_DIR: quality-reviews/step-4-twelve-screen-final-mockups/s02-browser-evidence
        run: |
          set -euo pipefail
          node tests/step4/s02-browser-qa.mjs

      - name: Run actual root integration browser QA
        shell: bash
        env:
          PLAYWRIGHT_PACKAGE: /tmp/s02-playwright/node_modules/playwright
          S02_ORIGIN: http://127.0.0.1:4173
          S02_MAIN_ENTRY_EVIDENCE_DIR: quality-reviews/step-4-twelve-screen-final-mockups/s02-main-entry-evidence
        run: |
          set -euo pipefail
          node tests/step4/s02-main-entry-browser.mjs

      - name: Verify exact evidence payload
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object legacy.html)" = "c5871ded0f7fbb501dce08e2b0da767841ce789b"
          grep -q 'PASS_S02_STATIC_CONTRACT_V3' s02-static-v3-report.json
          grep -q 'PASS_S02_BROWSER_QA' quality-reviews/step-4-twelve-screen-final-mockups/s02-browser-evidence/report.json
          grep -q 'PASS_S02_MAIN_ENTRY_BROWSER_QA' quality-reviews/step-4-twelve-screen-final-mockups/s02-main-entry-evidence/report.json
          test "$(find quality-reviews/step-4-twelve-screen-final-mockups/s02-browser-evidence -maxdepth 1 -name '*.png' | wc -l | tr -d ' ')" = "5"
          test "$(find quality-reviews/step-4-twelve-screen-final-mockups/s02-main-entry-evidence -maxdepth 1 -name '*.png' | wc -l | tr -d ' ')" = "7"
          test -f quality-reviews/step-4-twelve-screen-final-mockups/s02-main-entry-evidence/root-320x667-normal.png
          test -f quality-reviews/step-4-twelve-screen-final-mockups/s02-main-entry-evidence/root-375x667-normal.png
          test -f quality-reviews/step-4-twelve-screen-final-mockups/s02-main-entry-evidence/root-390x844-normal.png
          test -f quality-reviews/step-4-twelve-screen-final-mockups/s02-main-entry-evidence/root-390x844-large-text.png
          test -f quality-reviews/step-4-twelve-screen-final-mockups/s02-main-entry-evidence/root-390x844-reduced-motion.png
          git diff --check

      - name: Upload exact-head main-entry evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: step4-s02-main-entry-evidence-${{ github.sha }}
          if-no-files-found: error
          retention-days: 30
          path: |
            s02-static-v3-report.json
            quality-reviews/step-4-twelve-screen-final-mockups/s02-browser-evidence/**
            quality-reviews/step-4-twelve-screen-final-mockups/s02-main-entry-evidence/**
            /tmp/s02-main-http.log
