name: Execute Step 3 holdout and high-volume validation

on:
  push:
    branches: [kimi]
    paths:
      - '.github/workflows/execute-step-3-final-validation.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: cats-step3-final-execution-${{ github.sha }}
  cancel-in-progress: false

jobs:
  preflight:
    name: step3-final-preflight
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify exact calibration gate and sealed execution inputs
        run: |
          set -euo pipefail
          ENTRY=3eefbf6fa7dfcec8b5b093612e8946b43d838bc2
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse --is-shallow-repository)" = "false"
          test -z "$(git replace -l)"
          git merge-base --is-ancestor "$ENTRY" HEAD
          test "$(git rev-parse HEAD:quality-reviews/step-1-reseal-round-008/seal-round-008.json)" = "0a959de0383b57ad6cd1f33c124b398aa51c1e00"
          test "$(git rev-parse HEAD:simulation/executable-seal-v2.json)" = "ee3507969c03b08fe27350263cf0bc093a1c18e1"
          test "$(git rev-parse HEAD:simulation/run-plan-v2.json)" = "a04632e41d78dd15b36e95cd6998e8a8648b9a6c"
          test "$(git rev-parse HEAD:simulation/execution-contract-v2.json)" = "82685b646358129d7e66a810b267777d6bf5af92"
          test "$(git rev-parse HEAD:quality-reviews/step-3-large-scale-validation/acceptance-matrix.json)" = "d1392c431282d0faae9e9ad7f1c22161a3c5caad"
          test "$(git rev-parse HEAD:quality-reviews/step-3-large-scale-validation/acceptance-addendum-calibration-001.json)" = "9d0c89489363340c4954b6912fb105ca6789b462"
          test "$(git rev-parse HEAD:quality-reviews/step-3-large-scale-validation/acceptance-addendum-transport-002.json)" = "a8c853c1fe61e2ff5f5fced6d3776bcc97821d21"
          test "$(git rev-parse HEAD:quality-reviews/step-3-large-scale-validation/calibration-gate.json)" = "5ecb6c177a0c52f164c4ad22723f54305bf8c97d"
          test "$(git rev-parse HEAD:quality-reviews/step-3-large-scale-validation/calibration-live-readback.json)" = "284ace113d40f6e0fa1a832e660a677b8eb65c5a"
          test "$(git rev-parse HEAD:quality-reviews/step-3-large-scale-validation/gameplay-calibration-result.json)" = "79a531def0e6e88c202eac12d414e19b79902159"
          test "$(git rev-parse HEAD:quality-reviews/step-3-large-scale-validation/calibration-audit.json)" = "36c29a78ee38bb3082a39b719fccd2da503b9016"
          test "$(git rev-parse HEAD:quality-reviews/step-3-large-scale-validation/audit-holdout.mjs)" = "7f6e5069c08b088c75134ed9d9650de24565545f"
          test "$(git rev-parse HEAD:quality-reviews/step-3-large-scale-validation/audit-high-volume.mjs)" = "bd421bf758ff0d42150b96d8f5085b71dfbc4403"
          jq -e '.verdict == "PASS_CALIBRATION_GATE_HOLDOUT_AUTHORIZED" and .quality.unresolvedP0 == 0 and .quality.unresolvedP1 == 0 and .holdout.authorized == true and .holdout.executed == false and .holdout.tuningReuseForbidden == true' quality-reviews/step-3-large-scale-validation/calibration-gate.json >/dev/null
          jq -e '.verdict == "PASS_FINAL_CALIBRATION_READBACK_HOLDOUT_AUTHORIZED" and .holdout.authorized == true and .holdout.executed == false and .holdout.tuningVisible == false and .holdout.reuseForTuningForbidden == true' quality-reviews/step-3-large-scale-validation/calibration-live-readback.json >/dev/null
          jq -e '.verdict == "PASS_CALIBRATION_GATE_CANDIDATE" and .unresolvedP0 == 0 and .unresolvedP1 == 0' quality-reviews/step-3-large-scale-validation/calibration-audit.json >/dev/null
          test ! -e quality-reviews/step-3-large-scale-validation/gameplay-holdout-result.json
          test ! -d quality-reviews/step-3-large-scale-validation/high-volume
          mapfile -t CHANGED < <(git diff --name-only "$ENTRY"..HEAD)
          for path in "${CHANGED[@]}"; do
            case "$path" in
              quality-reviews/step-3-large-scale-validation/*|.github/workflows/verify-step-3-calibration.yml|.github/workflows/repair-step-3-calibration-artifact.yml|.github/workflows/seal-step-3-calibration.yml|.github/workflows/execute-step-3-final-validation.yml) ;;
              *) echo "Forbidden Step 3 preflight path: $path" >&2; exit 1 ;;
            esac
          done
          git diff --check "$ENTRY"..HEAD
          node --check quality-reviews/step-3-large-scale-validation/audit-holdout.mjs
          node --check quality-reviews/step-3-large-scale-validation/audit-high-volume.mjs

      - name: Re-run sealed Step 2 regression
        run: node simulation/verify-step2-v2.mjs

  holdout:
    name: unseen-holdout-3000
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Execute 3,000 unseen holdout scenarios
        env:
          CT_STEP3_AUTHORIZED: '1'
        run: |
          set -euo pipefail
          DIR="$RUNNER_TEMP/cats-step3-holdout"
          mkdir -p "$DIR"
          node simulation/engine-v2/run-plan.mjs \
            --mode gameplay \
            --owner STEP3 \
            --partition holdout \
            --output "$DIR/gameplay-holdout-result.json"

      - name: Validate, reproduce and audit unseen holdout
        run: |
          set -euo pipefail
          DIR="$RUNNER_TEMP/cats-step3-holdout"
          RESULT="$DIR/gameplay-holdout-result.json"
          node simulation/validate-gameplay-result-v2.mjs "$RESULT" --reproduce
          jq -e '
            .deterministicPayload.mode == "STEP3_GAMEPLAY_PARTITION" and
            .deterministicPayload.partition == "holdout" and
            .deterministicPayload.tuningVisible == false and
            .deterministicPayload.seedsPerCell == "200" and
            .deterministicPayload.scenarioCount == "3000" and
            .deterministicPayload.expectedScenarioCount == "3000" and
            .deterministicPayload.complete == true and
            (.deterministicPayload.cells | length) == 15 and
            .verdict.contractValidation == "PASS" and
            .verdict.partitionComplete == true and
            .verdict.partialResultPromotion == false
          ' "$RESULT" >/dev/null
          node quality-reviews/step-3-large-scale-validation/audit-holdout.mjs \
            --result "$RESULT" \
            --output "$DIR/holdout-audit.json"
          jq -e '.verdict == "PASS_UNSEEN_HOLDOUT_GATE_CANDIDATE" and .replay.scenarioCount == "3000" and .separation.calibrationInputOverlap == "0" and .separation.calibrationScenarioOverlap == "0" and .separation.tuningVisible == false and .unresolvedP0 == 0 and .unresolvedP1 == 0' "$DIR/holdout-audit.json" >/dev/null

      - name: Create portable holdout manifest
        run: |
          set -euo pipefail
          DIR="$RUNNER_TEMP/cats-step3-holdout"
          RESULT="$DIR/gameplay-holdout-result.json"
          AUDIT="$DIR/holdout-audit.json"
          jq -n \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg branch "kimi" \
            --arg head "$(git rev-parse HEAD)" \
            --arg tree "$(git rev-parse HEAD^{tree})" \
            --arg workflow "$GITHUB_WORKFLOW" \
            --arg runId "$GITHUB_RUN_ID" \
            --arg runAttempt "$GITHUB_RUN_ATTEMPT" \
            --arg job "$GITHUB_JOB" \
            --arg resultSha256 "$(sha256sum "$RESULT" | cut -d' ' -f1)" \
            --arg resultBytes "$(wc -c < "$RESULT" | tr -d ' ')" \
            --arg resultDigest "$(jq -r '.hashes.deterministicPayloadSha256' "$RESULT")" \
            --arg auditSha256 "$(sha256sum "$AUDIT" | cut -d' ' -f1)" \
            --arg auditBytes "$(wc -c < "$AUDIT" | tr -d ' ')" \
            '{
              schemaVersion: 1,
              artifactId: "cats-tower-step3-holdout-execution-manifest",
              repository: $repository,
              branch: $branch,
              head: $head,
              tree: $tree,
              workflow: $workflow,
              runId: $runId,
              runAttempt: $runAttempt,
              job: $job,
              authority: {
                calibrationGateBlob: "5ecb6c177a0c52f164c4ad22723f54305bf8c97d",
                calibrationReadbackBlob: "284ace113d40f6e0fa1a832e660a677b8eb65c5a",
                holdoutAuditScriptBlob: "7f6e5069c08b088c75134ed9d9650de24565545f",
                step2SealBlob: "ee3507969c03b08fe27350263cf0bc093a1c18e1"
              },
              result: {path: "gameplay-holdout-result.json", scenarioCount: "3000", sha256: $resultSha256, bytes: $resultBytes, deterministicPayloadSha256: $resultDigest},
              audit: {path: "holdout-audit.json", sha256: $auditSha256, bytes: $auditBytes, verdict: "PASS_UNSEEN_HOLDOUT_GATE_CANDIDATE"},
              tuningVisible: false,
              tuningReuseForbidden: true,
              verdict: "PASS_UNSEEN_HOLDOUT_ARTIFACT_READY"
            }' > "$DIR/holdout-execution-manifest.json"
          test -s "$DIR/holdout-execution-manifest.json"
          (
            cd "$DIR"
            sha256sum gameplay-holdout-result.json holdout-audit.json holdout-execution-manifest.json > SHA256SUMS-holdout
            sha256sum -c SHA256SUMS-holdout
          )

      - name: Upload unseen holdout evidence
        uses: actions/upload-artifact@v4
        with:
          name: cats-tower-step3-holdout-${{ github.sha }}-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/cats-step3-holdout
          if-no-files-found: error
          retention-days: 30
          compression-level: 6

  high-volume:
    name: high-volume-${{ matrix.suite }}
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        suite:
          - gacha-tails
          - pity-conformance
          - duplicate-skew-overflow
          - refund-replay-race
          - state-machine-model
          - large-number-properties
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Execute full sealed suite
        env:
          CT_STEP3_AUTHORIZED: '1'
          SUITE: ${{ matrix.suite }}
        run: |
          set -euo pipefail
          DIR="$RUNNER_TEMP/cats-step3-high-volume-$SUITE"
          mkdir -p "$DIR"
          node simulation/engine-v2/high-volume.mjs \
            --mode full \
            --owner STEP3 \
            --suite "$SUITE" \
            --output "$DIR/high-volume-$SUITE.json"

      - name: Validate, reproduce and audit suite
        env:
          SUITE: ${{ matrix.suite }}
        run: |
          set -euo pipefail
          DIR="$RUNNER_TEMP/cats-step3-high-volume-$SUITE"
          RESULT="$DIR/high-volume-$SUITE.json"
          node simulation/validate-high-volume-result-v2.mjs "$RESULT" --reproduce
          node quality-reviews/step-3-large-scale-validation/audit-high-volume.mjs \
            --result "$RESULT" \
            --suite "$SUITE" \
            --output "$DIR/audit-high-volume-$SUITE.json"
          jq -e --arg suite "$SUITE" '.suiteId == $suite and .verdict == "PASS_HIGH_VOLUME_SUITE_AUDIT" and .unresolvedP0 == 0 and .unresolvedP1 == 0' "$DIR/audit-high-volume-$SUITE.json" >/dev/null

      - name: Create portable suite manifest
        env:
          SUITE: ${{ matrix.suite }}
        run: |
          set -euo pipefail
          DIR="$RUNNER_TEMP/cats-step3-high-volume-$SUITE"
          RESULT="$DIR/high-volume-$SUITE.json"
          AUDIT="$DIR/audit-high-volume-$SUITE.json"
          jq -n \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg branch "kimi" \
            --arg suite "$SUITE" \
            --arg head "$(git rev-parse HEAD)" \
            --arg tree "$(git rev-parse HEAD^{tree})" \
            --arg workflow "$GITHUB_WORKFLOW" \
            --arg runId "$GITHUB_RUN_ID" \
            --arg runAttempt "$GITHUB_RUN_ATTEMPT" \
            --arg job "$GITHUB_JOB" \
            --arg resultSha256 "$(sha256sum "$RESULT" | cut -d' ' -f1)" \
            --arg resultBytes "$(wc -c < "$RESULT" | tr -d ' ')" \
            --arg resultDigest "$(jq -r '.hashes.deterministicPayloadSha256' "$RESULT")" \
            --arg sampleCount "$(jq -r '.deterministicPayload.sampleCount' "$RESULT")" \
            --arg auditSha256 "$(sha256sum "$AUDIT" | cut -d' ' -f1)" \
            --arg auditBytes "$(wc -c < "$AUDIT" | tr -d ' ')" \
            '{
              schemaVersion: 1,
              artifactId: ("cats-tower-step3-high-volume-" + $suite + "-execution-manifest"),
              repository: $repository,
              branch: $branch,
              suiteId: $suite,
              head: $head,
              tree: $tree,
              workflow: $workflow,
              runId: $runId,
              runAttempt: $runAttempt,
              job: $job,
              authority: {
                calibrationReadbackBlob: "284ace113d40f6e0fa1a832e660a677b8eb65c5a",
                highVolumeAuditScriptBlob: "bd421bf758ff0d42150b96d8f5085b71dfbc4403",
                step2SealBlob: "ee3507969c03b08fe27350263cf0bc093a1c18e1"
              },
              result: {path: ("high-volume-" + $suite + ".json"), sampleCount: $sampleCount, sha256: $resultSha256, bytes: $resultBytes, deterministicPayloadSha256: $resultDigest},
              audit: {path: ("audit-high-volume-" + $suite + ".json"), sha256: $auditSha256, bytes: $auditBytes, verdict: "PASS_HIGH_VOLUME_SUITE_AUDIT"},
              verdict: "PASS_HIGH_VOLUME_SUITE_ARTIFACT_READY"
            }' > "$DIR/manifest-high-volume-$SUITE.json"
          test -s "$DIR/manifest-high-volume-$SUITE.json"
          (
            cd "$DIR"
            sha256sum "high-volume-$SUITE.json" "audit-high-volume-$SUITE.json" "manifest-high-volume-$SUITE.json" > "SHA256SUMS-$SUITE"
            sha256sum -c "SHA256SUMS-$SUITE"
          )

      - name: Upload high-volume suite evidence
        uses: actions/upload-artifact@v4
        with:
          name: cats-tower-step3-high-volume-${{ matrix.suite }}-${{ github.sha }}-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/cats-step3-high-volume-${{ matrix.suite }}
          if-no-files-found: error
          retention-days: 30
          compression-level: 6

  aggregate:
    name: aggregate-step3-final-execution
    needs:
      - holdout
      - high-volume
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Download holdout evidence from this run
        uses: actions/download-artifact@v4
        with:
          name: cats-tower-step3-holdout-${{ github.sha }}-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/cats-step3-final-aggregate

      - name: Download all high-volume evidence from this run
        uses: actions/download-artifact@v4
        with:
          pattern: cats-tower-step3-high-volume-*-${{ github.sha }}-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/cats-step3-final-aggregate
          merge-multiple: true

      - name: Verify complete aggregate and create manifest
        run: |
          set -euo pipefail
          DIR="$RUNNER_TEMP/cats-step3-final-aggregate"
          cd "$DIR"
          sha256sum -c SHA256SUMS-holdout
          for suite in gacha-tails pity-conformance duplicate-skew-overflow refund-replay-race state-machine-model large-number-properties; do
            test -s "high-volume-$suite.json"
            test -s "audit-high-volume-$suite.json"
            test -s "manifest-high-volume-$suite.json"
            test -s "SHA256SUMS-$suite"
            sha256sum -c "SHA256SUMS-$suite"
            jq -e --arg suite "$suite" '.deterministicPayload.suiteId == $suite and .deterministicPayload.complete == true and .verdict.contractValidation == "PASS" and .verdict.suiteComplete == true' "high-volume-$suite.json" >/dev/null
            jq -e --arg suite "$suite" '.suiteId == $suite and .verdict == "PASS_HIGH_VOLUME_SUITE_AUDIT" and .unresolvedP0 == 0 and .unresolvedP1 == 0' "audit-high-volume-$suite.json" >/dev/null
          done
          jq -e '.deterministicPayload.partition == "holdout" and .deterministicPayload.scenarioCount == "3000" and .deterministicPayload.tuningVisible == false and .verdict.contractValidation == "PASS"' gameplay-holdout-result.json >/dev/null
          jq -e '.verdict == "PASS_UNSEEN_HOLDOUT_GATE_CANDIDATE" and .unresolvedP0 == 0 and .unresolvedP1 == 0 and .separation.calibrationInputOverlap == "0" and .separation.calibrationScenarioOverlap == "0"' holdout-audit.json >/dev/null
          TOTAL_HIGH_VOLUME=$(jq -s 'map(.deterministicPayload.sampleCount | tonumber) | add' high-volume-*.json)
          test "$TOTAL_HIGH_VOLUME" = "1700000"
          jq -n \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg branch "kimi" \
            --arg head "$(git rev-parse HEAD)" \
            --arg tree "$(git rev-parse HEAD^{tree})" \
            --arg workflow "$GITHUB_WORKFLOW" \
            --arg runId "$GITHUB_RUN_ID" \
            --arg runAttempt "$GITHUB_RUN_ATTEMPT" \
            --arg job "$GITHUB_JOB" \
            --argjson totalHighVolume "$TOTAL_HIGH_VOLUME" \
            --arg holdoutDigest "$(jq -r '.hashes.deterministicPayloadSha256' gameplay-holdout-result.json)" \
            --arg holdoutResultSha256 "$(sha256sum gameplay-holdout-result.json | cut -d' ' -f1)" \
            --arg holdoutAuditSha256 "$(sha256sum holdout-audit.json | cut -d' ' -f1)" \
            '{
              schemaVersion: 1,
              artifactId: "cats-tower-step3-final-execution-aggregate-manifest",
              repository: $repository,
              branch: $branch,
              head: $head,
              tree: $tree,
              workflow: $workflow,
              runId: $runId,
              runAttempt: $runAttempt,
              job: $job,
              authority: {
                calibrationGateBlob: "5ecb6c177a0c52f164c4ad22723f54305bf8c97d",
                calibrationReadbackBlob: "284ace113d40f6e0fa1a832e660a677b8eb65c5a",
                holdoutAuditScriptBlob: "7f6e5069c08b088c75134ed9d9650de24565545f",
                highVolumeAuditScriptBlob: "bd421bf758ff0d42150b96d8f5085b71dfbc4403",
                step2SealBlob: "ee3507969c03b08fe27350263cf0bc093a1c18e1"
              },
              gameplay: {
                calibrationScenarios: "12000",
                unseenHoldoutScenarios: "3000",
                totalScenarios: "15000",
                holdoutDeterministicPayloadSha256: $holdoutDigest,
                holdoutResultSha256: $holdoutResultSha256,
                holdoutAuditSha256: $holdoutAuditSha256,
                calibrationInputOverlap: "0",
                calibrationScenarioOverlap: "0",
                tuningVisible: false,
                tuningReuseForbidden: true
              },
              highVolume: {
                suiteCount: "6",
                totalSamples: ($totalHighVolume | tostring),
                suites: [
                  {id: "gacha-tails", samples: "200000"},
                  {id: "pity-conformance", samples: "1000000"},
                  {id: "duplicate-skew-overflow", samples: "200000"},
                  {id: "refund-replay-race", samples: "100000"},
                  {id: "state-machine-model", samples: "100000"},
                  {id: "large-number-properties", samples: "100000"}
                ]
              },
              partialResultPromotion: false,
              verdict: "PASS_STEP3_FINAL_EXECUTION_ARTIFACT_READY_FOR_EXTERNAL_AUDIT"
            }' > final-execution-manifest.json
          test -s final-execution-manifest.json
          find . -maxdepth 1 -type f ! -name 'SHA256SUMS-aggregate' -printf '%f\0' | sort -z | xargs -0 sha256sum > SHA256SUMS-aggregate
          sha256sum -c SHA256SUMS-aggregate

      - name: Upload aggregate Step 3 execution evidence
        uses: actions/upload-artifact@v4
        with:
          name: cats-tower-step3-final-execution-${{ github.sha }}-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/cats-step3-final-aggregate
          if-no-files-found: error
          retention-days: 30
          compression-level: 6
