      - name: Confirm bounded repair and no forbidden files
        shell: bash
        run: |
          set -euo pipefail
          changed="$(git status --short | sed -E 's/^.. //' | sed -E 's/.* -> //')"
          printf '%s\n' "$changed"
          test -n "$changed"
          while IFS= read -r path; do
            case "$path" in
              simulation/*|quality-reviews/step-2-executable-contract-v2/qualification-result.json|.github/workflows/diagnose-step2-v2-tower-evidence.yml)
                ;;
              *)
                echo "tower evidence repair escaped Step 2 boundary: $path" >&2
                exit 1
                ;;
            esac
          done <<< "$changed"
          git diff --check
          git diff --stat
          echo 'TOWER_SEQUENCE_AND_INPUT_EVIDENCE_VALIDATED_WITHOUT_WRITE=true'
