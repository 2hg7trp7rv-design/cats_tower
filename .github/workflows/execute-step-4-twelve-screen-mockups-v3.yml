name: Build Step 4 XML-valid twelve-screen mockup draft v3

on:
  push:
    branches: [kimi]
    paths:
      - '.github/workflows/execute-step-4-twelve-screen-mockups-v3.yml'
      - 'quality-reviews/step-4-twelve-screen-final-mockups/acceptance-matrix.json'
      - 'quality-reviews/step-4-twelve-screen-final-mockups/tools/build-step4-draft-v3.mjs'
      - 'quality-reviews/step-4-twelve-screen-final-mockups/**'
      - 'tests/step4/verify-step4-mockups-v3.mjs'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: cats-tower-step4-mockup-draft
  cancel-in-progress: false

jobs:
  build-and-verify-step4-draft-v3:
    name: build-and-verify-step4-draft-v3
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      STEP3_ENTRY: 245d50b6e80e2783f6aeaab5e50fae217661a3b6
      STEP4_DIR: quality-reviews/step-4-twelve-screen-final-mockups
      GENERATOR: quality-reviews/step-4-twelve-screen-final-mockups/tools/build-step4-draft-v3.mjs
      VERIFIER: tests/step4/verify-step4-mockups-v3.mjs
      MANIFEST: quality-reviews/step-4-twelve-screen-final-mockups/render-manifest.json
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify exact authority and determine phase
        id: phase
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = '2hg7trp7rv-design/cats_tower'
          test "$GITHUB_REF_NAME" = 'kimi'
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse --is-shallow-repository)" = 'false'
          test -z "$(git replace -l)"
          git merge-base --is-ancestor "$STEP3_ENTRY" HEAD
          test "$(git rev-parse HEAD:quality-reviews/step-1-reseal-round-008/seal-round-008.json)" = '0a959de0383b57ad6cd1f33c124b398aa51c1e00'
          test "$(git rev-parse HEAD:simulation/executable-seal-v2.json)" = 'ee3507969c03b08fe27350263cf0bc093a1c18e1'
          test "$(git rev-parse HEAD:quality-reviews/step-3-large-scale-validation/live-readback.json)" = 'd0b73af25a8f0d449cfc083b007b84b8ff3fbc9b'
          test "$(git rev-parse HEAD:$STEP4_DIR/acceptance-matrix.json)" = '7d907578c367ef426e11f97393637f23e14e25c2'
          node --check "$GENERATOR"
          node --check "$VERIFIER"
          CURRENT_GENERATOR_BLOB=$(git rev-parse "HEAD:$GENERATOR")
          if [ -f "$MANIFEST" ] && jq -e --arg blob "$CURRENT_GENERATOR_BLOB" '.generatorBlob == $blob and .xmlVerdict == "PASS_DETERMINISTIC_STEP4_DRAFT_RENDERS_XML_VALID_V3"' "$MANIFEST" >/dev/null; then
            MODE=verify
          else
            MODE=generate
          fi
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"
          echo "Detected Step 4 v3 mode: $MODE"

      - name: Configure exact kimi writer
        if: steps.phase.outputs.mode == 'generate'
        run: |
          set -euo pipefail
          test "$(git rev-parse origin/kimi)" = "$GITHUB_SHA"
          git checkout -B kimi "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          test "$(git branch --show-current)" = 'kimi'

      - name: Generate original XML-valid twelve-screen draft
        if: steps.phase.outputs.mode == 'generate'
        run: |
          set -euo pipefail
          node "$GENERATOR" | tee "$RUNNER_TEMP/step4-v3-generation.json"
          jq -e '.verdict == "PASS_STEP4_DRAFT_GENERATION_V3" and .screenCount == 12 and .viewportCount == 3 and .renderCount == 36 and .xmlValidation == "PASS" and .v1Compatibility == "PASS_COMPATIBLE"' "$RUNNER_TEMP/step4-v3-generation.json" >/dev/null
          node "$VERIFIER" | tee "$RUNNER_TEMP/step4-v3-precommit-verification.json"
          jq -e '.verdict == "PASS_STEP4_MOCKUP_DRAFT_VALIDATION_V3" and .screenCount == 12 and .renderCount == 36 and .xmlParsed == true and .v1Compatibility == true and .forbiddenPathCount == 0' "$RUNNER_TEMP/step4-v3-precommit-verification.json" >/dev/null
          git diff --check
          { git diff --name-only; git ls-files --others --exclude-standard; } | sort -u > "$RUNNER_TEMP/changed-paths.txt"
          test -s "$RUNNER_TEMP/changed-paths.txt"
          while read -r FILE; do
            case "$FILE" in
              quality-reviews/step-4-twelve-screen-final-mockups/*) ;;
              *) echo "Unexpected generated path: $FILE" >&2; exit 1 ;;
            esac
          done < "$RUNNER_TEMP/changed-paths.txt"

      - name: Commit generated draft and exact XML evidence
        if: steps.phase.outputs.mode == 'generate'
        run: |
          set -euo pipefail
          git add "$STEP4_DIR"
          git commit -m 'step4: generate XML-valid twelve-screen mockup draft v3'
          node "$VERIFIER" | tee "$RUNNER_TEMP/step4-v3-committed-verification.json"
          jq -e '.verdict == "PASS_STEP4_MOCKUP_DRAFT_VALIDATION_V3" and .forbiddenPathCount == 0' "$RUNNER_TEMP/step4-v3-committed-verification.json" >/dev/null
          git diff --check "$STEP3_ENTRY..HEAD"
          test -z "$(git status --porcelain --untracked-files=all)"
          git push origin HEAD:kimi

      - name: Verify committed v3 draft at exact live descendant
        if: steps.phase.outputs.mode == 'verify'
        run: |
          set -euo pipefail
          node "$VERIFIER" | tee "$RUNNER_TEMP/step4-v3-live-verification.json"
          jq -e '.verdict == "PASS_STEP4_MOCKUP_DRAFT_VALIDATION_V3" and .screenCount == 12 and .viewportCount == 3 and .renderCount == 36 and .xmlParsed == true and .v1Compatibility == true and .forbiddenPathCount == 0' "$RUNNER_TEMP/step4-v3-live-verification.json" >/dev/null
          git diff --check "$STEP3_ENTRY..HEAD"
          test -z "$(git status --porcelain --untracked-files=all)"
