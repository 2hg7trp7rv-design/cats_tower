name: Activate Step 4 draft and current mirrors

on:
  push:
    branches: [kimi]
    paths:
      - '.github/workflows/activate-step-4-draft.yml'
      - 'quality-reviews/step-4-twelve-screen-final-mockups/tools/activate-step4-draft.mjs'
      - 'quality-reviews/step-4-twelve-screen-final-mockups/render-manifest.json'
      - 'quality-reviews/step-4-twelve-screen-final-mockups/draft-activation-evidence.json'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: cats-tower-step4-draft-activation
  cancel-in-progress: false

jobs:
  activate-step4-draft:
    name: activate-step4-draft
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      STEP3_ENTRY: 245d50b6e80e2783f6aeaab5e50fae217661a3b6
      STEP4_DIR: quality-reviews/step-4-twelve-screen-final-mockups
      TOOL: quality-reviews/step-4-twelve-screen-final-mockups/tools/activate-step4-draft.mjs
      VERIFIER: tests/step4/verify-step4-mockups-v3.mjs
      ACTIVATION: quality-reviews/step-4-twelve-screen-final-mockups/draft-activation-evidence.json
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify authority and determine phase
        id: phase
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = '2hg7trp7rv-design/cats_tower'
          test "$GITHUB_REF_NAME" = 'kimi'
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse --is-shallow-repository)" = 'false'
          test -z "$(git replace -l)"
          git merge-base --is-ancestor "$STEP3_ENTRY" HEAD
          test "$(git rev-parse HEAD:quality-reviews/step-1-reseal-round-008/seal-round-008.json)" = '0a959de0383b57ad6cd1f33c124b398aa51c1e00'
          test "$(git rev-parse HEAD:simulation/executable-seal-v2.json)" = 'ee3507969c03b08fe27350263cf0bc093a1c18e1'
          test "$(git rev-parse HEAD:quality-reviews/step-3-large-scale-validation/live-readback.json)" = 'd0b73af25a8f0d449cfc083b007b84b8ff3fbc9b'
          test "$(git rev-parse HEAD:$STEP4_DIR/acceptance-matrix.json)" = '7d907578c367ef426e11f97393637f23e14e25c2'
          node --check "$TOOL"
          node --check "$VERIFIER"
          node "$VERIFIER" | tee "$RUNNER_TEMP/step4-draft-verification.json"
          jq -e '.verdict == "PASS_STEP4_MOCKUP_DRAFT_VALIDATION_V3" and .renderCount == 36 and .forbiddenPathCount == 0' "$RUNNER_TEMP/step4-draft-verification.json" >/dev/null
          if [ -f "$ACTIVATION" ]; then MODE=verify; else MODE=prepare; fi
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"
          echo "Detected activation mode: $MODE"

      - name: Resolve successful Step 4 draft workflow evidence
        id: evidence
        if: steps.phase.outputs.mode == 'prepare'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          RUNS=$(curl -fsSL \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/workflows/execute-step-4-twelve-screen-mockups-v3.yml/runs?branch=kimi&status=success&per_page=30")
          RUN_ID=''
          RUN_COMMIT=''
          while read -r ID SHA; do
            if git merge-base --is-ancestor "$SHA" HEAD; then RUN_ID="$ID"; RUN_COMMIT="$SHA"; break; fi
          done < <(jq -r '.workflow_runs[] | [.id, .head_sha] | @tsv' <<<"$RUNS")
          test -n "$RUN_ID"
          test -n "$RUN_COMMIT"
          RUN=$(curl -fsSL \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID")
          test "$(jq -r '.status' <<<"$RUN")" = 'completed'
          test "$(jq -r '.conclusion' <<<"$RUN")" = 'success'
          JOBS=$(curl -fsSL \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID/jobs?per_page=100")
          JOB_ID=$(jq -r '.jobs[] | select(.name == "build-and-verify-step4-draft-v3" and .conclusion == "success") | .id' <<<"$JOBS" | head -1)
          test -n "$JOB_ID"
          RUN_TREE=$(git rev-parse "$RUN_COMMIT^{tree}")
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"
          echo "job_id=$JOB_ID" >> "$GITHUB_OUTPUT"
          echo "run_commit=$RUN_COMMIT" >> "$GITHUB_OUTPUT"
          echo "run_tree=$RUN_TREE" >> "$GITHUB_OUTPUT"

      - name: Configure exact kimi writer
        if: steps.phase.outputs.mode == 'prepare'
        run: |
          set -euo pipefail
          test "$(git rev-parse origin/kimi)" = "$GITHUB_SHA"
          git checkout -B kimi "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

      - name: Activate Step 4 and synchronize non-workflow mirrors
        if: steps.phase.outputs.mode == 'prepare'
        env:
          STEP4_RUN_ID: ${{ steps.evidence.outputs.run_id }}
          STEP4_JOB_ID: ${{ steps.evidence.outputs.job_id }}
          STEP4_RUN_COMMIT: ${{ steps.evidence.outputs.run_commit }}
          STEP4_RUN_TREE: ${{ steps.evidence.outputs.run_tree }}
          STEP4_RUN_CONCLUSION: success
        run: |
          set -euo pipefail
          node "$TOOL" prepare | tee "$RUNNER_TEMP/step4-activation.json"
          jq -e '.verdict == "PASS_STEP4_DRAFT_ACTIVATION_PENDING_WORKFLOW_MIRROR" and .workflowMirrorPending == true' "$RUNNER_TEMP/step4-activation.json" >/dev/null
          node "$TOOL" verify
          git diff --check
          { git diff --name-only; git ls-files --others --exclude-standard; } | sort -u > "$RUNNER_TEMP/changed-paths.txt"
          cat > "$RUNNER_TEMP/expected-paths.txt" <<'EOF'
          AGENTS.md
          AI_PROJECT_POLICY.json
          CHATGPT_PROJECT_BOOTSTRAP.md
          CUSTOM_GPT_CONFIGURATION.md
          PROJECT_HANDOVER.md
          PROJECT_STATUS.json
          QUALITY_GATE.md
          README.md
          quality-reviews/step-1-canonical-design/active-change-control-addendum-round-017.json
          quality-reviews/step-1-canonical-design/active-change-control.json
          quality-reviews/step-4-twelve-screen-final-mockups/draft-activation-evidence.json
          simulation/CURRENT_STATUS.json
          simulation/INPUT_CONTRACT.md
          EOF
          sort -o "$RUNNER_TEMP/expected-paths.txt" "$RUNNER_TEMP/expected-paths.txt"
          diff -u "$RUNNER_TEMP/expected-paths.txt" "$RUNNER_TEMP/changed-paths.txt"

      - name: Commit Step 4 activation content
        if: steps.phase.outputs.mode == 'prepare'
        run: |
          set -euo pipefail
          git add \
            AGENTS.md AI_PROJECT_POLICY.json CHATGPT_PROJECT_BOOTSTRAP.md CUSTOM_GPT_CONFIGURATION.md \
            PROJECT_HANDOVER.md PROJECT_STATUS.json QUALITY_GATE.md README.md \
            quality-reviews/step-1-canonical-design/active-change-control-addendum-round-017.json \
            quality-reviews/step-1-canonical-design/active-change-control.json \
            quality-reviews/step-4-twelve-screen-final-mockups/draft-activation-evidence.json \
            simulation/CURRENT_STATUS.json simulation/INPUT_CONTRACT.md
          git commit -m 'step4: activate twelve-screen mockup draft review'
          node "$TOOL" verify
          git diff --check "$STEP3_ENTRY..HEAD"
          test -z "$(git status --porcelain --untracked-files=all)"
          git push origin HEAD:kimi

      - name: Verify committed activation content
        if: steps.phase.outputs.mode == 'verify'
        run: |
          set -euo pipefail
          node "$TOOL" verify
          git diff --check "$STEP3_ENTRY..HEAD"
          test -z "$(git status --porcelain --untracked-files=all)"
