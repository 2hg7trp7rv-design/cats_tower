name: Apply validated Step 2 V2 execution fixes

on:
  push:
    branches: [kimi]
    paths:
      - '.github/workflows/apply-step2-v2-execution-fixes.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-step2-v2-execution-fixes-kimi
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply the exact no-write-validated source corrections
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('simulation/engine-v2/high-volume.mjs')
          text = path.read_text(encoding='utf-8')
          replacements = {
              "import { parseExactDecimal, toBigInt } from './numeric.mjs';": "import { parseExactDecimal, normalizeUnsigned } from './numeric.mjs';",
              "[key, toBigInt(value).toString()]": "[key, normalizeUnsigned(value)]",
              "function pityConformance(candidate, samples, namespace) {": "function pityConformance(candidate, _execution, samples, namespace) {",
              "function duplicateSkew(candidate, samples, namespace) {": "function duplicateSkew(candidate, _execution, samples, namespace) {",
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'missing expected source fragment: {old}')
              text = text.replace(old, new)
          path.write_text(text, encoding='utf-8')
          PY
      - name: Run exact execution-contract validation before commit
        shell: bash
        run: |
          set -euo pipefail
          find simulation -name '*.mjs' -print0 | xargs -0 -n1 node --check
          node simulation/validate-run-plan-v2.mjs
          node simulation/validate-execution-contract-v2.mjs
          node simulation/engine-v2/statistics.mjs
          node simulation/engine-v2/run-plan.mjs --mode qualification --output quality-reviews/step-2-executable-contract-v2/qualification-result.json
          node simulation/validate-result-v2.mjs quality-reviews/step-2-executable-contract-v2/qualification-result.json --reproduce
          for partition in calibration holdout; do
            output="$RUNNER_TEMP/gameplay-$partition.json"
            node simulation/engine-v2/run-plan.mjs --mode contract-smoke --partition "$partition" --seeds-per-cell 2 --output "$output"
            node simulation/validate-gameplay-result-v2.mjs "$output" --allow-contract-smoke --reproduce
          done
          for suite in gacha-tails pity-conformance duplicate-skew-overflow refund-replay-race state-machine-model large-number-properties; do
            output="$RUNNER_TEMP/high-volume-$suite.json"
            node simulation/engine-v2/high-volume.mjs --mode contract-smoke --suite "$suite" --output "$output"
            node simulation/validate-high-volume-result-v2.mjs "$output" --allow-contract-smoke --reproduce
          done
          if node simulation/engine-v2/run-plan.mjs --mode gameplay --owner STEP3 --partition calibration --output "$RUNNER_TEMP/forbidden-gameplay.json"; then
            echo 'full gameplay executed without CT_STEP3_AUTHORIZED=1' >&2
            exit 1
          fi
          if node simulation/engine-v2/high-volume.mjs --mode full --owner STEP3 --suite gacha-tails --output "$RUNNER_TEMP/forbidden-high-volume.json"; then
            echo 'full high-volume suite executed without CT_STEP3_AUTHORIZED=1' >&2
            exit 1
          fi
      - name: Remove temporary workflows and commit only the validated boundary
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/diagnose-step2-v2-execution-contract.yml
          rm -f .github/workflows/apply-step2-v2-execution-fixes.yml
          git config user.name 'cats-tower-step2-bot'
          git config user.email 'cats-tower-step2-bot@users.noreply.github.com'
          git add simulation/engine-v2/high-volume.mjs quality-reviews/step-2-executable-contract-v2/qualification-result.json .github/workflows/diagnose-step2-v2-execution-contract.yml .github/workflows/apply-step2-v2-execution-fixes.yml
          staged="$(git diff --cached --name-only)"
          printf '%s\n' "$staged"
          test -n "$staged" || { echo 'no execution fixes staged' >&2; exit 1; }
          while IFS= read -r path; do
            case "$path" in
              simulation/engine-v2/high-volume.mjs|quality-reviews/step-2-executable-contract-v2/qualification-result.json|.github/workflows/diagnose-step2-v2-execution-contract.yml|.github/workflows/apply-step2-v2-execution-fixes.yml)
                ;;
              *)
                echo "staged path escaped validated boundary: $path" >&2
                exit 1
                ;;
            esac
          done <<< "$staged"
          git commit -m 'fix: persist validated Step 3 execution contracts'
          git push origin HEAD:kimi
