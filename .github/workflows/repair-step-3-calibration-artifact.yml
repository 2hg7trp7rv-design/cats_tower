name: Repair Step 3 calibration artifact transport

on:
  push:
    branches: [kimi]
    paths:
      - '.github/workflows/repair-step-3-calibration-artifact.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: cats-step3-calibration-transport-${{ github.sha }}
  cancel-in-progress: false

jobs:
  repair-transport:
    name: repair-calibration-artifact-transport
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify repair authority and immutable source metadata
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ENTRY=3eefbf6fa7dfcec8b5b093612e8946b43d838bc2
          SOURCE_RUN=33133249662
          SOURCE_ARTIFACT=9671238966
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse --is-shallow-repository)" = "false"
          test -z "$(git replace -l)"
          git merge-base --is-ancestor "$ENTRY" HEAD
          test "$(git rev-parse HEAD:quality-reviews/step-3-large-scale-validation/acceptance-matrix.json)" = "d1392c431282d0faae9e9ad7f1c22161a3c5caad"
          test "$(git rev-parse HEAD:quality-reviews/step-3-large-scale-validation/acceptance-addendum-calibration-001.json)" = "9d0c89489363340c4954b6912fb105ca6789b462"
          test "$(git rev-parse HEAD:quality-reviews/step-3-large-scale-validation/acceptance-addendum-transport-002.json)" = "a8c853c1fe61e2ff5f5fced6d3776bcc97821d21"
          test "$(git rev-parse HEAD:quality-reviews/step-3-large-scale-validation/audit-calibration.mjs)" = "d0545a851666bc2dbc25f03c82cc02a7ca615cda"
          test "$(git rev-parse HEAD:.github/workflows/verify-step-3-calibration.yml)" = "960af054ca08473d2381e4b26a173d17ddec73c9"
          test "$(git rev-parse HEAD:quality-reviews/step-1-reseal-round-008/seal-round-008.json)" = "0a959de0383b57ad6cd1f33c124b398aa51c1e00"
          test "$(git rev-parse HEAD:simulation/executable-seal-v2.json)" = "ee3507969c03b08fe27350263cf0bc093a1c18e1"
          jq -e '.verdict == "PASS_BYTE_PRESERVING_TRANSPORT_REPAIR_AUTHORIZED" and .sourceCalibration.holdoutExecuted == false' quality-reviews/step-3-large-scale-validation/acceptance-addendum-transport-002.json >/dev/null
          test ! -e quality-reviews/step-3-large-scale-validation/gameplay-holdout-result.json
          mapfile -t CHANGED < <(git diff --name-only "$ENTRY"..HEAD)
          for path in "${CHANGED[@]}"; do
            case "$path" in
              quality-reviews/step-3-large-scale-validation/acceptance-matrix.json|quality-reviews/step-3-large-scale-validation/acceptance-addendum-calibration-001.json|quality-reviews/step-3-large-scale-validation/acceptance-addendum-transport-002.json|quality-reviews/step-3-large-scale-validation/audit-calibration.mjs|.github/workflows/verify-step-3-calibration.yml|.github/workflows/repair-step-3-calibration-artifact.yml) ;;
              *) echo "Forbidden transport-repair path: $path" >&2; exit 1 ;;
            esac
          done
          git diff --check "$ENTRY"..HEAD
          curl -fsSL \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN/artifacts?per_page=100" \
            > "$RUNNER_TEMP/source-artifacts.json"
          jq -e --argjson id "$SOURCE_ARTIFACT" '
            .total_count == 1 and
            (.artifacts | length) == 1 and
            .artifacts[0].id == $id and
            .artifacts[0].name == "cats-tower-step3-calibration-3363c36d91d47b177b1dcf4af053c00b23954d7a-attempt-1" and
            .artifacts[0].size_in_bytes == 897914 and
            .artifacts[0].digest == "sha256:b8dadc084d2aadb9406c06fdaffaf449aad96ea20861f3c47da4fa0ccfc5fb83" and
            .artifacts[0].expired == false and
            .artifacts[0].workflow_run.id == 33133249662 and
            .artifacts[0].workflow_run.head_branch == "kimi" and
            .artifacts[0].workflow_run.head_sha == "3363c36d91d47b177b1dcf4af053c00b23954d7a"
          ' "$RUNNER_TEMP/source-artifacts.json" >/dev/null

      - name: Download exact calibration source artifact
        uses: actions/download-artifact@v4
        with:
          name: cats-tower-step3-calibration-3363c36d91d47b177b1dcf4af053c00b23954d7a-attempt-1
          path: ${{ runner.temp }}/cats-step3-calibration-repaired
          github-token: ${{ github.token }}
          run-id: 33133249662

      - name: Verify source bytes and semantic verdicts
        run: |
          set -euo pipefail
          DIR="$RUNNER_TEMP/cats-step3-calibration-repaired"
          RESULT="$DIR/gameplay-calibration-result.json"
          AUDIT="$DIR/calibration-audit.json"
          MANIFEST="$DIR/execution-manifest.json"
          test -f "$RESULT" && test ! -L "$RESULT"
          test -f "$AUDIT" && test ! -L "$AUDIT"
          test -f "$MANIFEST" && test ! -L "$MANIFEST"
          test "$(wc -c < "$RESULT" | tr -d ' ')" = "1913915"
          test "$(sha256sum "$RESULT" | cut -d' ' -f1)" = "f77eb5fdb805ea484a02b165105c585d07e77d3097fcbf42637f7a96618d90bb"
          test "$(wc -c < "$AUDIT" | tr -d ' ')" = "43002"
          test "$(sha256sum "$AUDIT" | cut -d' ' -f1)" = "4b0f0004625ea923199f32b28606a4599da08f3ef3116c1e3a6460f0730da7c7"
          test "$(wc -c < "$MANIFEST" | tr -d ' ')" = "1590"
          test "$(sha256sum "$MANIFEST" | cut -d' ' -f1)" = "f270136f0021c772d94e415a8c6e72f119b17964067ac59ff87d246f39d33d8c"
          node simulation/validate-gameplay-result-v2.mjs "$RESULT" --reproduce
          jq -e '.hashes.deterministicPayloadSha256 == "df7cbceb0569f40eefee43dbd81d0b2c4698a44104f88a312ce693471f746e22" and .deterministicPayload.scenarioCount == "12000" and .verdict.contractValidation == "PASS" and .verdict.partitionComplete == true' "$RESULT" >/dev/null
          jq -e '.verdict == "PASS_CALIBRATION_GATE_CANDIDATE" and .replay.scenarioCount == "12000" and .unresolvedP0 == 0 and .unresolvedP1 == 0 and .holdoutExecuted == false' "$AUDIT" >/dev/null
          jq -e '.schemaVersion == 2 and .head == "3363c36d91d47b177b1dcf4af053c00b23954d7a" and .tree == "a60ce0417851573a4c3895b30872fd3d0860a328" and .runId == "33133249662" and .result.sha256 == "f77eb5fdb805ea484a02b165105c585d07e77d3097fcbf42637f7a96618d90bb" and .audit.sha256 == "4b0f0004625ea923199f32b28606a4599da08f3ef3116c1e3a6460f0730da7c7" and .holdoutExecuted == false and .verdict == "PASS_CALIBRATION_EXECUTION_ARTIFACT_READY"' "$MANIFEST" >/dev/null

      - name: Create byte-preserving portable wrapper
        run: |
          set -euo pipefail
          DIR="$RUNNER_TEMP/cats-step3-calibration-repaired"
          rm -f "$DIR/SHA256SUMS"
          jq -n \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg branch "kimi" \
            --arg repairHead "$(git rev-parse HEAD)" \
            --arg repairTree "$(git rev-parse HEAD^{tree})" \
            --arg workflow "$GITHUB_WORKFLOW" \
            --arg runId "$GITHUB_RUN_ID" \
            --arg runAttempt "$GITHUB_RUN_ATTEMPT" \
            --arg job "$GITHUB_JOB" \
            --arg transportAddendumBlob "a8c853c1fe61e2ff5f5fced6d3776bcc97821d21" \
            --arg sourceRunId "33133249662" \
            --arg sourceJobId "98727326189" \
            --arg sourceHead "3363c36d91d47b177b1dcf4af053c00b23954d7a" \
            --arg sourceTree "a60ce0417851573a4c3895b30872fd3d0860a328" \
            --arg sourceArtifactId "9671238966" \
            --arg sourceArtifactDigest "sha256:b8dadc084d2aadb9406c06fdaffaf449aad96ea20861f3c47da4fa0ccfc5fb83" \
            '{
              schemaVersion: 1,
              artifactId: "cats-tower-step3-calibration-transport-repair-manifest",
              repository: $repository,
              branch: $branch,
              repairInvocation: {
                head: $repairHead,
                tree: $repairTree,
                workflow: $workflow,
                runId: $runId,
                runAttempt: $runAttempt,
                job: $job,
                transportAddendumBlob: $transportAddendumBlob
              },
              source: {
                runId: $sourceRunId,
                jobId: $sourceJobId,
                head: $sourceHead,
                tree: $sourceTree,
                artifactId: $sourceArtifactId,
                artifactDigest: $sourceArtifactDigest
              },
              preservedFiles: {
                "gameplay-calibration-result.json": {bytes: "1913915", sha256: "f77eb5fdb805ea484a02b165105c585d07e77d3097fcbf42637f7a96618d90bb"},
                "calibration-audit.json": {bytes: "43002", sha256: "4b0f0004625ea923199f32b28606a4599da08f3ef3116c1e3a6460f0730da7c7"},
                "execution-manifest.json": {bytes: "1590", sha256: "f270136f0021c772d94e415a8c6e72f119b17964067ac59ff87d246f39d33d8c"}
              },
              checksumPaths: "RELATIVE_ARTIFACT_MEMBERS",
              sourceFilesModified: false,
              holdoutExecuted: false,
              verdict: "PASS_CALIBRATION_TRANSPORT_REPAIRED"
            }' > "$DIR/transport-repair-manifest.json"
          test -s "$DIR/transport-repair-manifest.json"
          (
            cd "$DIR"
            sha256sum execution-manifest.json gameplay-calibration-result.json calibration-audit.json transport-repair-manifest.json > SHA256SUMS
            sha256sum -c SHA256SUMS
          )
          ! grep -q '/home/runner/' "$DIR/SHA256SUMS"
          test "$(sha256sum "$DIR/gameplay-calibration-result.json" | cut -d' ' -f1)" = "f77eb5fdb805ea484a02b165105c585d07e77d3097fcbf42637f7a96618d90bb"
          test "$(sha256sum "$DIR/calibration-audit.json" | cut -d' ' -f1)" = "4b0f0004625ea923199f32b28606a4599da08f3ef3116c1e3a6460f0730da7c7"
          test "$(sha256sum "$DIR/execution-manifest.json" | cut -d' ' -f1)" = "f270136f0021c772d94e415a8c6e72f119b17964067ac59ff87d246f39d33d8c"

      - name: Upload portable calibration evidence
        uses: actions/upload-artifact@v4
        with:
          name: cats-tower-step3-calibration-transport-repaired-${{ github.sha }}-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/cats-step3-calibration-repaired
          if-no-files-found: error
          retention-days: 30
          compression-level: 6
