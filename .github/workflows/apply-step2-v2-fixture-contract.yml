name: Apply validated Step 2 V2 fixture contract

on:
  push:
    branches: [kimi]
    paths:
      - '.github/workflows/apply-step2-v2-fixture-contract.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-step2-v2-fixture-contract-kimi
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Persist the no-write-validated harness correction
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('simulation/fixtures/v2/validate-execution-fixtures.mjs')
          text = path.read_text(encoding='utf-8')
          old = "const run = runNode([...validatorArgs, path]);"
          new = "const run = runNode([validatorArgs[0], path, ...validatorArgs.slice(1)]);"
          if old not in text:
              raise SystemExit('expected fixture harness line not found')
          path.write_text(text.replace(old, new), encoding='utf-8')
          PY
      - name: Bind the new fixture into the manifest
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import datetime
          import hashlib
          import json
          from pathlib import Path

          manifest_path = Path('simulation/fixtures/v2/manifest.json')
          manifest = json.loads(manifest_path.read_text(encoding='utf-8'))
          fixture_path = Path('simulation/fixtures/v2/execution-contract-negative.json')
          data = fixture_path.read_bytes()
          entry = {
              'path': fixture_path.as_posix(),
              'bytes': str(len(data)),
              'sha256': hashlib.sha256(data).hexdigest(),
          }
          files = [item for item in manifest['files'] if item['path'] != entry['path']]
          files.append(entry)
          files.sort(key=lambda item: item['path'])
          manifest['schemaVersion'] = '2.1.0'
          manifest['fixtureSetId'] = 'cats-tower-v2-fixtures'
          manifest['generatedAt'] = datetime.datetime.now(datetime.timezone.utc).isoformat().replace('+00:00', 'Z')
          manifest['files'] = files
          manifest['expectedCounts']['executionContractNegative'] = '14'
          manifest['expectedCounts']['gameplayResultNegative'] = '10'
          manifest['expectedCounts']['highVolumeResultNegative'] = '10'
          manifest['expectedCounts']['modelBinding'] = '7'
          manifest['negativeCoverage']['executionContractNegativeCases'] = '14'
          manifest['negativeCoverage']['gameplayResultNegativeCases'] = '10'
          manifest['negativeCoverage']['highVolumeResultNegativeCases'] = '10'
          manifest['negativeCoverage']['modelBindingCases'] = '7'
          manifest_path.write_text(json.dumps(manifest, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          print(json.dumps(entry))
          PY
      - name: Re-run all fixture validators
        shell: bash
        run: |
          set -euo pipefail
          find simulation -name '*.mjs' -print0 | xargs -0 -n1 node --check
          node simulation/fixtures/v2/validate-fixtures.mjs
          node simulation/fixtures/v2/validate-execution-fixtures.mjs
      - name: Remove temporary fixture workflows and commit the validated boundary
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/diagnose-step2-v2-fixtures.yml
          rm -f .github/workflows/apply-step2-v2-fixture-contract.yml
          git config user.name 'cats-tower-step2-bot'
          git config user.email 'cats-tower-step2-bot@users.noreply.github.com'
          git add simulation/fixtures/v2/manifest.json simulation/fixtures/v2/execution-contract-negative.json simulation/fixtures/v2/validate-execution-fixtures.mjs .github/workflows/diagnose-step2-v2-fixtures.yml .github/workflows/apply-step2-v2-fixture-contract.yml
          staged="$(git diff --cached --name-only)"
          printf '%s\n' "$staged"
          test -n "$staged" || { echo 'no fixture-contract changes staged' >&2; exit 1; }
          while IFS= read -r path; do
            case "$path" in
              simulation/fixtures/v2/manifest.json|simulation/fixtures/v2/execution-contract-negative.json|simulation/fixtures/v2/validate-execution-fixtures.mjs|.github/workflows/diagnose-step2-v2-fixtures.yml|.github/workflows/apply-step2-v2-fixture-contract.yml)
                ;;
              *)
                echo "staged path escaped fixture boundary: $path" >&2
                exit 1
                ;;
            esac
          done <<< "$staged"
          git commit -m 'test: seal Step 3 execution adversarial fixtures'
          git push origin HEAD:kimi
