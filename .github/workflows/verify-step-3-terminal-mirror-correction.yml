name: Verify Step 3 terminal mirror correction

on:
  push:
    branches: [kimi]
    paths:
      - '.github/workflows/verify-step-3-terminal-mirror-correction.yml'
      - 'quality-reviews/step-3-large-scale-validation/tools/correct-terminal-mirrors.mjs'
      - 'quality-reviews/step-3-large-scale-validation/terminal-mirror-correction.json'
      - 'quality-reviews/step-1-canonical-design/active-change-control.json'
      - 'quality-reviews/step-1-canonical-design/active-change-control-addendum-round-016.json'
      - 'AI_PROJECT_POLICY.json'
      - 'PROJECT_STATUS.json'
      - 'simulation/CURRENT_STATUS.json'
      - 'QUALITY_GATE.md'
      - '.github/workflows/CURRENT_STATUS.md'
      - 'AGENTS.md'
      - 'PROJECT_HANDOVER.md'
      - 'README.md'
      - 'CHATGPT_PROJECT_BOOTSTRAP.md'
      - 'CUSTOM_GPT_CONFIGURATION.md'
      - 'simulation/INPUT_CONTRACT.md'
      - 'tests/governance/verify-current-step2-state.mjs'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: cats-step3-terminal-mirror-correction
  cancel-in-progress: false

jobs:
  verify-terminal-mirrors:
    name: verify-terminal-mirrors
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TOOL: quality-reviews/step-3-large-scale-validation/tools/correct-terminal-mirrors.mjs
      CORRECTION: quality-reviews/step-3-large-scale-validation/terminal-mirror-correction.json
      ENTRY: 3eefbf6fa7dfcec8b5b093612e8946b43d838bc2
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify exact source and determine mode
        id: phase
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = '2hg7trp7rv-design/cats_tower'
          test "$GITHUB_REF_NAME" = 'kimi'
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse --is-shallow-repository)" = 'false'
          test -z "$(git replace -l)"
          git merge-base --is-ancestor "$ENTRY" HEAD
          node --check "$TOOL"
          node --check tests/governance/verify-current-step2-state.mjs
          node tests/governance/verify-current-step2-state.mjs
          if [ -f "$CORRECTION" ]; then
            MODE=verify
          else
            MODE=prepare
          fi
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"
          echo "Detected mode: $MODE"

      - name: Configure exact kimi writer
        if: steps.phase.outputs.mode == 'prepare'
        run: |
          set -euo pipefail
          test "$(git rev-parse origin/kimi)" = "$GITHUB_SHA"
          git checkout -B kimi "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          test "$(git branch --show-current)" = 'kimi'

      - name: Generate correction evidence and synchronized mirrors
        if: steps.phase.outputs.mode == 'prepare'
        run: |
          set -euo pipefail
          node "$TOOL" prepare | tee "$RUNNER_TEMP/correction-result.json"
          jq -e '.verdict == "PASS_STEP3_POST_TERMINAL_MIRROR_CORRECTION" and .mirrorCount == 13' "$RUNNER_TEMP/correction-result.json" >/dev/null
          git diff --check
          { git diff --name-only; git ls-files --others --exclude-standard; } | sort -u > "$RUNNER_TEMP/changed-paths.txt"
          cat > "$RUNNER_TEMP/expected-paths.txt" <<'EOF'
          .github/workflows/CURRENT_STATUS.md
          AGENTS.md
          AI_PROJECT_POLICY.json
          CHATGPT_PROJECT_BOOTSTRAP.md
          CUSTOM_GPT_CONFIGURATION.md
          PROJECT_HANDOVER.md
          PROJECT_STATUS.json
          QUALITY_GATE.md
          README.md
          quality-reviews/step-1-canonical-design/active-change-control-addendum-round-016.json
          quality-reviews/step-1-canonical-design/active-change-control.json
          quality-reviews/step-3-large-scale-validation/terminal-mirror-correction.json
          simulation/CURRENT_STATUS.json
          simulation/INPUT_CONTRACT.md
          EOF
          sort -o "$RUNNER_TEMP/expected-paths.txt" "$RUNNER_TEMP/expected-paths.txt"
          diff -u "$RUNNER_TEMP/expected-paths.txt" "$RUNNER_TEMP/changed-paths.txt"

      - name: Commit exact mirror correction and verify committed blobs
        if: steps.phase.outputs.mode == 'prepare'
        run: |
          set -euo pipefail
          git add \
            .github/workflows/CURRENT_STATUS.md \
            AGENTS.md \
            AI_PROJECT_POLICY.json \
            CHATGPT_PROJECT_BOOTSTRAP.md \
            CUSTOM_GPT_CONFIGURATION.md \
            PROJECT_HANDOVER.md \
            PROJECT_STATUS.json \
            QUALITY_GATE.md \
            README.md \
            quality-reviews/step-1-canonical-design/active-change-control-addendum-round-016.json \
            quality-reviews/step-1-canonical-design/active-change-control.json \
            quality-reviews/step-3-large-scale-validation/terminal-mirror-correction.json \
            simulation/CURRENT_STATUS.json \
            simulation/INPUT_CONTRACT.md
          git commit -m 'step3: correct post-terminal current-state mirrors'
          echo "LOCAL_CORRECTION_COMMIT=$(git rev-parse HEAD)"
          echo "LOCAL_CORRECTION_TREE=$(git rev-parse HEAD^{tree})"
          node "$TOOL" verify
          node tests/governance/verify-current-step2-state.mjs
          git diff --check "$ENTRY..HEAD"
          test -z "$(git status --porcelain --untracked-files=all)"
          git push origin HEAD:kimi

      - name: Verify committed correction at exact live HEAD
        if: steps.phase.outputs.mode == 'verify'
        run: |
          set -euo pipefail
          node "$TOOL" verify
          node tests/governance/verify-current-step2-state.mjs
          git diff --check "$ENTRY..HEAD"
          test -z "$(git status --porcelain --untracked-files=all)"
