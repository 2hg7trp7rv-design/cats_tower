name: Repair Step 3 finalization bootstrap

on:
  push:
    branches: [kimi]
    paths:
      - '.github/workflows/repair-step-3-finalization-bootstrap.yml'

permissions:
  contents: write

concurrency:
  group: cats-step3-finalization-bootstrap
  cancel-in-progress: false

jobs:
  apply-repair:
    name: patch-step3-markdown-normalization
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Patch finalizer and remove transport chunks
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = '2hg7trp7rv-design/cats_tower'
          test "$GITHUB_REF_NAME" = 'kimi'
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse --is-shallow-repository)" = 'false'
          test -z "$(git replace -l)"
          git checkout -B kimi "$GITHUB_SHA"
          python - <<'PY'
          from pathlib import Path
          path = Path('quality-reviews/step-3-large-scale-validation/tools/finalize-step3.mjs')
          text = path.read_text()
          old = "  writeText(relativePath, `${statusBlock(status, step4Status, balanceVerdict)}\\n\\n${content.trimStart()}`);"
          new = "  writeText(relativePath, `${statusBlock(status, step4Status, balanceVerdict)}\\n\\n${content.trimStart()}`.replace(/[ \\t]+$/gm, ''));"
          if text.count(old) != 1:
              raise SystemExit(f'expected exactly one markdown writer, found {text.count(old)}')
          path.write_text(text.replace(old, new))
          PY
          node --check quality-reviews/step-3-large-scale-validation/tools/finalize-step3.mjs
          git rm -r .github/step3-repair
          git diff --check
          git add quality-reviews/step-3-large-scale-validation/tools/finalize-step3.mjs
          git diff --cached --name-only | sort > "$RUNNER_TEMP/staged-paths.txt"
          cat > "$RUNNER_TEMP/expected-paths.txt" <<'EOF'
          .github/step3-repair/segment00
          .github/step3-repair/segment01
          .github/step3-repair/segment02
          .github/step3-repair/segment03
          .github/step3-repair/segment04
          .github/step3-repair/segment05
          quality-reviews/step-3-large-scale-validation/tools/finalize-step3.mjs
          EOF
          sort -o "$RUNNER_TEMP/expected-paths.txt" "$RUNNER_TEMP/expected-paths.txt"
          diff -u "$RUNNER_TEMP/expected-paths.txt" "$RUNNER_TEMP/staged-paths.txt"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'step3: normalize generated markdown evidence'
          git push origin HEAD:kimi
          test -z "$(git status --porcelain --untracked-files=all)"
