name: Repair Step 4 verifier workflow allowlist

on:
  push:
    branches: [kimi]
    paths:
      - '.github/workflows/repair-step-4-verifier-allowlist.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cats-tower-step4-mockup-draft
  cancel-in-progress: false

jobs:
  repair-step4-verifier-allowlist:
    name: repair-step4-verifier-allowlist
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      VERIFIER: tests/step4/verify-step4-mockups.mjs
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify exact source
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = '2hg7trp7rv-design/cats_tower'
          test "$GITHUB_REF_NAME" = 'kimi'
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse origin/kimi)" = "$GITHUB_SHA"
          test "$(git rev-parse --is-shallow-repository)" = 'false'
          test -z "$(git replace -l)"
          node --check "$VERIFIER"

      - name: Patch only the explicit Step 4 workflow allowlist
        run: |
          set -euo pipefail
          git checkout -B kimi "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          node <<'NODE'
          const fs = require('node:fs');
          const file = 'tests/step4/verify-step4-mockups.mjs';
          const oldText = "relativePath === '.github/workflows/execute-step-4-twelve-screen-mockups.yml'";
          const newText = "['.github/workflows/execute-step-4-twelve-screen-mockups.yml', '.github/workflows/execute-step-4-twelve-screen-mockups-v3.yml', '.github/workflows/repair-step-4-verifier-allowlist.yml'].includes(relativePath)";
          let source = fs.readFileSync(file, 'utf8');
          if (source.includes(oldText)) {
            source = source.replace(oldText, newText);
            fs.writeFileSync(file, source);
          } else if (!source.includes(newText)) {
            throw new Error('STEP4_VERIFIER_ALLOWLIST_ANCHOR_NOT_FOUND');
          }
          NODE
          node --check "$VERIFIER"
          git diff --check
          if git diff --quiet -- "$VERIFIER"; then
            echo 'Verifier allowlist already repaired.'
            exit 0
          fi
          test "$(git diff --name-only)" = "$VERIFIER"
          git add "$VERIFIER"
          git commit -m 'step4: allow explicit mockup workflow evidence paths'
          test -z "$(git status --porcelain --untracked-files=all)"
          git push origin HEAD:kimi
