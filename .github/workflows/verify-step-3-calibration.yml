name: Execute Step 3 calibration

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cats-step3-calibration-${{ github.sha }}
  cancel-in-progress: false

jobs:
  calibration:
    name: step3-calibration-12000
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify sealed inputs and Step 3 authorization
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse --is-shallow-repository)" = "false"
          test -z "$(git replace -l)"
          test "$(git rev-parse HEAD:quality-reviews/step-3-large-scale-validation/acceptance-matrix.json)" = "d1392c431282d0faae9e9ad7f1c22161a3c5caad"
          test "$(git rev-parse HEAD:quality-reviews/step-3-large-scale-validation/acceptance-addendum-calibration-001.json)" = "9d0c89489363340c4954b6912fb105ca6789b462"
          test "$(git rev-parse HEAD:quality-reviews/step-3-large-scale-validation/audit-calibration.mjs)" = "d0545a851666bc2dbc25f03c82cc02a7ca615cda"
          test "$(git rev-parse HEAD:quality-reviews/step-1-reseal-round-008/seal-round-008.json)" = "0a959de0383b57ad6cd1f33c124b398aa51c1e00"
          test "$(git rev-parse HEAD:simulation/executable-seal-v2.json)" = "ee3507969c03b08fe27350263cf0bc093a1c18e1"
          test "$(git rev-parse HEAD:simulation/run-plan-v2.json)" = "a04632e41d78dd15b36e95cd6998e8a8648b9a6c"
          test "$(git rev-parse HEAD:simulation/execution-contract-v2.json)" = "82685b646358129d7e66a810b267777d6bf5af92"
          jq -e '.governanceDecision.step3 == "READY_TO_START" and .governanceDecision.step3Executed == false and .governanceDecision.unresolvedP0 == 0 and .governanceDecision.unresolvedP1 == 0' quality-reviews/step-2-governance-repair-round-001/live-readback.json >/dev/null
          test ! -e quality-reviews/step-3-large-scale-validation/gameplay-holdout-result.json
          node --check quality-reviews/step-3-large-scale-validation/audit-calibration.mjs
          git diff --check

      - name: Re-run sealed Step 2 regression
        run: node simulation/verify-step2-v2.mjs

      - name: Execute 12,000 calibration scenarios
        env:
          CT_STEP3_AUTHORIZED: '1'
        run: |
          set -euo pipefail
          DIR="$RUNNER_TEMP/cats-step3-calibration"
          mkdir -p "$DIR"
          node simulation/engine-v2/run-plan.mjs \
            --mode gameplay \
            --owner STEP3 \
            --partition calibration \
            --output "$DIR/gameplay-calibration-result.json"

      - name: Validate, reproduce and replay-audit calibration
        run: |
          set -euo pipefail
          DIR="$RUNNER_TEMP/cats-step3-calibration"
          RESULT="$DIR/gameplay-calibration-result.json"
          node simulation/validate-gameplay-result-v2.mjs "$RESULT" --reproduce
          jq -e '
            .deterministicPayload.mode == "STEP3_GAMEPLAY_PARTITION" and
            .deterministicPayload.partition == "calibration" and
            .deterministicPayload.scenarioCount == "12000" and
            .deterministicPayload.expectedScenarioCount == "12000" and
            .deterministicPayload.complete == true and
            (.deterministicPayload.cells | length) == 15 and
            .hashes.deterministicPayloadSha256 == "df7cbceb0569f40eefee43dbd81d0b2c4698a44104f88a312ce693471f746e22" and
            .evidence.canonicalJsonSha256 == "df7cbceb0569f40eefee43dbd81d0b2c4698a44104f88a312ce693471f746e22" and
            .verdict.contractValidation == "PASS" and
            .verdict.partitionComplete == true and
            .verdict.partialResultPromotion == false
          ' "$RESULT" >/dev/null
          node quality-reviews/step-3-large-scale-validation/audit-calibration.mjs \
            --result "$RESULT" \
            --output "$DIR/calibration-audit.json"
          jq -e '.verdict == "PASS_CALIBRATION_GATE_CANDIDATE" and .replay.scenarioCount == "12000" and .unresolvedP0 == 0 and .unresolvedP1 == 0 and .holdoutExecuted == false' "$DIR/calibration-audit.json" >/dev/null

      - name: Create portable execution evidence
        run: |
          set -euo pipefail
          DIR="$RUNNER_TEMP/cats-step3-calibration"
          RESULT="$DIR/gameplay-calibration-result.json"
          AUDIT="$DIR/calibration-audit.json"
          RESULT_SHA256=$(sha256sum "$RESULT" | cut -d' ' -f1)
          RESULT_BYTES=$(wc -c < "$RESULT" | tr -d ' ')
          AUDIT_SHA256=$(sha256sum "$AUDIT" | cut -d' ' -f1)
          AUDIT_BYTES=$(wc -c < "$AUDIT" | tr -d ' ')
          jq -n \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg branch "kimi" \
            --arg head "$(git rev-parse HEAD)" \
            --arg tree "$(git rev-parse HEAD^{tree})" \
            --arg workflow "$GITHUB_WORKFLOW" \
            --arg runId "$GITHUB_RUN_ID" \
            --arg runAttempt "$GITHUB_RUN_ATTEMPT" \
            --arg job "$GITHUB_JOB" \
            --arg runtime "$(node --version)" \
            --arg acceptanceBlob "d1392c431282d0faae9e9ad7f1c22161a3c5caad" \
            --arg addendumBlob "9d0c89489363340c4954b6912fb105ca6789b462" \
            --arg auditScriptBlob "d0545a851666bc2dbc25f03c82cc02a7ca615cda" \
            --arg step1SealBlob "0a959de0383b57ad6cd1f33c124b398aa51c1e00" \
            --arg step2SealBlob "ee3507969c03b08fe27350263cf0bc093a1c18e1" \
            --arg runPlanBlob "a04632e41d78dd15b36e95cd6998e8a8648b9a6c" \
            --arg executionContractBlob "82685b646358129d7e66a810b267777d6bf5af92" \
            --arg resultSha256 "$RESULT_SHA256" \
            --arg resultBytes "$RESULT_BYTES" \
            --arg deterministicPayloadSha256 "$(jq -r '.hashes.deterministicPayloadSha256' "$RESULT")" \
            --arg canonicalJsonSha256 "$(jq -r '.evidence.canonicalJsonSha256' "$RESULT")" \
            --arg auditSha256 "$AUDIT_SHA256" \
            --arg auditBytes "$AUDIT_BYTES" \
            '{
              schemaVersion: 3,
              artifactId: "cats-tower-step3-calibration-execution-manifest",
              repository: $repository,
              branch: $branch,
              head: $head,
              tree: $tree,
              workflow: $workflow,
              runId: $runId,
              runAttempt: $runAttempt,
              job: $job,
              runtimeVersion: $runtime,
              inputs: {
                acceptanceBlob: $acceptanceBlob,
                addendumBlob: $addendumBlob,
                auditScriptBlob: $auditScriptBlob,
                step1SealBlob: $step1SealBlob,
                step2SealBlob: $step2SealBlob,
                runPlanBlob: $runPlanBlob,
                executionContractBlob: $executionContractBlob
              },
              result: {
                path: "gameplay-calibration-result.json",
                scenarioCount: "12000",
                sha256: $resultSha256,
                bytes: $resultBytes,
                deterministicPayloadSha256: $deterministicPayloadSha256,
                canonicalJsonSha256: $canonicalJsonSha256
              },
              audit: {
                path: "calibration-audit.json",
                sha256: $auditSha256,
                bytes: $auditBytes,
                verdict: "PASS_CALIBRATION_GATE_CANDIDATE"
              },
              checksumPaths: "RELATIVE_ARTIFACT_MEMBERS",
              holdoutExecuted: false,
              verdict: "PASS_CALIBRATION_EXECUTION_ARTIFACT_READY"
            }' > "$DIR/execution-manifest.json"
          test -s "$DIR/execution-manifest.json"
          (
            cd "$DIR"
            sha256sum execution-manifest.json gameplay-calibration-result.json calibration-audit.json > SHA256SUMS
            sha256sum -c SHA256SUMS
          )

      - name: Upload Step 3 calibration evidence
        uses: actions/upload-artifact@v4
        with:
          name: cats-tower-step3-calibration-${{ github.sha }}-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/cats-step3-calibration
          if-no-files-found: error
          retention-days: 30
          compression-level: 6
