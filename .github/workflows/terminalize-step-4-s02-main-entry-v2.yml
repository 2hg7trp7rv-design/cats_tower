name: Terminalize Step 4 S02 main entry v2

on:
  workflow_dispatch:
  push:
    branches:
      - kimi
    paths:
      - ".github/workflows/terminalize-step-4-s02-main-entry-v2.yml"

permissions:
  contents: write

concurrency:
  group: terminalize-step4-s02-main-entry-v2-kimi
  cancel-in-progress: false

jobs:
  terminalize:
    name: Re-render latest kimi and bind terminal readback v2
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout latest existing kimi
        uses: actions/checkout@v4
        with:
          ref: kimi
          fetch-depth: 0

      - name: Assert repository, branch and integration evidence
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REPOSITORY}" = "2hg7trp7rv-design/cats_tower"
          test "$(git branch --show-current)" = "kimi"
          git pull --ff-only origin kimi
          test -f quality-reviews/step-4-twelve-screen-final-mockups/s02-main-entry-integration-evidence.json
          grep -q 'PASS_S02_MAIN_ENTRY_TECHNICAL_PENDING_USER_VISUAL_APPROVAL' \
            quality-reviews/step-4-twelve-screen-final-mockups/s02-main-entry-integration-evidence.json
          test "$(git hash-object legacy.html)" = "c5871ded0f7fbb501dce08e2b0da767841ce789b"
          grep -q '/step4/s02/root-entry.js' index.html
          echo "terminal_entry_head=$(git rev-parse HEAD)"
          echo "terminal_entry_tree=$(git rev-parse HEAD^{tree})"

      - name: Run fail-closed root integration contract
        shell: bash
        run: |
          set -euo pipefail
          node tests/step4/s02-static-contract-v3.mjs | tee /tmp/s02-terminal-static-report.json

      - name: Install pinned Playwright and Chromium
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/s02-playwright
          cd /tmp/s02-playwright
          npm init -y >/dev/null 2>&1
          npm install --save-exact playwright@1.62.1
          npx playwright install --with-deps chromium

      - name: Start exact latest-head static server
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/s02-terminal-v2-http.log 2>&1 &
          echo $! > /tmp/s02-terminal-v2-http.pid
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:4173/ >/dev/null \
              && curl --fail --silent http://127.0.0.1:4173/step4/s02/ >/dev/null \
              && curl --fail --silent http://127.0.0.1:4173/legacy.html >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/s02-terminal-v2-http.log
          exit 1

      - name: Re-run source route browser QA
        shell: bash
        env:
          PLAYWRIGHT_PACKAGE: /tmp/s02-playwright/node_modules/playwright
          S02_BASE_URL: http://127.0.0.1:4173/step4/s02/
          S02_EVIDENCE_DIR: quality-reviews/step-4-twelve-screen-final-mockups/s02-browser-evidence
        run: |
          set -euo pipefail
          node tests/step4/s02-browser-qa.mjs

      - name: Re-run actual root browser QA
        shell: bash
        env:
          PLAYWRIGHT_PACKAGE: /tmp/s02-playwright/node_modules/playwright
          S02_ORIGIN: http://127.0.0.1:4173
          S02_MAIN_ENTRY_EVIDENCE_DIR: quality-reviews/step-4-twelve-screen-final-mockups/s02-main-entry-evidence
        run: |
          set -euo pipefail
          node tests/step4/s02-main-entry-browser.mjs

      - name: Write terminal readback
        shell: bash
        run: |
          set -euo pipefail
          node tests/step4/write-s02-main-entry-terminal-readback.mjs | tee /tmp/s02-terminal-readback-v2-report.json
          git diff --check
          grep -q 'PASS_S02_MAIN_ENTRY_TERMINAL_TECHNICAL_PENDING_USER_VISUAL_APPROVAL' \
            quality-reviews/step-4-twelve-screen-final-mockups/s02-main-entry-terminal-readback.json

      - name: Commit terminal readback to existing kimi
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            quality-reviews/step-4-twelve-screen-final-mockups/s02-browser-evidence \
            quality-reviews/step-4-twelve-screen-final-mockups/s02-main-entry-evidence \
            quality-reviews/step-4-twelve-screen-final-mockups/s02-main-entry-terminal-readback.json \
            PROJECT_STATUS.json
          if git diff --cached --quiet; then
            echo "Terminal readback is already current."
            exit 0
          fi
          git commit -m "step4: add terminal S02 main-entry readback v2"
          git push origin HEAD:kimi

      - name: Upload terminal evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: step4-s02-main-entry-terminal-v2-${{ github.sha }}
          if-no-files-found: error
          retention-days: 30
          path: |
            /tmp/s02-terminal-static-report.json
            /tmp/s02-terminal-readback-v2-report.json
            quality-reviews/step-4-twelve-screen-final-mockups/s02-browser-evidence/**
            quality-reviews/step-4-twelve-screen-final-mockups/s02-main-entry-evidence/**
            quality-reviews/step-4-twelve-screen-final-mockups/s02-main-entry-terminal-readback.json
            /tmp/s02-terminal-v2-http.log
