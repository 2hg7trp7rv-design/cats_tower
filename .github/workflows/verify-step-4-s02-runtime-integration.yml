name: Apply Step 4 recovery allow-list correction

on:
  workflow_dispatch:
  push:
    branches:
      - kimi
    paths:
      - ".github/workflows/verify-step-4-s02-runtime-integration.yml"

permissions:
  contents: write

concurrency:
  group: apply-step4-recovery-allowlist-kimi
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: kimi
          fetch-depth: 0

      - name: Assert recovery authority
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REPOSITORY}" = "2hg7trp7rv-design/cats_tower"
          test "$(git branch --show-current)" = "kimi"
          git pull --ff-only origin kimi
          grep -q 'IN_PROGRESS_STEP4_S02_GOVERNANCE_VERIFIER_AND_MIRROR_SYNC' \
            quality-reviews/step-1-canonical-design/active-change-control-addendum-round-024.json

      - name: Apply exact allow-list additions
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          file = Path('tests/step4/verify-s02-runtime-integration.mjs')
          text = file.read_text(encoding='utf-8')
          replacements = [
              (
                  "  'tests/step4/s02-runtime-browser-qa.mjs',\n  'quality-reviews/step-1-canonical-design/active-change-control-addendum-round-023.json',\n  'quality-reviews/step-4-twelve-screen-final-mockups/s02-main-entry-governance-recovery-acceptance.json'",
                  "  'tests/step4/s02-runtime-browser-qa.mjs',\n  'tests/governance/verify-current-step2-state.mjs',\n  'quality-reviews/step-1-canonical-design/active-change-control-addendum-round-023.json',\n  'quality-reviews/step-1-canonical-design/active-change-control-addendum-round-024.json',\n  'quality-reviews/step-4-twelve-screen-final-mockups/s02-main-entry-governance-recovery-acceptance.json',\n  'quality-reviews/step-4-twelve-screen-final-mockups/s02-main-entry-governance-recovery-critic-summary.json',\n  'quality-reviews/step-4-twelve-screen-final-mockups/s02-main-entry-governance-recovery-final-judge.json',\n  'quality-reviews/step-4-twelve-screen-final-mockups/s02-main-entry-governance-recovery-completion-evidence.json'"
              ),
              (
                  "  /^tests\\/step4\\/s02-runtime-browser-qa\\.mjs$/,\n  /^\\.github\\/workflows\\/verify-step-4-s02-runtime-integration\\.yml$/",
                  "  /^tests\\/step4\\/s02-runtime-browser-qa\\.mjs$/,\n  /^tests\\/governance\\/verify-current-step2-state\\.mjs$/,\n  /^\\.github\\/workflows\\/verify-step-4-s02-runtime-integration\\.yml$/"
              ),
              (
                  "  /^\\.github\\/workflows\\/verify-step-4-s02-terminal-readback-v2\\.yml$/",
                  "  /^\\.github\\/workflows\\/terminalize-step-4-s02-main-entry-v2\\.yml$/"
              ),
              (
                  "  /^quality-reviews\\/step-1-canonical-design\\/active-change-control-addendum-round-023\\.json$/",
                  "  /^quality-reviews\\/step-1-canonical-design\\/active-change-control-addendum-round-02[34]\\.json$/"
              ),
          ]
          for old, new in replacements:
              if old in text:
                  if text.count(old) != 1:
                      raise SystemExit(f'non-unique source block: {old[:80]}')
                  text = text.replace(old, new)
              elif new not in text:
                  raise SystemExit(f'expected source block not found: {old[:80]}')
          file.write_text(text, encoding='utf-8')
          PY
          node --check tests/step4/verify-s02-runtime-integration.mjs
          git diff --check

      - name: Assert one-file write boundary
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t changed < <(git diff --name-only)
          printf '%s\n' "${changed[@]}"
          test "${#changed[@]}" -le 1
          for file in "${changed[@]}"; do
            test "$file" = 'tests/step4/verify-s02-runtime-integration.mjs'
          done
          test "$(git hash-object runtime/s02-runtime.js)" = 'fb03de942075ec05bcab476234205288688d639d'
          test "$(git hash-object runtime/s02-battle-renderer.js)" = 'de2f6fbfe1f316d6bc15081088bab6b0179344ff'
          test "$(git hash-object simulation/executable-seal-v2.json)" = 'ee3507969c03b08fe27350263cf0bc093a1c18e1'

      - name: Commit to existing kimi
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo 'Allow-list correction already applied.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests/step4/verify-s02-runtime-integration.mjs
          git commit -m 'test: admit documented Step 4 governance recovery paths'
          git push origin HEAD:kimi
