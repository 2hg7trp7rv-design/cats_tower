name: Apply Step 4 S02 responsive repair

on:
  workflow_dispatch:
  push:
    branches:
      - kimi
    paths:
      - ".github/workflows/verify-step-4-s02-runtime-integration.yml"

permissions:
  contents: write

concurrency:
  group: apply-step4-s02-responsive-repair-kimi
  cancel-in-progress: false

jobs:
  apply:
    name: Apply researched responsive S02 repair to existing kimi
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact existing kimi
        uses: actions/checkout@v4
        with:
          ref: kimi
          fetch-depth: 0
          persist-credentials: true

      - name: Assert repository and branch boundary
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REPOSITORY}" = "2hg7trp7rv-design/cats_tower"
          test "${GITHUB_REF_NAME}" = "kimi"
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          test "$(git rev-parse HEAD^1)" = "14a684707fd8d4ce6ca8f5516101367777739749"

      - name: Recover verified repair payload from immutable Git blobs
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          : > /tmp/s02-responsive-payload.b64
          for blob in \
            7a458fb8aa13dd02fdf36f1a8394d4140ad4a765 \
            a946ebd473d571da4d8ce812bb4b027e594c4b89 \
            516093fb18750e366434e4d46d1bbd4e06ed4eed
          do
            curl --fail --silent --show-error --location \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/git/blobs/${blob}" \
              | jq -r '.content' | tr -d '\n' | base64 --decode \
              >> /tmp/s02-responsive-payload.b64
          done
          test "$(wc -c < /tmp/s02-responsive-payload.b64 | tr -d ' ')" = "37296"
          base64 --decode /tmp/s02-responsive-payload.b64 > /tmp/s02-responsive-payload.tar.xz
          echo "f46f5823d0adadc42f052c520dfb9178ec47a6f88d14364fd65858f70114c02b  /tmp/s02-responsive-payload.tar.xz" | sha256sum --check
          tar -xJf /tmp/s02-responsive-payload.tar.xz -C "${GITHUB_WORKSPACE}"

      - name: Verify exact files and forbidden-path boundary
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object runtime/s02-runtime-fixes.css)" = "59560b092746b22bf3645ee5f7cbb18f64db07ff"
          test "$(git hash-object runtime/s02-runtime.js)" = "88ea0bf76bfaf44980bc21cdf8abeaa3b75077f0"
          test "$(git hash-object runtime/s02-battle-renderer.js)" = "16e8dfdffaa9beab0723f9be93ad2f467b8d3239"
          test "$(git hash-object tests/step4/s02-runtime-browser-qa.mjs)" = "ef8c1cdef53e3b6002eec16b73e8f74688a08991"
          test "$(git hash-object tests/step4/verify-s02-runtime-integration.mjs)" = "0591f9664cac9cb2a6797f0661012d038208dec0"
          test "$(git hash-object .github/workflows/verify-step-4-s02-runtime-integration.yml)" = "f9906c811eb9e6596978759ae6569f808db875fd"
          test "$(git hash-object quality-reviews/step-4-twelve-screen-final-mockups/s02-actual-root-visual-repair-responsive-acceptance-round-002.json)" = "a6c3374cc68156dbc382b2302b4396dc42bf2373"

          allowed=/tmp/s02-allowed.txt
          actual=/tmp/s02-actual.txt
          printf '%s\n' \
            '.github/workflows/verify-step-4-s02-runtime-integration.yml' \
            'quality-reviews/step-4-twelve-screen-final-mockups/s02-actual-root-visual-repair-responsive-acceptance-round-002.json' \
            'runtime/s02-battle-renderer.js' \
            'runtime/s02-runtime-fixes.css' \
            'runtime/s02-runtime.js' \
            'tests/step4/s02-runtime-browser-qa.mjs' \
            'tests/step4/verify-s02-runtime-integration.mjs' \
            > "${allowed}"
          git status --short | sed 's/^...//' | sort > "${actual}"
          diff -u "${allowed}" "${actual}"
          git diff --check
          node --check runtime/s02-runtime.js
          node --check runtime/s02-battle-renderer.js
          node --check tests/step4/s02-runtime-browser-qa.mjs
          node --check tests/step4/verify-s02-runtime-integration.mjs
          node tests/step4/verify-s02-runtime-integration.mjs | tee /tmp/s02-responsive-static-report.json
          grep -q 'PASS_S02_RESPONSIVE_VISUAL_REPAIR_STATIC' /tmp/s02-responsive-static-report.json

      - name: Commit only the authorized responsive repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            runtime/s02-runtime-fixes.css \
            runtime/s02-runtime.js \
            runtime/s02-battle-renderer.js \
            tests/step4/s02-runtime-browser-qa.mjs \
            tests/step4/verify-s02-runtime-integration.mjs \
            .github/workflows/verify-step-4-s02-runtime-integration.yml \
            quality-reviews/step-4-twelve-screen-final-mockups/s02-actual-root-visual-repair-responsive-acceptance-round-002.json
          git diff --cached --check
          test "$(git diff --cached --name-only | wc -l | tr -d ' ')" = "7"
          git commit -m "fix: adapt S02 UI across mobile aspect ratios"
          git push origin HEAD:kimi
          echo "content_commit=$(git rev-parse HEAD)"
          echo "content_tree=$(git rev-parse HEAD^{tree})"
