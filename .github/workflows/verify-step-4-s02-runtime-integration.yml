name: Verify Step 4 S02 actual-root visual repair

on:
  workflow_dispatch:
  push:
    branches:
      - kimi
    paths:
      - "runtime/s02-runtime.js"
      - "runtime/s02-battle-renderer.js"
      - "runtime/s02-runtime-fixes.css"
      - "tests/step4/verify-s02-runtime-integration.mjs"
      - "tests/step4/s02-runtime-browser-qa.mjs"
      - "tests/governance/verify-current-step2-state.mjs"
      - "quality-reviews/step-1-canonical-design/active-change-control-addendum-round-025.json"
      - "quality-reviews/step-4-twelve-screen-final-mockups/s02-actual-root-visual-repair-*.json"
      - "PROJECT_STATUS.json"
      - "AI_PROJECT_POLICY.json"
      - "simulation/CURRENT_STATUS.json"
      - "QUALITY_GATE.md"
      - ".github/workflows/CURRENT_STATUS.md"
      - "PROJECT_HANDOVER.md"
      - "AGENTS.md"
      - ".github/workflows/verify-step-4-s02-runtime-integration.yml"

permissions:
  contents: read

concurrency:
  group: verify-step4-s02-actual-root-visual-repair-kimi
  cancel-in-progress: true

jobs:
  verify-visual-repair:
    name: Static, governance, Chromium and accessibility
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout exact kimi commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Assert repository and branch boundary
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REPOSITORY}" = "2hg7trp7rv-design/cats_tower"
          test "${GITHUB_REF_NAME}" = "kimi"
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          git merge-base --is-ancestor 9495c97232213620346958f271913fd8a585ff50 HEAD
          echo "head=$(git rev-parse HEAD)"
          echo "tree=$(git rev-parse HEAD^{tree})"

      - name: Run fail-closed visual-repair contracts
        shell: bash
        run: |
          set -euo pipefail
          node tests/step4/verify-s02-runtime-integration.mjs | tee s02-actual-root-visual-repair-static-report.json
          grep -q 'PASS_S02_ACTUAL_ROOT_VISUAL_REPAIR_STATIC' s02-actual-root-visual-repair-static-report.json
          node tests/governance/verify-current-step2-state.mjs | tee current-step4-visual-repair-governance-report.json
          grep -q 'PASS_CURRENT_CATS_TOWER_STEP4_S02_VISUAL_REPAIR_GOVERNANCE' current-step4-visual-repair-governance-report.json

      - name: Install pinned Playwright and Chromium
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/s02-visual-repair-playwright
          cd /tmp/s02-visual-repair-playwright
          npm init -y >/dev/null 2>&1
          npm install --save-exact playwright@1.62.1
          npx playwright install --with-deps chromium

      - name: Start exact-head root game preview
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/s02-visual-repair-http.log 2>&1 &
          echo $! > /tmp/s02-visual-repair-http.pid
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:4173/ >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/s02-visual-repair-http.log
          exit 1

      - name: Run actual-root Chromium visual-repair QA
        shell: bash
        env:
          PLAYWRIGHT_PACKAGE: /tmp/s02-visual-repair-playwright/node_modules/playwright
          S02_RUNTIME_BASE_URL: http://127.0.0.1:4173/
          S02_RUNTIME_EVIDENCE_DIR: quality-reviews/step-4-twelve-screen-final-mockups/s02-actual-root-visual-repair-browser-evidence
        run: |
          set -euo pipefail
          node tests/step4/s02-runtime-browser-qa.mjs | tee s02-actual-root-visual-repair-browser-report.log
          grep -q 'PASS_S02_ACTUAL_ROOT_VISUAL_REPAIR_BROWSER' s02-actual-root-visual-repair-browser-report.log

      - name: Verify exact-head evidence payload
        shell: bash
        run: |
          set -euo pipefail
          report=quality-reviews/step-4-twelve-screen-final-mockups/s02-actual-root-visual-repair-browser-evidence/report.json
          test -f "${report}"
          node --input-type=module - "${report}" <<'NODE'
          import fs from 'node:fs';

          const reportPath = process.argv[2];
          const report = JSON.parse(fs.readFileSync(reportPath, 'utf8'));
          const modes = new Set((report.results || []).map(result => result.mode));
          const normal = (report.results || []).filter(result => result.mode === 'normal-after-explicit-summon');

          if (report.verdict !== 'PASS_S02_ACTUAL_ROOT_VISUAL_REPAIR_BROWSER') {
            throw new Error(`Unexpected browser verdict: ${report.verdict}`);
          }
          if (report.normalScreenshotState !== 'normal-after-explicit-summon interactions') {
            throw new Error(`Normal screenshot state is not explicitly labelled: ${report.normalScreenshotState}`);
          }
          if (report.resultCount !== 6 || (report.results || []).length !== 6) {
            throw new Error(`Expected six evidence results, found ${report.resultCount}`);
          }
          if (normal.length !== 3 || normal.some(result => !(result.hydration?.after > result.hydration?.before))) {
            throw new Error('All three normal screenshots must follow an actual summon-button state change.');
          }
          for (const requiredMode of ['actual-interaction', 'large-text', 'reduced-motion']) {
            if (!modes.has(requiredMode)) throw new Error(`Missing evidence mode: ${requiredMode}`);
          }
          if (report.productionChanged !== false || report.physicalIPhone !== 'NOT_VERIFIED') {
            throw new Error('External-state truth boundary changed.');
          }
          NODE
          test "$(find quality-reviews/step-4-twelve-screen-final-mockups/s02-actual-root-visual-repair-browser-evidence -maxdepth 1 -name '*.png' | wc -l | tr -d ' ')" = "6"
          git diff --check 9495c97232213620346958f271913fd8a585ff50..HEAD

      - name: Upload exact-head visual-repair evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: step4-s02-actual-root-visual-repair-${{ github.sha }}
          if-no-files-found: error
          retention-days: 30
          path: |
            s02-actual-root-visual-repair-static-report.json
            current-step4-visual-repair-governance-report.json
            s02-actual-root-visual-repair-browser-report.log
            quality-reviews/step-4-twelve-screen-final-mockups/s02-actual-root-visual-repair-browser-evidence/**
            /tmp/s02-visual-repair-http.log
            index.html
            app.js
            game-core.js
            game-data.js
            styles.css
            manifest.webmanifest
            runtime/**
            assets/**
            step4/s02/assets/**
            tests/step4/s02-runtime-browser-qa.mjs
            tests/step4/verify-s02-runtime-integration.mjs
