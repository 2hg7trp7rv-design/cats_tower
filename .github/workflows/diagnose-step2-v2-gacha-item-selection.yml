      - name: Regenerate qualification evidence for the updated execution contract
        shell: bash
        run: |
          set -euo pipefail
          node simulation/engine-v2/run-plan.mjs --mode qualification --output quality-reviews/step-2-executable-contract-v2/qualification-result.json
      - name: Run complete Step 2 verifier on repaired working tree
        shell: bash
        run: |
          set -euo pipefail
          node simulation/verify-step2-v2.mjs
      - name: Confirm bounded repair and no forbidden files
        shell: bash
        run: |
          set -euo pipefail
          changed="$(git status --short | sed -E 's/^.. //' | sed -E 's/.* -> //')"
          printf '%s\n' "$changed"
          test -n "$changed"
          while IFS= read -r path; do
            case "$path" in
              simulation/*|quality-reviews/step-2-executable-contract-v2/qualification-result.json|.github/workflows/diagnose-step2-v2-gacha-item-selection.yml)
                ;;
              *)
                echo "gacha item-selection repair escaped Step 2 boundary: $path" >&2
                exit 1
                ;;
            esac
          done <<< "$changed"
          git diff --check
          git diff --stat
          echo 'GACHA_ITEM_SELECTION_REPAIR_VALIDATED_WITHOUT_WRITE=true'
