name: Materialize Step 2 V2 content

on:
  push:
    branches: [kimi]
    paths:
      - 'quality-reviews/step-2-executable-contract-v2/bootstrap/READY'

permissions:
  contents: write

concurrency:
  group: materialize-step2-v2-kimi
  cancel-in-progress: false

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: kimi
          fetch-depth: 1
      - name: Verify and extract fixed payload
        shell: bash
        run: |
          set -euo pipefail
          BOOT='quality-reviews/step-2-executable-contract-v2/bootstrap'
          cat "$BOOT"/chunk-*.txt > "$RUNNER_TEMP/step2.b64"
          echo '3030f4e0fa4a65d8bbe3124df6d14e0424df2c4999253435ddc644b32ba42a96  '"$RUNNER_TEMP/step2.b64" | sha256sum -c -
          base64 --decode "$RUNNER_TEMP/step2.b64" > "$RUNNER_TEMP/step2.tar.gz"
          echo '760a9e1eeb7ecaa74ee22f929ac5ae5d9dd15d3c68657c522110b9db6a9e683a  '"$RUNNER_TEMP/step2.tar.gz" | sha256sum -c -
          python - <<'PY'
          import tarfile
          from pathlib import PurePosixPath
          archive = tarfile.open('/home/runner/work/_temp/step2.tar.gz', 'r:gz')
          allowed = ('simulation/', 'quality-reviews/step-2-executable-contract-v2/qualification-result.json')
          for member in archive.getmembers():
              path = PurePosixPath(member.name)
              if path.is_absolute() or '..' in path.parts:
                  raise SystemExit(f'unsafe archive path: {member.name}')
              if not (member.name == 'simulation' or member.name.startswith('simulation/') or member.name == allowed[1]):
                  raise SystemExit(f'out-of-bound archive path: {member.name}')
          archive.extractall('.')
          PY
          rm -rf "$BOOT"
      - name: Commit only to existing kimi
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'cats-tower-step2-bot'
          git config user.email 'cats-tower-step2-bot@users.noreply.github.com'
          git add -A simulation quality-reviews/step-2-executable-contract-v2
          git diff --cached --name-only
          git commit -m 'feat: materialize Step 2 V2 executable contract content'
          git push origin HEAD:kimi
