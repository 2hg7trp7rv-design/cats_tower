name: Repair Step 4 S02 browser assertion race

on:
  workflow_dispatch:
  push:
    branches:
      - kimi
    paths:
      - ".github/workflows/execute-step-4-s02-main-entry-v2.yml"

permissions:
  contents: write

concurrency:
  group: repair-step4-s02-browser-assertion-kimi
  cancel-in-progress: false

jobs:
  repair:
    name: Wait for smooth commerce navigation before assertion
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout latest existing kimi
        uses: actions/checkout@v4
        with:
          ref: kimi
          fetch-depth: 0

      - name: Assert repository, branch and recovery authority
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REPOSITORY}" = "2hg7trp7rv-design/cats_tower"
          test "$(git branch --show-current)" = "kimi"
          git pull --ff-only origin kimi
          grep -q 'IN_PROGRESS_STEP4_S02_MAIN_ENTRY_GOVERNANCE_RECOVERY' \
            quality-reviews/step-1-canonical-design/active-change-control-addendum-round-023.json

      - name: Apply exact browser assertion repair
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          file = Path('tests/step4/s02-runtime-browser-qa.mjs')
          old = """  await commerce.click();
  assert(await commerce.getAttribute('aria-current') === 'page', 'Interaction: commerce navigation did not become current.');
  const scrollTop = await page.locator('#runtime-scroll').evaluate(element => element.scrollTop);
  assert(scrollTop > 0, 'Interaction: commerce navigation did not move to the actual merchant section.');
"""
          new = """  await commerce.click();
  assert(await commerce.getAttribute('aria-current') === 'page', 'Interaction: commerce navigation did not become current.');
  await page.waitForFunction(() => document.querySelector('#runtime-scroll')?.scrollTop > 0);
  const scrollTop = await page.locator('#runtime-scroll').evaluate(element => element.scrollTop);
  assert(scrollTop > 0, 'Interaction: commerce navigation did not move to the actual merchant section.');
"""
          text = file.read_text(encoding='utf-8')
          if old not in text:
              if new in text:
                  print('browser assertion already repaired')
              else:
                  raise SystemExit('expected commerce assertion block not found')
          else:
              if text.count(old) != 1:
                  raise SystemExit('expected exactly one commerce assertion block')
              file.write_text(text.replace(old, new), encoding='utf-8')
              print('browser assertion repaired')
          PY
          node --check tests/step4/s02-runtime-browser-qa.mjs
          git diff --check

      - name: Assert single-file mutation boundary
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t changed < <(git diff --name-only)
          printf '%s\n' "${changed[@]}"
          test "${#changed[@]}" -le 1
          for file in "${changed[@]}"; do
            test "$file" = "tests/step4/s02-runtime-browser-qa.mjs"
          done
          test "$(git hash-object game-core.js)" = "34471eaa185b2355f17a8e8860261f63ee86bdaf"
          test "$(git hash-object game-data.js)" = "fa01689275f05f1e0879c40586499cc74c337cf9"
          test "$(git hash-object sw.js)" = "16aca2f8f94fdfbcf8b228a331e35288fcbc2365"
          test "$(git hash-object runtime/s02-runtime.js)" = "fb03de942075ec05bcab476234205288688d639d"
          test "$(git hash-object simulation/executable-seal-v2.json)" = "ee3507969c03b08fe27350263cf0bc093a1c18e1"

      - name: Commit test repair to existing kimi
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "Browser assertion repair is already applied."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/step4/s02-runtime-browser-qa.mjs
          git commit -m "test: wait for S02 commerce smooth scroll"
          git push origin HEAD:kimi
