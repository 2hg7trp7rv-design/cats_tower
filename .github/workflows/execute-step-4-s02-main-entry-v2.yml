name: Apply Step 4 S02 viewport recovery

on:
  workflow_dispatch:
  push:
    branches:
      - kimi
    paths:
      - ".github/workflows/execute-step-4-s02-main-entry-v2.yml"

permissions:
  contents: write

concurrency:
  group: apply-step4-s02-viewport-recovery-kimi
  cancel-in-progress: false

jobs:
  apply:
    name: Apply two-file viewport accessibility repair
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout latest existing kimi
        uses: actions/checkout@v4
        with:
          ref: kimi
          fetch-depth: 0

      - name: Assert repository, branch and recovery authority
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REPOSITORY}" = "2hg7trp7rv-design/cats_tower"
          test "$(git branch --show-current)" = "kimi"
          git pull --ff-only origin kimi
          test -f quality-reviews/step-1-canonical-design/active-change-control-addendum-round-023.json
          grep -q 'IN_PROGRESS_STEP4_S02_MAIN_ENTRY_GOVERNANCE_RECOVERY' \
            quality-reviews/step-1-canonical-design/active-change-control-addendum-round-023.json

      - name: Apply exact viewport replacements
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          replacements = {
              Path('index.html'): (
                  'width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover',
                  'width=device-width, initial-scale=1.0, viewport-fit=cover',
              ),
              Path('step4/s02/index.html'): (
                  'width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1',
                  'width=device-width, initial-scale=1, viewport-fit=cover',
              ),
          }

          for file, (old, new) in replacements.items():
              text = file.read_text(encoding='utf-8')
              if old not in text:
                  if new in text:
                      print(f'{file}: already repaired')
                      continue
                  raise SystemExit(f'{file}: expected viewport source string not found')
              if text.count(old) != 1:
                  raise SystemExit(f'{file}: expected exactly one viewport source string')
              file.write_text(text.replace(old, new), encoding='utf-8')
              print(f'{file}: repaired')
          PY
          grep -q 'viewport-fit=cover' index.html
          grep -q 'viewport-fit=cover' step4/s02/index.html
          ! grep -Eq 'user-scalable[[:space:]]*=[[:space:]]*no|maximum-scale[[:space:]]*=[[:space:]]*1([.,]|$)' index.html
          ! grep -Eq 'user-scalable[[:space:]]*=[[:space:]]*no|maximum-scale[[:space:]]*=[[:space:]]*1([.,]|$)' step4/s02/index.html
          git diff --check

      - name: Assert two-file mutation boundary
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t changed < <(git diff --name-only)
          printf '%s\n' "${changed[@]}"
          test "${#changed[@]}" -le 2
          for file in "${changed[@]}"; do
            case "$file" in
              index.html|step4/s02/index.html) ;;
              *) echo "Out-of-bound recovery mutation: $file" >&2; exit 1 ;;
            esac
          done
          test "$(git hash-object game-core.js)" = "34471eaa185b2355f17a8e8860261f63ee86bdaf"
          test "$(git hash-object game-data.js)" = "fa01689275f05f1e0879c40586499cc74c337cf9"
          test "$(git hash-object sw.js)" = "2d21ce6930746722910e6182a7310da6f1245fb7"
          test "$(git hash-object simulation/executable-seal-v2.json)" = "ee3507969c03b08fe27350263cf0bc093a1c18e1"

      - name: Commit repair to existing kimi
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "Viewport recovery is already applied."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html step4/s02/index.html
          git commit -m "fix: restore user zoom on S02 entries"
          git push origin HEAD:kimi

      - name: Upload apply report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: step4-s02-viewport-recovery-${{ github.sha }}
          if-no-files-found: warn
          retention-days: 30
          path: |
            index.html
            step4/s02/index.html
