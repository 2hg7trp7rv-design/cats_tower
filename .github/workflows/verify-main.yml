              assert 'hue-rotate(84deg)' in filters['helper-gray']
              assert 'hue-rotate(0deg)' in filters['helper-calico']
              party=loop['rally']['partyGeometry']
              assert party['footSpread']<=1.5
              assert 0.875<=party['groundRatio']<=0.885
              assert party['minimumGap']>=2 and party['contained'] is True
              matrix=loop['rally']['alignmentPhaseMatrix']
              assert len(matrix['cats'])==24 and len(matrix['enemies'])==16
              assert matrix['maximumCatGroundError']<=0.15
              assert matrix['maximumEnemyHoverError']<=0.15
              assert loop['firstKillReward']>0
              assert loop['upgrade']['levelAfter']==loop['upgrade']['levelBefore']+1
              assert loop['upgrade']['dpsAfter']>loop['upgrade']['dpsBefore']
              assert loop['wall']['floor']==report['rules']['wallFloor'] and loop['wall']['heldMs']==12000
              assert loop['wall']['visual']['enemy']=='black-feather-barrier'
              assert loop['wall']['visual']['character']=='barrier'
              assert 'enemies-r3.png' in loop['wall']['visual']['spriteBackground']
              assert 3<=loop['wall']['ground']['hoverGap']<=7.5
              assert loop['dawn']['bestFloorAfter']>=loop['dawn']['bestFloorBefore']
              assert loop['dawn']['shardsAfter']>loop['dawn']['shardsBefore']
              assert loop['replay']['replayMs']<loop['replay']['baselineMs']
              assert loop['replay']['speedupRatio']<=0.75
              assert loop['firstEnemy']['ground']['enemy']=='crow'
              assert 3<=loop['firstEnemy']['ground']['hoverGap']<=7.5
              assert loop['normalEnemy']['enemy']=='owl' and loop['normalEnemy']['character']=='owl'
              assert 'enemies-r3.png' in loop['normalEnemy']['spriteBackground']
              assert 3<=loop['normalEnemy']['ground']['hoverGap']<=7.5
              assert loop['firstNightBoss']['enemy']=='boss'
              assert loop['firstNightBoss']['character']=='boss'
              assert loop['firstNightBoss']['phase']!='defeated'
              assert loop['firstNightBoss']['opacity']>0 and loop['firstNightBoss']['intersectsViewport'] is True
              assert loop['firstNightBoss']['width']>0 and loop['firstNightBoss']['height']>0
              assert 'enemies-r3.png' in loop['firstNightBoss']['spriteBackground']
              assert 3<=loop['firstNightBoss']['ground']['hoverGap']<=7.5
              entry=loop['firstNightBoss']['entryFormation']
              assert entry['count']==6 and len(set(entry['kinds']))==6
              assert entry['minimumGap']>=2 and entry['contained'] is True
              sweep=loop['firstNightBoss']['entryFormationSweep']
              assert sweep['samples']>=2 and sweep['minimumGap']>=2 and sweep['allContained'] is True
              immediate=loop['completedImmediateRoster']
              assert immediate['unitCount']==6 and len(set(immediate['kinds']))==6
              assert immediate['recoveryCount']==0
              assert immediate['geometry']['minimumGap']>=2 and immediate['geometry']['contained'] is True
              assert loop['firstNightCleared'] is True
              assert loop['firstNightCompleted'] is True
              assert loop['completedFloor']==report['rules']['firstBossFloor']==10
              assert report['save']['newSchemaReload'] is True
              restored=report['save']['completedReloadRuntime']
              assert restored['unitCount']==6 and len(set(restored['kinds']))==6
              assert restored['phases']==['celebrating']
              assert restored['geometry']['minimumGap']>=2 and restored['geometry']['contained'] is True
              assert {item['name'] for item in report['save']['migrations']}=={'living-v080','legacy-v01','corrupt-v080','v081-post-dawn','v081-boss-clear','future-schema'}
              assert all(item['passed'] for item in report['save']['migrations'])
              assert {item['name'] for item in report['evidence']}==expected
              assert {path.name for path in root.glob('*.png')}==expected
              normal=json.loads((Path('test-results')/f'step-1-normal-{browser}-{label}'/'report.json').read_text())
              assert normal['passed'] is True
              assert normal['qaMode'] is False
              assert normal['reducedMotion'] is False
              assert normal['serviceWorkers']=='enabled'
              assert normal['active']['gameVisible'] is True
              assert normal['active']['titleHidden'] is True
              assert normal['active']['visibleCats']>=1
              assert normal['reloaded']['gameVisible'] is True
              assert normal['durableReload']['preserved'] is True
              assert normal['durableReload']['before']['durable']==normal['durableReload']['after']['durable']
              assert normal['durableReload']['before']['screen']==normal['durableReload']['after']['screen']
              assert normal['errors']==[]
              assert normal['failedRequests']==[]
              if browser=='chromium':
                assert normal['reloaded']['serviceWorkerSupported'] is True
                assert normal['reloaded']['serviceWorkerControlled'] is True
                assert normal['reloaded']['serviceWorkerControllerUrl']
                sw=json.loads((Path('test-results')/f'step-1-sw-{browser}-{label}'/'report.json').read_text())
                assert sw['passed'] is True
                assert sw['runtimeVersion']=='0.8.2'
                assert sw['gameplaySchema']==2
                assert sw['saveKey']=='cats-tower-v080'
                assert sw['cacheState']['controlled'] is True
                assert sw['cacheState']['actualEntryCount']==15
                assert sw['cacheState']['expectedEntryCount']==15
                assert sw['futureSchemaPreserved'] is True
                assert sw['futureSchemaRawBytesUnchanged'] is True
                assert sw['obsoleteCacheRemoved'] is True
                assert sw['offline']['version']=='0.8.2'
                assert sw['offline']['controlled'] is True
                assert sw['errors']==[]
          print('deterministic vertical tower and visual evidence contracts passed')
          PY

      - name: Attach captured CI provenance
        working-directory: ${{ steps.step1.outputs.kit }}
        env:
          EXPECTED_PROVENANCE_SHA256: ${{ steps.ci_provenance.outputs.sha256 }}
          EXPECTED_INVOCATION_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git -C "$GITHUB_WORKSPACE" rev-parse HEAD)" = "$EXPECTED_INVOCATION_HEAD"
          git -C "$GITHUB_WORKSPACE" diff --quiet
          git -C "$GITHUB_WORKSPACE" diff --cached --quiet
          test "$(sha256sum "$RUNNER_TEMP/cats-ci-provenance.json" | cut -d' ' -f1)" = "$EXPECTED_PROVENANCE_SHA256"
          mkdir -p test-results
          install -m 0644 "$RUNNER_TEMP/cats-ci-provenance.json" test-results/ci-provenance.json
          cmp -s "$RUNNER_TEMP/cats-ci-provenance.json" test-results/ci-provenance.json
          test "$(sha256sum test-results/ci-provenance.json | cut -d' ' -f1)" = "$EXPECTED_PROVENANCE_SHA256"

      - name: Upload V0.8.2 vertical tower evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cats-v082-step-1-recovery-evidence-attempt-${{ github.run_attempt }}
          path: ${{ steps.step1.outputs.kit }}/test-results
          if-no-files-found: error
          retention-days: 30

  round7-external-audit:
    name: round7-external-artifact-audit
    needs: vertical-tower-qa
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && needs['vertical-tower-qa'].result == 'success' }}
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/verify-step-1-artifacts.yml
    with:
      source_run_id: ${{ fromJSON(github.run_id) }}
      source_run_attempt: ${{ fromJSON(github.run_attempt) }}
      source_head_sha: ${{ github.sha }}
      source_event: ${{ github.event_name }}
      source_ref: ${{ github.ref }}
