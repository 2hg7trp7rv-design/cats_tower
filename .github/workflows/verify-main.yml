name: Verify Cat's Tower history and current governance

on:
  push:
    branches: [kimi]
    paths:
      - '.github/workflows/verify-main.yml'
      - '.github/workflows/CURRENT_STATUS.md'
      - 'AI_PROJECT_POLICY.json'
      - 'QUALITY_GATE.md'
      - 'PROJECT_STATUS.json'
      - 'PROJECT_HANDOVER.md'
      - 'AGENTS.md'
      - 'CHATGPT_PROJECT_INSTRUCTIONS1.md'
      - 'MASTER_SPEC.md'
      - 'canonical/**'
      - 'simulation/**'
      - 'quality-reviews/step-1-canonical-design/**'
      - 'quality-reviews/step-1-reseal-round-008/**'
      - 'quality-reviews/step-2-executable-contract-v2/**'
      - 'quality-reviews/step-2-governance-repair-round-001/**'
      - 'tests/governance/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cats-governance-${{ github.sha }}
  cancel-in-progress: false

jobs:
  historical-round7-evidence:
    name: historical-round7-evidence
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate immutable Round 7 worktrees only
        run: |
          set -euo pipefail

          ACCEPTANCE='quality-reviews/step-1-legacy-baseline-round-007/acceptance-round-007.json'
          ROUND='quality-reviews/step-1-legacy-baseline-round-007/round-007.json'
          COMPLETION='quality-reviews/step-1-legacy-baseline-round-007/completion.json'

          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          test "$(git rev-parse --is-shallow-repository)" = 'false'
          test -z "$(git replace -l)"

          first_addition() {
            local target="$1"
            git log --diff-filter=A --format='%H' -- "$target" | tail -n 1
          }

          C1_COMMIT=$(first_addition "$ACCEPTANCE")
          ROUND_COMMIT=$(first_addition "$ROUND")
          COMPLETION_COMMIT=$(first_addition "$COMPLETION")

          test "$C1_COMMIT" = '88fb46b1d1cdbd5c071804275c92dc51a8c59913'
          test "$COMPLETION_COMMIT" = '23ba6d47dc2de04ca21d10454e87cacd9079533e'
          test -n "$ROUND_COMMIT"
          git merge-base --is-ancestor "$C1_COMMIT" HEAD
          git merge-base --is-ancestor "$ROUND_COMMIT" HEAD
          git merge-base --is-ancestor "$COMPLETION_COMMIT" HEAD

          C1_DIR="$RUNNER_TEMP/round7-c1"
          COMPLETION_DIR="$RUNNER_TEMP/round7-completion"
          test ! -e "$C1_DIR"
          test ! -e "$COMPLETION_DIR"
          git worktree add --detach "$C1_DIR" "$C1_COMMIT"
          git worktree add --detach "$COMPLETION_DIR" "$COMPLETION_COMMIT"

          test "$(git -C "$C1_DIR" rev-parse HEAD)" = "$C1_COMMIT"
          test "$(git -C "$COMPLETION_DIR" rev-parse HEAD)" = "$COMPLETION_COMMIT"
          test "$(git -C "$C1_DIR" cat-file -t "HEAD:$ACCEPTANCE")" = 'blob'
          test "$(git -C "$COMPLETION_DIR" cat-file -t "HEAD:$ROUND")" = 'blob'
          test "$(git -C "$COMPLETION_DIR" cat-file -t "HEAD:$COMPLETION")" = 'blob'

          jq -e '.artifactId == "step-1-legacy-baseline-round-007" and .status == "FROZEN_AT_C1"' "$C1_DIR/$ACCEPTANCE" >/dev/null
          jq -e '.artifactId == "step-1-legacy-baseline-round-007" and .round == 7 and .overallStatus == "EXTERNAL_PENDING"' "$COMPLETION_DIR/$ROUND" >/dev/null
          jq -e '.artifactId == "step-1-legacy-baseline-round-007" and .round == 7 and .status == "PASS" and .canonicalStatus == "PASS"' "$COMPLETION_DIR/$COMPLETION" >/dev/null

          (
            cd "$C1_DIR"
            CATS_REPO_ROOT="$COMPLETION_DIR" node tests/verify-step-1-baseline.mjs
          )

          echo 'PASS_HISTORICAL_ROUND7_IMMUTABLE_WORKTREES'

  current-governance:
    name: current-governance
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify current Round 008 and Step 2 state
        run: node tests/governance/verify-current-step2-state.mjs

      - name: Re-run the sealed Step 2 executable verifier
        run: node simulation/verify-step2-v2.mjs

      - name: Reject whitespace and patch defects
        run: git diff --check 510157c97e7e94456df8d45c3af20082e71aced6..HEAD
