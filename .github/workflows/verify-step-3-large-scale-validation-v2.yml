name: Verify Step 3 large-scale validation v2

on:
  push:
    branches: [kimi]
    paths:
      - '.github/workflows/verify-step-3-large-scale-validation-v2.yml'
      - '.github/workflows/finalize-step-3-large-scale-validation.yml'
      - 'quality-reviews/step-3-large-scale-validation/tools/finalize-step3.mjs'
      - 'tests/governance/verify-current-step2-state.mjs'
      - 'quality-reviews/step-3-large-scale-validation/live-readback.json'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: cats-step3-large-scale-validation-v2
  cancel-in-progress: false

jobs:
  finalize-step3:
    name: finalize-step3
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      STEP3_DIR: quality-reviews/step-3-large-scale-validation
      TOOL: quality-reviews/step-3-large-scale-validation/tools/finalize-step3.mjs
      ENTRY: 3eefbf6fa7dfcec8b5b093612e8946b43d838bc2
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Assert repository, immutable authority and script syntax
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = '2hg7trp7rv-design/cats_tower'
          test "$GITHUB_REF_NAME" = 'kimi'
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse --is-shallow-repository)" = 'false'
          test -z "$(git replace -l)"
          git merge-base --is-ancestor "$ENTRY" HEAD
          node --check "$TOOL"
          node --check tests/governance/verify-current-step2-state.mjs
          node tests/governance/verify-current-step2-state.mjs
          node "$TOOL" verify-source

      - name: Verify source execution and seal workflow runs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          {
            jq -r '.sourceExecution.runId, .aggregateRepair.runId' "$STEP3_DIR/execution-gate.json"
            jq -r '.workflowVerification.execution.runId, .workflowVerification.aggregateRepair.runId, .workflowVerification.executionSeal.runId' "$STEP3_DIR/execution-live-readback-v2.json"
          } | sort -u > "$RUNNER_TEMP/source-run-ids.txt"
          while read -r RUN_ID; do
            test -n "$RUN_ID"
            RUN=$(curl -fsSL \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID")
            test "$(jq -r '.status' <<<"$RUN")" = 'completed'
            test "$(jq -r '.conclusion' <<<"$RUN")" = 'success'
          done < "$RUNNER_TEMP/source-run-ids.txt"

      - name: Detect resumable phase
        id: phase
        run: |
          set -euo pipefail
          if [ -f "$STEP3_DIR/live-readback.json" ]; then
            MODE=verify-terminal
          elif [ -f "$STEP3_DIR/completion-evidence.json" ]; then
            MODE=await-finalizer
          else
            MODE=prepare
          fi
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"
          echo "Detected mode: $MODE"

      - name: Re-run sealed Step 2 verifier
        run: |
          set -euo pipefail
          node simulation/verify-step2-v2.mjs | tee "$RUNNER_TEMP/step2-regression.json"
          jq -e '.verdict == "PASS"' "$RUNNER_TEMP/step2-regression.json" >/dev/null
          node simulation/validate-executable-seal-v2.mjs simulation/executable-seal-v2.json | tee "$RUNNER_TEMP/step2-seal.json"
          jq -e '.verdict == "PASS_EXECUTABLE_SEAL_V2"' "$RUNNER_TEMP/step2-seal.json" >/dev/null

      - name: Configure exact kimi writer
        if: steps.phase.outputs.mode == 'prepare'
        run: |
          set -euo pipefail
          test "$(git rev-parse origin/kimi)" = "$GITHUB_SHA"
          git checkout -B kimi "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          test "$(git branch --show-current)" = 'kimi'

      - name: Run integrated analysis and five independent critic scopes
        if: steps.phase.outputs.mode == 'prepare'
        run: |
          set -euo pipefail
          node "$TOOL" analyze | tee "$RUNNER_TEMP/step3-analysis-verdict.json"
          jq -e '.criticCount == 5 and (.unresolvedP0 | type == "number") and (.unresolvedP1 | type == "number")' "$RUNNER_TEMP/step3-analysis-verdict.json" >/dev/null
          jq -e '.criticCount == 5 and (.unresolvedP0 | type == "number") and (.unresolvedP1 | type == "number") and (.verdict == "PASS" or .verdict == "FAIL")' "$STEP3_DIR/critic-summary.json" >/dev/null
          jq -e '.verdict == "PASS_STEP3_CONTENT_PENDING_COMPLETION_AND_LIVE_READBACK" or .verdict == "FAIL_STEP3_SEALED_CANDIDATE_PENDING_TERMINAL_EVIDENCE"' "$STEP3_DIR/final-judge.json" >/dev/null
          git diff --check

      - name: Commit independent review and status mirrors
        if: steps.phase.outputs.mode == 'prepare'
        run: |
          set -euo pipefail
          git add \
            "$STEP3_DIR/analysis.json" \
            "$STEP3_DIR/critics" \
            "$STEP3_DIR/critic-summary.json" \
            "$STEP3_DIR/final-judge.json" \
            "$STEP3_DIR/acceptance-addendum-finalization-repair-005.json" \
            quality-reviews/step-1-canonical-design/active-change-control.json \
            quality-reviews/step-1-canonical-design/active-change-control-addendum-round-015.json \
            AI_PROJECT_POLICY.json PROJECT_STATUS.json simulation/CURRENT_STATUS.json \
            QUALITY_GATE.md .github/workflows/CURRENT_STATUS.md AGENTS.md PROJECT_HANDOVER.md
          test -n "$(git diff --cached --name-only)"
          git commit -m 'step3: complete independent critic review and final judgment'
          git push origin HEAD:kimi
          test -z "$(git status --porcelain --untracked-files=all)"

      - name: Resolve workflow job ID
        if: steps.phase.outputs.mode == 'prepare'
        id: job
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          JOB_ID=$(curl -fsSL \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/jobs?per_page=100" \
            | jq -r '.jobs[] | select(.name == "finalize-step3") | .id' | head -n1)
          test -n "$JOB_ID"
          test "$JOB_ID" != 'null'
          echo "job_id=$JOB_ID" >> "$GITHUB_OUTPUT"

      - name: Create and commit completion evidence
        if: steps.phase.outputs.mode == 'prepare'
        env:
          STEP3_JOB_ID: ${{ steps.job.outputs.job_id }}
        run: |
          set -euo pipefail
          node "$TOOL" completion
          git diff --check
          git add "$STEP3_DIR/completion-evidence.json"
          git commit -m 'step3: bind critic review completion evidence'
          git push origin HEAD:kimi
          node "$TOOL" verify-completion
          test -z "$(git status --porcelain --untracked-files=all)"

      - name: Verify completion while awaiting workflow-run finalizer
        if: steps.phase.outputs.mode == 'await-finalizer'
        run: |
          set -euo pipefail
          node "$TOOL" verify-completion
          test ! -f "$STEP3_DIR/live-readback.json"
          echo 'Completion evidence is valid. The successful workflow_run finalizer will create terminal live read-back.'

      - name: Verify terminal evidence at exact later HEAD
        if: steps.phase.outputs.mode == 'verify-terminal'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          node "$TOOL" verify-terminal
          node tests/governance/verify-current-step2-state.mjs
          PRIOR_RUN_ID=$(jq -r '.executionWorkflow.runId' "$STEP3_DIR/live-readback.json")
          PRIOR=$(curl -fsSL \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/runs/$PRIOR_RUN_ID")
          test "$(jq -r '.status' <<<"$PRIOR")" = 'completed'
          test "$(jq -r '.conclusion' <<<"$PRIOR")" = 'success'
          git diff --check "$ENTRY..HEAD"
          test -z "$(git status --porcelain --untracked-files=all)"
