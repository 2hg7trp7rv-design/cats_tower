name: Diagnose Step 2 V2 adversarial fixtures

on:
  push:
    branches: [kimi]
    paths:
      - '.github/workflows/diagnose-step2-v2-fixtures.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: diagnose-step2-v2-fixtures-${{ github.sha }}
  cancel-in-progress: false

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply known test-harness correction in memory
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('simulation/fixtures/v2/validate-execution-fixtures.mjs')
          text = path.read_text(encoding='utf-8')
          old = "const run = runNode([...validatorArgs, path]);"
          new = "const run = runNode([validatorArgs[0], path, ...validatorArgs.slice(1)]);"
          if old not in text:
              raise SystemExit('expected fixture harness line not found')
          path.write_text(text.replace(old, new), encoding='utf-8')
          PY
      - name: Syntax
        run: find simulation -name '*.mjs' -print0 | xargs -0 -n1 node --check
      - name: Existing fixture regression
        run: node simulation/fixtures/v2/validate-fixtures.mjs
      - name: Execution and result adversarial fixtures
        run: node simulation/fixtures/v2/validate-execution-fixtures.mjs
      - name: Working tree boundary
        if: always()
        run: git status --short
