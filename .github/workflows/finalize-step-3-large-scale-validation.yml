name: Finalize Step 3 terminal read-back

on:
  push:
    branches: [kimi]
    paths:
      - '.github/workflows/finalize-step-3-large-scale-validation.yml'
      - 'quality-reviews/step-3-large-scale-validation/completion-evidence.json'

permissions:
  contents: write
  actions: read

concurrency:
  group: cats-step3-terminal-readback
  cancel-in-progress: false

jobs:
  finalize-terminal-readback:
    name: finalize-terminal-readback
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      STEP3_DIR: quality-reviews/step-3-large-scale-validation
      TOOL: quality-reviews/step-3-large-scale-validation/tools/finalize-step3.mjs
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify completion and successful source workflow
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = '2hg7trp7rv-design/cats_tower'
          test "$GITHUB_REF_NAME" = 'kimi'
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -f "$STEP3_DIR/completion-evidence.json"
          test ! -f "$STEP3_DIR/live-readback.json"
          node --check "$TOOL"
          node "$TOOL" verify-completion
          PRIOR_RUN_ID=$(jq -r '.workflow.runId' "$STEP3_DIR/completion-evidence.json")
          SOURCE_COMMIT=$(jq -r '.workflow.sourceCommit' "$STEP3_DIR/completion-evidence.json")
          test -n "$PRIOR_RUN_ID"
          test "$PRIOR_RUN_ID" != 'null'
          PRIOR=$(curl -fsSL \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/runs/$PRIOR_RUN_ID")
          test "$(jq -r '.status' <<<"$PRIOR")" = 'completed'
          test "$(jq -r '.conclusion' <<<"$PRIOR")" = 'success'
          test "$(jq -r '.head_sha' <<<"$PRIOR")" = "$SOURCE_COMMIT"
          echo "prior_run_id=$PRIOR_RUN_ID" >> "$GITHUB_OUTPUT"

      - name: Create terminal read-back and status activation commit
        env:
          PRIOR_RUN_ID: ${{ steps.source.outputs.prior_run_id }}
          PRIOR_RUN_CONCLUSION: success
        run: |
          set -euo pipefail
          git checkout -B kimi "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          node "$TOOL" live-readback
          git diff --check
          git add \
            "$STEP3_DIR/live-readback.json" \
            quality-reviews/step-1-canonical-design/active-change-control.json \
            quality-reviews/step-1-canonical-design/active-change-control-addendum-round-015.json \
            AI_PROJECT_POLICY.json PROJECT_STATUS.json simulation/CURRENT_STATUS.json \
            QUALITY_GATE.md .github/workflows/CURRENT_STATUS.md AGENTS.md PROJECT_HANDOVER.md
          git commit -m 'step3: finalize terminal critic and validation readback'
          git push origin HEAD:kimi
          test -z "$(git status --porcelain --untracked-files=all)"
