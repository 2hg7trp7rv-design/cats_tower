<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#1b2030">
<title>Cat's Tower — 戦闘プロトタイプ</title>
<meta name="description" content="猫を呼んで塔を戦って登る、1〜10F縦切りプロトタイプ (kimiブランチ)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="assets/icons/icon-192.png">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="app">
  <div id="stage">

    <!-- 上部: 簡易HUD -->
    <header id="hud-top">
      <div id="hud-floor">1F 灰鈴の入口</div>
      <div id="hud-wave"></div>
      <div id="hud-rally" title="号令中">📣</div>
      <div id="hud-delivery" style="display:none" title="配送">
        <span class="dicon">📦</span><span class="dbar"><i></i></span>
      </div>
      <div class="hud-spacer"></div>
      <div id="hud-coins-wrap">🪙<span id="hud-coins">0</span></div>
      <button id="btn-tower" class="hud-btn" aria-label="塔を見る">🗼</button>
      <button id="btn-mute" class="hud-btn" aria-label="ミュート">🔊</button>
    </header>

    <!-- 戦闘領域 (画面高の55%以上) -->
    <main id="battle-wrap">
      <canvas id="battle"></canvas>
      <div id="banner"></div>
    </main>

    <!-- 下部: 常駐UI (呼び鈴・名簿・強化) -->
    <footer id="hud-bottom">
      <button id="btn-roster" class="side-btn"><span class="sic">🐱</span><span class="slabel">名簿</span></button>
      <div id="bell-area">
        <div id="helper-slots" aria-label="増援枠"></div>
        <button id="bell" aria-label="呼び鈴">🔔</button>
        <div id="bell-label"></div>
      </div>
      <button id="btn-upgrade" class="side-btn"><span class="sic">⚒️</span><span class="slabel">強化</span><small></small></button>
    </footer>

    <!-- ボトムシートの挿入先 (モーダルは全面を覆わない) -->
    <div id="sheets"></div>

    <!-- 塔閲覧モード -->
    <div id="tower-view">
      <div id="tower-head">
        <b>塔閲覧</b><span class="tv-sub">1〜10F 第1地区 / 閲覧中も戦闘は続く</span>
      </div>
      <div id="tower-scroll">
        <div id="tower-list"></div>
        <div id="tower-boxes"></div>
        <div id="district-rail">
          <span>91-100</span><span>…</span><span>11-20</span><span class="on">1-10</span>
        </div>
      </div>
      <button id="tower-return">戦闘へ戻る</button>
    </div>

    <!-- タイトル -->
    <div id="title-screen">
      <div id="title-inner">
        <div id="title-logo">🐱🔔</div>
        <h1>Cat's Tower</h1>
        <p class="title-sub">戦闘プロトタイプ — 第1地区 1〜10F</p>
        <p class="title-desc">呼び鈴で猫を呼び、塔を戦って登る。<br>制圧した階は店になり、配送が戦いを支える。</p>
        <button id="btn-start">はじめる</button>
        <p class="title-note">縦画面推奨 / 音が出ます (右上でミュート可)</p>
      </div>
    </div>

  </div>
</div>
<script src="game-data.js"></script>
<script src="game-core.js"></script>
<script src="app.js"></script>
</body>
</html>
